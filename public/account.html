<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員資料 | 一次買夠</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background: var(--nmd-bg); }
        .account-grid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:24px; align-items:start; }
        .profile-name { font-size:1.5rem; font-weight:800; color:var(--nmd-blue); margin:0 0 8px; }
        .profile-email { color:var(--nmd-muted); overflow-wrap:anywhere; }
        .post-count { font-size:2.4rem; font-weight:800; color:var(--nmd-blue); }
        @media(max-width:760px){ .account-grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠</a>
            <div class="search-wrapper"><input type="text" class="nav-search" placeholder="查詢硬體市價..." onkeydown="handleSearch(event)"><button class="search-btn" onclick="triggerSearch()">搜尋</button></div>
            <div class="header-actions">
                <div id="user-profile" style="display:flex;"><div class="avatar">U</div><span id="user-display-name" style="color:white;font-size:.95rem;">載入中...</span><div class="dropdown-menu"><a href="/account.html">會員資料</a><a href="#" onclick="logout()">登出</a></div></div>
            </div>
        </div>
        <nav class="main-nav"><a href="/">首頁</a><a href="/#recommend">智慧推薦</a><a href="/forum">討論區</a><a href="/scrape">市價查詢</a><a href="/benchmark-instructions.html">跑分教學</a></nav>
    </header>

    <main class="nmd-page">
        <div class="nmd-hero"><div><h1>會員資料</h1><p>管理你的顯示名稱與論壇身分。</p></div></div>
        <div class="account-grid">
            <section class="nmd-card nmd-card-pad">
                <p id="profile-name" class="profile-name">載入中...</p>
                <p id="profile-email" class="profile-email"></p>
                <hr style="border:0;border-top:1px solid #edf1f5;margin:24px 0;">
                <h2>修改顯示名稱</h2>
                <p class="nmd-muted">這個名稱會顯示在你的論壇文章與回覆旁。</p>
                <input id="account-name-input" class="nmd-field" maxlength="30" placeholder="輸入新的名稱">
                <button class="nmd-btn" style="margin-top:12px;" onclick="saveName()">儲存名稱</button>
                <p id="save-message" class="nmd-muted" aria-live="polite"></p>
            </section>
            <aside class="nmd-card nmd-card-pad">
                <h2>論壇參與</h2>
                <div id="post-count" class="post-count">0</div>
                <p class="nmd-muted">已發表討論文章</p>
                <a class="nmd-btn secondary" href="/forum">前往討論區</a>
            </aside>
        </div>
    </main>

    <script>
        const userEmail = localStorage.getItem('userEmail');
        const userName = localStorage.getItem('userName');
        if (!userEmail) window.location.href = '/login';

        document.getElementById('profile-email').textContent = userEmail || '';
        setDisplayedName(userName || (userEmail ? userEmail.split('@')[0] : ''));
        loadStats();

        function setDisplayedName(name) {
            document.getElementById('profile-name').textContent = name;
            document.getElementById('user-display-name').textContent = name;
            document.getElementById('account-name-input').value = name;
        }

        async function saveName() {
            const username = document.getElementById('account-name-input').value.trim();
            const message = document.getElementById('save-message');
            if (!username) { message.textContent = '請輸入顯示名稱。'; return; }
            const res = await fetch('/api/account/name', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ userEmail, username }) });
            const result = await res.json();
            if (!res.ok || !result.success) { message.textContent = result.message || '儲存失敗。'; return; }
            localStorage.setItem('userName', result.username);
            setDisplayedName(result.username);
            message.textContent = '名稱已更新。';
        }

        async function loadStats() {
            const res = await fetch(`/api/account/stats?userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            if (res.ok && result.success) document.getElementById('post-count').textContent = result.data.posts || 0;
        }

        function handleSearch(event){ if(event.key === 'Enter') triggerSearch(); }
        function triggerSearch(){ const q=document.querySelector('.nav-search').value.trim(); if(q) window.location.href=`/scrape?keyword=${encodeURIComponent(q)}`; }
        function logout(){ localStorage.removeItem('userEmail'); localStorage.removeItem('userName'); window.location.href='/'; }
    </script>
</body>
</html>
