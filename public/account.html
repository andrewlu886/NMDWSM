<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的帳戶 | 二手硬體交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* 主內容區 */
        .container { max-width: 800px; margin: 3rem auto; padding: 0 20px; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; color: var(--primary-color); }
        .info-row { margin-bottom: 15px; font-size: 1.1rem; }
        .info-row strong { display: inline-block; width: 100px; color: #555; }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <a href="/" class="logo">轉轉轉二手平台</a>
            
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品或文章..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">🔍</button>
            </div>

            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">
                    🛒 <span id="cart-count" class="cart-count">0</span>
                </a>
                
                <div id="auth-section">
                    <a href="/login" class="auth-btn">登入 / 註冊</a>
                </div>
                
                <div id="user-profile">
                    <div class="avatar">👤</div>
                    <span id="user-display-name" style="color: white; font-size: 0.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html" class="active">我的帳戶</a>
                        <a href="/products.html">我的商品</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/marketplace">🛒 商城</a>
            <a href="#">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/seller">賣家中心</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>基本資料</h2>
            <div class="info-row"><strong>登入信箱：</strong> <span id="account-email">讀取中...</span></div>
            <div class="info-row"><strong>會員身分：</strong> 一般會員</div>
            <div class="info-row"><strong>加入時間：</strong> 2026-05-01</div>
            <button class="btn-action">修改密碼</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const loggedInUser = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (!loggedInUser) {
                document.getElementById('user-profile').style.display = 'none';
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('account-email').innerText = '尚未登入';
            } else {
                // 已登入：顯示會員資料
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-display-name').innerText = userName ? userName : loggedInUser.split('@')[0];
                document.getElementById('account-email').innerText = loggedInUser;
            }
            updateCartCount();
        };

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            alert('已成功登出！');
            window.location.href = '/';
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            const cartCountEl = document.getElementById('cart-count');
            if(cartCountEl) cartCountEl.innerText = count;
        }

        function triggerSearch() {
            const input = document.querySelector('.nav-search');
            if (input && input.value.trim()) {
                alert('執行搜尋：' + input.value.trim());
            }
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                triggerSearch();
            }
        }
    </script>
</body>
</html>
