<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的交易 | 一次買夠二手交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .container { max-width: 1120px; margin: 2rem auto; padding: 0 20px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
        .page-head h2 { margin: 0; color: #1f2937; font-size: 1.75rem; }
        .summary { color: #667085; font-size: 0.95rem; }
        .tabs { display: flex; gap: 24px; border-bottom: 1px solid #d9e2ec; margin-bottom: 16px; }
        .tabs button { border: 0; background: transparent; padding: 12px 2px; color: #526579; font-weight: 900; cursor: pointer; border-bottom: 3px solid transparent; }
        .tabs button.active { color: var(--secondary-color); border-bottom-color: var(--secondary-color); }
        .order-list { display: grid; gap: 12px; }
        .order-card { background: #fff; border: 1px solid #e1e7ef; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 14px rgba(15, 23, 42, 0.06); }
        .order-head { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #edf1f5; color: #5b6b7d; font-size: 0.9rem; }
        .order-number { color: #26384d; font-weight: 900; }
        .order-body { display: grid; grid-template-columns: 92px 1fr 130px 120px 220px; gap: 14px; align-items: center; padding: 14px 16px; }
        .product-img { width: 92px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid #edf1f5; background: #eef2f7; }
        .product-title { color: #26384d; font-size: 1.03rem; line-height: 1.35; font-weight: 900; margin-bottom: 7px; }
        .seller { color: #667085; font-size: 0.94rem; }
        .price { color: #c94335; font-size: 1.06rem; font-weight: 900; text-align: right; }
        .status { justify-self: center; display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 0.86rem; font-weight: 900; white-space: nowrap; }
        .status.pending, .status.contacting { background: #eef6ff; color: #2563eb; }
        .status.completed { background: #fff6df; color: #a66a00; }
        .status.cancelled { background: #fff0f0; color: #c23a3a; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
        .actions a, .actions button { min-height: 34px; border-radius: 6px; padding: 8px 12px; font-weight: 900; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .view-btn { border: 1px solid #cfd8e3; background: #fff; color: #26384d; }
        .view-btn:hover { border-color: var(--secondary-color); color: var(--secondary-color); }
        .confirm-btn { border: 0; background: #f59e0b; color: #fff; }
        .cancel-btn { border: 0; background: #d95b66; color: #fff; }
        .actions button:disabled { background: #cfd6df; color: #667085; cursor: not-allowed; }
        .progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px 14px; }
        .progress-step { position: relative; display: flex; align-items: center; gap: 8px; color: #98a2b3; font-size: 0.86rem; font-weight: 800; }
        .progress-step::before { content: ""; width: 10px; height: 10px; border-radius: 999px; background: #cfd8e3; flex: 0 0 auto; }
        .progress-step.done { color: #2563eb; }
        .progress-step.done::before { background: var(--secondary-color); }
        .progress-step.cancelled { color: #c23a3a; }
        .progress-step.cancelled::before { background: #d95b66; }
        .seller-subnav { display: flex; gap: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); margin-bottom: 16px; }
        .seller-subnav a { text-decoration: none; color: #475467; font-weight: 800; padding: 9px 14px; border-radius: 6px; }
        .seller-subnav a.active, .seller-subnav a:hover { background: var(--secondary-color); color: #fff; }
        .empty { background: #fff; padding: 38px; text-align: center; border-radius: 8px; color: #667085; border: 1px solid #e1e7ef; }
        @media (max-width: 980px) {
            .order-body { grid-template-columns: 80px 1fr; }
            .product-img { width: 80px; height: 64px; }
            .price { text-align: left; }
            .status { justify-self: start; }
            .actions { justify-content: flex-start; }
            .progress { grid-template-columns: 1fr; }
        }
        @media (max-width: 620px) {
            .page-head, .order-head { flex-direction: column; align-items: flex-start; }
            .tabs { gap: 18px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠二手交易平台</a>
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">搜尋</button>
            </div>
            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">購物車 <span id="cart-count" class="cart-count">0</span></a>
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile">
                    <div class="avatar">U</div>
                    <span id="user-display-name" style="color: white; font-size: 0.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="/products.html">我的商品</a>
                        <a href="/transactions">我的交易</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/marketplace">商城</a>
            <a href="/#recommend">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/seller">賣家中心</a>
        </nav>
    </header>

    <main class="container">
        <div class="seller-subnav">
            <a href="/seller">新增商品</a>
            <a href="/products.html">我的商品</a>
            <a href="/transactions" class="active">我的交易</a>
        </div>
        <div class="page-head">
            <h2>我的交易</h2>
            <div id="summary" class="summary">載入中...</div>
        </div>

        <div class="tabs">
            <button id="buyer-tab" class="active" onclick="switchRole('buyer')">我想買的</button>
            <button id="seller-tab" onclick="switchRole('seller')">買家需求</button>
        </div>

        <section id="orders-container" class="empty">載入中...</section>
    </main>

    <script>
        let currentRole = 'buyer';
        let orders = [];

        window.onload = async function() {
            const userEmail = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (!userEmail) {
                alert('請先登入才能查看交易');
                window.location.href = '/login';
                return;
            }

            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-profile').style.display = 'flex';
            document.getElementById('user-display-name').innerText = userName || userEmail.split('@')[0];
            await updateCartCount();
            await loadOrders();
        };

        function placeholderImage() {
            return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 450%22%3E%3Crect width=%22600%22 height=%22450%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%22300%22 y=%22235%22 text-anchor=%22middle%22 fill=%22%23667285%22 font-size=%2230%22%3ENo Image%3C/text%3E%3C/svg%3E';
        }

        function label(status) {
            return {
                pending: '洽談中',
                contacting: '洽談中',
                completed: '已成交',
                cancelled: '已取消'
            }[status] || status;
        }

        async function switchRole(role) {
            currentRole = role;
            document.getElementById('buyer-tab').classList.toggle('active', role === 'buyer');
            document.getElementById('seller-tab').classList.toggle('active', role === 'seller');
            await loadOrders();
        }

        async function loadOrders() {
            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/transactions?role=${currentRole}&userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            orders = result.success ? result.data : [];
            renderOrders();
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            document.getElementById('summary').innerText = `${orders.length} 筆${currentRole === 'buyer' ? '購買需求' : '買家需求'}`;

            if (!orders.length) {
                container.className = 'empty';
                container.innerText = currentRole === 'buyer' ? '目前沒有提出購買需求' : '目前沒有收到買家需求';
                return;
            }

            container.className = 'order-list';
            container.innerHTML = orders.map(order => `
                <article class="order-card">
                    <div class="order-head">
                        <span class="order-number">交易編號 #${order.id}</span>
                        <span>建立時間：${formatDate(order.createdAt)}</span>
                    </div>
                    <div class="order-body">
                        <img class="product-img" src="${order.image || placeholderImage()}" alt="${escapeHtml(order.title)}">
                        <div>
                            <div class="product-title">${escapeHtml(order.title)}</div>
                            <div class="seller">${currentRole === 'buyer' ? '賣家' : '買家'}：${escapeHtml(currentRole === 'buyer' ? order.seller || '使用者' : order.buyer || '使用者')}</div>
                        </div>
                        <div class="price">NT$ ${Number(order.price).toLocaleString()}</div>
                        <span class="status ${order.status}">${label(order.status)}</span>
                        <div class="actions">
                            <a class="view-btn" href="/product?id=${order.productId}">查看商品</a>
                            ${currentRole === 'seller' ? `<button class="confirm-btn" onclick="confirmOrder(${order.id})" ${order.status === 'completed' || order.status === 'cancelled' ? 'disabled' : ''}>賣家確認</button>` : ''}
                            <button class="cancel-btn" onclick="cancelOrder(${order.id})" ${order.status === 'cancelled' || order.status === 'completed' ? 'disabled' : ''}>取消交易</button>
                        </div>
                    </div>
                    ${renderProgress(order.status)}
                </article>
            `).join('');
        }

        function renderProgress(status) {
            if (status === 'cancelled') {
                return `
                    <div class="progress">
                        <div class="progress-step done">訂單建立</div>
                        <div class="progress-step cancelled">已取消</div>
                        <div class="progress-step">已成交</div>
                    </div>
                `;
            }

            const completed = status === 'completed';
            return `
                <div class="progress">
                    <div class="progress-step done">訂單建立</div>
                    <div class="progress-step done">賣家確認</div>
                    <div class="progress-step ${completed ? 'done' : ''}">已成交</div>
                </div>
            `;
        }

        async function confirmOrder(id) {
            await updateOrder(id, 'completed', '確認這筆交易已成交嗎？');
        }

        async function cancelOrder(id) {
            await updateOrder(id, 'cancelled', '確定要取消這筆交易嗎？');
        }

        async function updateOrder(id, status, message) {
            if (!confirm(message)) return;

            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/transactions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, status })
            });
            const result = await res.json();
            if (!result.success) alert(result.message || '更新失敗');
            await loadOrders();
        }

        async function updateCartCount() {
            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/cart?userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            const items = result.success ? result.data : [];
            document.getElementById('cart-count').innerText = items.reduce((total, item) => total + (parseInt(item.quantity, 10) || 1), 0);
        }

        function triggerSearch() {
            const query = document.querySelector('.nav-search').value.trim();
            if (query) window.location.href = `/marketplace?q=${encodeURIComponent(query)}`;
        }

        function handleSearch(event) {
            if (event.key === 'Enter') triggerSearch();
        }

        function formatDate(value) {
            if (!value) return '';
            return new Date(value).toLocaleString('zh-TW', { hour12: false });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            window.location.href = '/';
        }
    </script>
</body>
</html>
