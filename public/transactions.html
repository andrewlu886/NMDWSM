<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購買清單 | 一次買夠二手交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            background:
                radial-gradient(circle at 12% 10%, rgba(52, 152, 219, 0.12), transparent 26rem),
                linear-gradient(180deg, #f8fbff 0%, #f1f5f9 100%);
        }

        .container {
            max-width: 1260px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .transaction-layout {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 28px;
            align-items: start;
        }

        .transaction-main {
            min-width: 0;
        }

        .transaction-sidebar {
            position: sticky;
            top: 152px;
        }

        .dropdown-menu {
            min-width: 184px;
            border-radius: 3px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.16);
        }

        .dropdown-menu::before {
            content: "";
            position: absolute;
            top: -9px;
            right: 42px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-left: 1px solid #e5e7eb;
            border-top: 1px solid #e5e7eb;
            transform: rotate(45deg);
        }

        .dropdown-menu a {
            position: relative;
            padding: 16px 22px;
            font-size: 1rem;
        }

        .buyer-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .buyer-title h1 {
            margin: 0 0 8px;
            color: #1f2937;
            font-size: clamp(1.7rem, 2.6vw, 2.35rem);
        }

        .buyer-title p {
            margin: 0;
            color: #667085;
            line-height: 1.6;
        }

        .wallet-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: center;
            margin-bottom: 18px;
            padding: 18px 20px;
            border: 1px solid #cfe2f6;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #eef7ff 100%);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
        }

        .wallet-card.hidden {
            display: none;
        }

        .wallet-label {
            color: #667085;
            font-size: 0.9rem;
            font-weight: 900;
        }

        .wallet-balance {
            margin-top: 6px;
            color: #1f6fad;
            font-size: clamp(1.55rem, 3vw, 2.15rem);
            font-weight: 900;
            line-height: 1;
        }

        .wallet-note {
            margin-top: 8px;
            color: #667085;
            line-height: 1.5;
        }

        .wallet-reset-btn,
        .pay-btn,
        .ship-btn,
        .refund-btn {
            border: 0;
            background: var(--secondary-color);
            color: #fff;
        }

        .ship-btn {
            background: #14a06f;
        }

        .refund-btn {
            background: #f59e0b;
        }

        .role-switch {
            display: inline-flex;
            gap: 8px;
            padding: 8px;
            background: #fff;
            border: 1px solid #dde7f2;
            border-radius: 999px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
        }

        .role-switch button {
            border: 0;
            border-radius: 999px;
            padding: 10px 18px;
            background: transparent;
            color: #526579;
            cursor: pointer;
            font-weight: 900;
        }

        .role-switch button.active {
            background: var(--secondary-color);
            color: #fff;
        }

        .order-shell {
            background: #fff;
            border: 1px solid #e0e7ef;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.07);
            overflow: hidden;
        }

        .status-tabs {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            border-bottom: 1px solid #edf1f5;
            background: #fff;
        }

        .status-tabs button {
            border: 0;
            border-right: 1px solid #f0f3f8;
            background: #fff;
            color: #26384d;
            padding: 17px 8px 14px;
            cursor: pointer;
            font-weight: 900;
            font-size: 1rem;
            position: relative;
        }

        .status-tabs button:last-child {
            border-right: 0;
        }

        .status-tabs button.active {
            color: var(--accent-color);
        }

        .status-tabs button.active::after {
            content: "";
            position: absolute;
            left: 18%;
            right: 18%;
            bottom: 0;
            height: 3px;
            border-radius: 999px 999px 0 0;
            background: var(--accent-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #edf1f5;
            color: #667085;
            font-weight: 800;
        }

        .order-list {
            display: grid;
            gap: 14px;
            padding: 18px;
        }

        .order-card {
            border: 1px solid #e1e7ef;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .order-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 16px;
            background: #f9fbfd;
            border-bottom: 1px solid #edf1f5;
            color: #5b6b7d;
            font-size: 0.92rem;
        }

        .order-number {
            color: #26384d;
            font-weight: 900;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 5px 10px;
            background: #eef6ff;
            color: #2563eb;
            font-weight: 900;
            font-size: 0.86rem;
        }

        .status-pill.completed {
            background: #e9f8f3;
            color: #0f9f6e;
        }

        .status-pill.cancelled {
            background: #f3f4f6;
            color: #667085;
        }

        .order-body {
            display: grid;
            grid-template-columns: 92px minmax(0, 1fr) 110px 90px 130px;
            gap: 16px;
            align-items: center;
            padding: 16px;
        }

        .order-progress {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid #edf1f5;
            background: #fbfdff;
        }

        .progress-step {
            position: relative;
            display: grid;
            justify-items: center;
            gap: 7px;
            color: #98a2b3;
            font-size: 0.82rem;
            font-weight: 900;
            text-align: center;
        }

        .progress-step::before {
            content: "";
            position: absolute;
            top: 9px;
            left: calc(-50% + 14px);
            right: calc(50% + 14px);
            height: 2px;
            background: #d8e2ee;
        }

        .progress-step:first-child::before {
            display: none;
        }

        .progress-dot {
            position: relative;
            z-index: 1;
            width: 20px;
            height: 20px;
            border-radius: 999px;
            border: 3px solid #d8e2ee;
            background: #fff;
        }

        .progress-step.done,
        .progress-step.active {
            color: #2364a0;
        }

        .progress-step.done::before,
        .progress-step.active::before {
            background: var(--secondary-color);
        }

        .progress-step.done .progress-dot,
        .progress-step.active .progress-dot {
            border-color: var(--secondary-color);
            background: var(--secondary-color);
        }

        .progress-step.active .progress-dot {
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.16);
        }

        .order-progress.terminal {
            grid-template-columns: 1fr;
            justify-items: start;
            color: #667085;
            font-weight: 900;
        }

        .terminal-progress-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 999px;
            padding: 8px 12px;
            background: #f3f4f6;
            color: #667085;
        }

        .terminal-progress-pill.return {
            background: #fff7ed;
            color: #b45309;
        }

        .product-img {
            width: 92px;
            height: 74px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #edf1f5;
            background: #eef2f7;
        }

        .product-title {
            color: #26384d;
            font-size: 1.04rem;
            line-height: 1.4;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .order-meta {
            color: #667085;
            font-size: 0.94rem;
            display: grid;
            gap: 4px;
        }

        .table-label {
            display: block;
            color: #98a2b3;
            font-size: 0.78rem;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .money {
            color: #d9463e;
            font-size: 1.06rem;
            font-weight: 900;
            text-align: right;
        }

        .quantity {
            color: #26384d;
            text-align: center;
            font-weight: 900;
        }

        .order-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 16px;
            border-top: 1px solid #edf1f5;
            background: #fff;
        }

        .note {
            color: #667085;
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions a,
        .actions button {
            min-height: 36px;
            border-radius: 8px;
            padding: 8px 13px;
            font-weight: 900;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.92rem;
        }

        .view-btn {
            border: 1px solid #cfd8e3;
            background: #fff;
            color: #26384d;
        }

        .view-btn:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        .cancel-btn {
            border: 0;
            background: #d95b66;
            color: #fff;
        }

        .cancel-btn:disabled {
            background: #e5e7eb;
            color: #667085;
            cursor: not-allowed;
        }

        .empty {
            margin: 18px;
            padding: 44px 24px;
            text-align: center;
            border-radius: 12px;
            color: #667085;
            border: 1px dashed #c9d5e3;
            background: #fbfdff;
            font-weight: 800;
        }

        @media (max-width: 980px) {
            .transaction-layout {
                grid-template-columns: 1fr;
            }

            .transaction-sidebar {
                position: static;
            }

            .buyer-toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .wallet-card {
                grid-template-columns: 1fr;
            }

            .status-tabs {
                display: flex;
                overflow-x: auto;
            }

            .status-tabs button {
                min-width: 108px;
            }

            .order-body {
                grid-template-columns: 84px minmax(0, 1fr) 120px;
            }

            .order-progress {
                overflow-x: auto;
            }

            .quantity,
            .money {
                text-align: left;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 12px;
            }

            .summary-row,
            .order-head,
            .order-foot {
                align-items: flex-start;
                flex-direction: column;
            }

            .order-body {
                grid-template-columns: 1fr;
            }

            .order-progress {
                grid-template-columns: 1fr;
            }

            .progress-step {
                justify-items: start;
                grid-template-columns: 24px 1fr;
                text-align: left;
            }

            .progress-step::before {
                display: none;
            }

            .product-img {
                width: 100%;
                height: 170px;
            }

            .role-switch {
                width: 100%;
            }

            .wallet-reset-btn {
                width: 100%;
            }

            .role-switch button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠二手交易平台</a>
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">搜尋</button>
            </div>
            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">購物車<span id="cart-count" class="cart-count">0</span></a>
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile">
                    <div class="avatar">U</div>
                    <span id="user-display-name" style="color: white; font-size: 0.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="/transactions">購買清單</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/marketplace">商城</a>
            <a href="/#recommend">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/seller">賣家中心</a>
        </nav>
    </header>

    <main class="container transaction-layout">
        <aside class="nmd-card nmd-card-pad seller-sidebar transaction-sidebar">
            <h2>交易中心</h2>
            <a id="side-buyer-link" href="/transactions?role=buyer" class="seller-side-link active">購買清單</a>
            <a id="side-seller-link" href="/transactions?role=seller" class="seller-side-link">我的銷售</a>
            <a href="/products.html" class="seller-side-link">我的商品</a>
            <a href="/seller#product-form-section" class="seller-side-link">新增商品</a>
            <a href="/scrape" class="seller-side-link">市價查詢</a>
            <a href="/#recommend" class="seller-side-link">智慧推薦</a>
            <a href="/forum" class="seller-side-link">討論區</a>
        </aside>

        <div class="transaction-main">
            <div class="buyer-toolbar">
                <div class="buyer-title">
                    <h1 id="page-title">購買清單</h1>
                    <p id="page-desc">查看你的二手零件購買紀錄，包含待付款、待出貨與已完成訂單。</p>
                </div>
                <div class="role-switch" aria-label="交易角色切換">
                    <button id="buyer-tab" class="active" type="button" onclick="switchRole('buyer')">我是買家</button>
                    <button id="seller-tab" type="button" onclick="switchRole('seller')">我是賣家</button>
                </div>
            </div>

            <section id="wallet-card" class="wallet-card" aria-label="展示用虛擬餘額">
                <div>
                    <div class="wallet-label">展示用虛擬餘額</div>
                    <div id="wallet-balance" class="wallet-balance">NT$ 0</div>
                    <div class="wallet-note">此餘額只保存在本瀏覽器，用於展示付款、扣款與退貨流程，不代表真實金流。</div>
                </div>
                <button class="wallet-reset-btn" type="button" onclick="resetWallet()">重置為 NT$ 1,000,000</button>
            </section>

            <section class="order-shell">
                <div id="status-tabs" class="status-tabs"></div>
                <div class="summary-row">
                    <span id="summary">正在載入購買紀錄...</span>
                    <span>數量預設 1，總價依交易金額顯示</span>
                </div>
                <div id="orders-container" class="empty">正在載入購買紀錄...</div>
            </section>
        </div>
    </main>

    <script>
        const STATUS_TABS = [
            { key: 'all', label: '全部' },
            { key: 'pending', label: '待付款' },
            { key: 'paid', label: '待出貨' },
            { key: 'completed', label: '已完成' },
            { key: 'cancelled', label: '不成立' },
            { key: 'refund', label: '退貨' }
        ];
        const DEMO_WALLET_KEY = 'demoWalletBalance';
        const DEMO_WALLET_INITIAL_BALANCE = 1000000;

        let currentRole = 'buyer';
        let currentStatus = 'all';
        let orders = [];

        window.onload = async function() {
            const userEmail = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (!userEmail) {
                alert('請先登入後再查看購買清單');
                window.location.href = '/login';
                return;
            }

            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-profile').style.display = 'flex';
            document.getElementById('user-display-name').innerText = userName || userEmail.split('@')[0];

            const initialRole = new URLSearchParams(window.location.search).get('role');
            if (initialRole === 'seller') currentRole = 'seller';
            syncRoleUi();
            renderStatusTabs();
            initWallet();
            await updateCartCount();
            await loadOrders();
        };

        function renderStatusTabs() {
            const tabContainer = document.getElementById('status-tabs');
            tabContainer.innerHTML = STATUS_TABS.map(tab => `
                <button class="${currentStatus === tab.key ? 'active' : ''}" type="button" onclick="switchStatus('${tab.key}')">
                    ${tab.label}
                </button>
            `).join('');
        }

        async function switchRole(role) {
            currentRole = role;
            currentStatus = 'all';
            syncRoleUi();
            renderWallet();
            renderStatusTabs();
            await loadOrders();
        }

        function syncRoleUi() {
            const role = currentRole;
            document.getElementById('buyer-tab').classList.toggle('active', role === 'buyer');
            document.getElementById('seller-tab').classList.toggle('active', role === 'seller');
            document.getElementById('side-buyer-link').classList.toggle('active', role === 'buyer');
            document.getElementById('side-seller-link').classList.toggle('active', role === 'seller');
            document.getElementById('page-title').innerText = role === 'buyer' ? '購買清單' : '我的銷售';
            document.getElementById('page-desc').innerText = role === 'buyer'
                ? '查看你的二手零件購買紀錄，包含待付款、待出貨與已完成訂單。'
                : '查看買家送出的交易紀錄，賣家完整流程可在下一階段再擴充。';
        }

        function switchStatus(status) {
            currentStatus = status;
            renderStatusTabs();
            renderOrders();
        }

        async function loadOrders() {
            const userEmail = localStorage.getItem('userEmail');
            const container = document.getElementById('orders-container');
            container.className = 'empty';
            container.innerText = currentRole === 'buyer' ? '正在載入購買紀錄...' : '正在載入銷售紀錄...';

            try {
                const res = await fetch(`/api/transactions?role=${currentRole}&userEmail=${encodeURIComponent(userEmail)}`);
                const result = await res.json();
                orders = result.success ? result.data : [];
            } catch (error) {
                console.error('載入交易資料失敗:', error);
                orders = [];
            }

            renderOrders();
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            const visibleOrders = orders.filter(order => statusMatches(order.status));
            const roleText = currentRole === 'buyer' ? '購買紀錄' : '銷售紀錄';
            const statusLabel = STATUS_TABS.find(tab => tab.key === currentStatus)?.label || '全部';
            document.getElementById('summary').innerText = `${visibleOrders.length} 筆${statusLabel === '全部' ? '' : statusLabel}${roleText}`;
            renderWallet();

            if (!visibleOrders.length) {
                container.className = 'empty';
                container.innerText = currentRole === 'buyer' ? '目前沒有購買紀錄' : '目前沒有銷售紀錄';
                return;
            }

            container.className = 'order-list';
            container.innerHTML = visibleOrders.map(order => renderOrderCard(order)).join('');
        }

        function renderOrderCard(order) {
            const quantity = parseInt(order.quantity, 10) || 1;
            const unitPrice = parseInt(order.price, 10) || 0;
            const total = unitPrice * quantity;
            const oppositeLabel = currentRole === 'buyer' ? '賣家' : '買家';
            const oppositeName = currentRole === 'buyer' ? order.seller || '平台使用者' : order.buyer || '平台使用者';
            const status = mapStatus(order.status);
            const canCancel = currentRole === 'buyer' && order.status === 'pending';
            const canPay = currentRole === 'buyer' && order.status === 'pending';
            const canShip = currentRole === 'seller' && order.status === 'paid';
            const canRefund = currentRole === 'buyer' && ['paid', 'completed'].includes(order.status);

            return `
                <article class="order-card">
                    <div class="order-head">
                        <div>
                            <span class="order-number">訂單編號 #${order.id}</span>
                            <span>｜建立時間 ${formatDate(order.createdAt)}</span>
                        </div>
                        <span class="status-pill ${status.className}">${status.label}</span>
                    </div>
                    <div class="order-body">
                        <img class="product-img" src="${escapeHtml(order.image || placeholderImage())}" alt="${escapeHtml(order.title || '商品圖片')}">
                        <div>
                            <div class="product-title">${escapeHtml(order.title || '商品名稱')}</div>
                            <div class="order-meta">
                                <span>${oppositeLabel}：${escapeHtml(oppositeName)}</span>
                                <span>交易說明：${escapeHtml(order.note || '二手零件交易紀錄')}</span>
                            </div>
                        </div>
                        <div>
                            <span class="table-label">單價</span>
                            <div class="money">NT$ ${unitPrice.toLocaleString()}</div>
                        </div>
                        <div>
                            <span class="table-label">數量</span>
                            <div class="quantity">${quantity}</div>
                        </div>
                        <div>
                            <span class="table-label">總價</span>
                            <div class="money">NT$ ${total.toLocaleString()}</div>
                        </div>
                    </div>
                    ${renderOrderProgress(order.status)}
                    <div class="order-foot">
                        <div class="note">${status.help}</div>
                        <div class="actions">
                            <a class="view-btn" href="/product?id=${order.productId}">查看商品</a>
                            ${canPay ? `<button class="pay-btn" onclick="payOrder(${order.id})">付款</button>` : ''}
                            ${canShip ? `<button class="ship-btn" onclick="shipOrder(${order.id})">出貨</button>` : ''}
                            ${canRefund ? `<button class="refund-btn" onclick="refundOrder(${order.id})">退貨</button>` : ''}
                            ${canCancel ? `<button class="cancel-btn" onclick="cancelOrder(${order.id})">取消訂單</button>` : ''}
                        </div>
                    </div>
                </article>
            `;
        }

        function renderOrderProgress(status) {
            if (status === 'cancelled') {
                return '<div class="order-progress terminal"><span class="terminal-progress-pill">流程已結束：不成立</span></div>';
            }
            if (status === 'refund' || status === 'refunded') {
                return '<div class="order-progress terminal"><span class="terminal-progress-pill return">流程已結束：退貨</span></div>';
            }

            const steps = ['建立訂單', '已付款', '已出貨', '已完成'];
            const activeIndex = {
                pending: 0,
                paid: 1,
                completed: 3
            }[status] ?? 0;

            return `
                <div class="order-progress" aria-label="交易進度">
                    ${steps.map((step, index) => {
                        const stepClass = index < activeIndex ? 'done' : (index === activeIndex ? 'active' : '');
                        return `<div class="progress-step ${stepClass}"><span class="progress-dot"></span><span>${step}</span></div>`;
                    }).join('')}
                </div>
            `;
        }

        function statusMatches(status) {
            if (currentStatus === 'all') return true;
            if (currentStatus === 'paid') return status === 'paid';
            if (currentStatus === 'refund') return status === 'refund' || status === 'refunded';
            return status === currentStatus;
        }

        function mapStatus(status) {
            const statusMap = {
                pending: { label: '待付款', className: '', help: '買家已送出訂單，可用於展示尚未付款的交易。' },
                paid: { label: '待出貨', className: '', help: '此狀態保留給未來付款後的出貨展示。' },
                completed: { label: '已完成', className: 'completed', help: '此筆交易已完成，可回到商品頁查看商品資訊。' },
                cancelled: { label: '不成立', className: 'cancelled', help: '此筆交易已取消或不成立。' },
                refund: { label: '退貨', className: 'cancelled', help: '此狀態保留給未來退貨展示，展示用餘額會退回買家。' },
                refunded: { label: '退貨', className: 'cancelled', help: '此狀態保留給未來退貨展示，展示用餘額會退回買家。' }
            };
            return statusMap[status] || { label: '交易紀錄', className: '', help: '此筆資料為交易紀錄。' };
        }

        async function cancelOrder(id) {
            if (!confirm('確定要取消這筆訂單嗎？')) return;

            const order = orders.find(item => Number(item.id) === Number(id));
            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/transactions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, status: 'cancelled' })
            });
            const result = await res.json();
            if (!result.success) {
                alert(result.message || '取消訂單失敗');
            } else if (currentRole === 'buyer' && order?.status === 'paid') {
                addWalletBalance(getOrderTotal(order));
                alert('已取消訂單，展示用餘額已退回。');
            }
            await loadOrders();
        }

        async function payOrder(id) {
            const order = orders.find(item => Number(item.id) === Number(id));
            if (!order || order.status !== 'pending') return;

            const total = getOrderTotal(order);
            const balance = getWalletBalance();
            if (balance < total) {
                alert(`展示用餘額不足，目前餘額為 NT$ ${balance.toLocaleString()}。`);
                return;
            }

            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/transactions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, status: 'paid' })
            });
            const result = await res.json();
            if (!result.success) {
                alert(result.message || '付款失敗');
                return;
            }

            setWalletBalance(balance - total);
            alert('付款成功，訂單已更新為待出貨。');
            await loadOrders();
        }

        async function shipOrder(id) {
            const order = orders.find(item => Number(item.id) === Number(id));
            if (!order || order.status !== 'paid') return;
            if (!confirm('確定要將這筆訂單標記為已出貨並完成交易嗎？')) return;

            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/transactions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, status: 'completed' })
            });
            const result = await res.json();
            if (!result.success) {
                alert(result.message || '出貨失敗');
                return;
            }

            alert('已出貨，訂單已更新為已完成。');
            await loadOrders();
        }

        async function refundOrder(id) {
            const order = orders.find(item => Number(item.id) === Number(id));
            if (!order || !['paid', 'completed'].includes(order.status)) return;
            if (!confirm('確定要申請退貨並退回展示用餘額嗎？')) return;

            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/transactions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, status: 'refund' })
            });
            const result = await res.json();
            if (!result.success) {
                alert(result.message || '退貨失敗');
                return;
            }

            addWalletBalance(getOrderTotal(order));
            alert('退貨成功，展示用餘額已退回。');
            await loadOrders();
        }

        function initWallet() {
            if (localStorage.getItem(DEMO_WALLET_KEY) === null) {
                setWalletBalance(DEMO_WALLET_INITIAL_BALANCE);
                return;
            }
            renderWallet();
        }

        function renderWallet() {
            const card = document.getElementById('wallet-card');
            const balanceEl = document.getElementById('wallet-balance');
            if (!card || !balanceEl) return;

            card.classList.toggle('hidden', currentRole !== 'buyer');
            balanceEl.innerText = `NT$ ${getWalletBalance().toLocaleString()}`;
        }

        function resetWallet() {
            setWalletBalance(DEMO_WALLET_INITIAL_BALANCE);
        }

        function getWalletBalance() {
            const value = parseInt(localStorage.getItem(DEMO_WALLET_KEY), 10);
            return Number.isFinite(value) ? value : DEMO_WALLET_INITIAL_BALANCE;
        }

        function setWalletBalance(value) {
            localStorage.setItem(DEMO_WALLET_KEY, String(Math.max(0, parseInt(value, 10) || 0)));
            renderWallet();
        }

        function addWalletBalance(amount) {
            setWalletBalance(getWalletBalance() + (parseInt(amount, 10) || 0));
        }

        function getOrderTotal(order) {
            const quantity = parseInt(order.quantity, 10) || 1;
            const unitPrice = parseInt(order.price, 10) || 0;
            return unitPrice * quantity;
        }

        async function updateCartCount() {
            const userEmail = localStorage.getItem('userEmail');
            const cartCountEl = document.getElementById('cart-count');
            if (!cartCountEl || !userEmail) return;
            const res = await fetch(`/api/cart?userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            const items = result.success ? result.data : [];
            cartCountEl.innerText = items.reduce((total, item) => total + (parseInt(item.quantity, 10) || 1), 0);
        }

        function triggerSearch() {
            const query = document.querySelector('.nav-search').value.trim();
            if (query) window.location.href = `/marketplace?q=${encodeURIComponent(query)}`;
        }

        function handleSearch(event) {
            if (event.key === 'Enter') triggerSearch();
        }

        function formatDate(value) {
            if (!value) return '';
            const normalized = String(value).includes('T') ? value : String(value).replace(' ', 'T');
            return new Date(normalized).toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        function placeholderImage() {
            return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 450%22%3E%3Crect width=%22600%22 height=%22450%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%22300%22 y=%22235%22 text-anchor=%22middle%22 fill=%22%23667285%22 font-size=%2230%22%3ENo Image%3C/text%3E%3C/svg%3E';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            window.location.href = '/';
        }
    </script>
</body>
</html>
