<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一次買夠 | 電腦硬體選購助手</title>
    <!-- 引入 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        /* --- 基礎色彩與變數設定 --- */
        :root {
            --primary-color: #2563eb;      /* 科技藍 */
            --primary-hover: #1d4ed8;
            --secondary-color: #0ea5e9;    /* 亮藍色點綴 */
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* --- 頂部導覽列 (Header) 優化 --- */
        header {
            background: #ffffff;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-wrapper {
            display: flex;
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .nav-search {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.95rem;
            transition: all 0.3s;
            background: #f1f5f9;
        }

        .nav-search:focus {
            background: #ffffff;
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .header-actions .auth-btn {
            background: var(--primary-color);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        .header-actions .auth-btn:hover {
            background: var(--primary-hover);
        }

        /* 會員下拉選單 */
        #user-profile {
            display: none;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            position: relative;
        }
        #user-display-name { color: var(--text-main) !important; font-weight: 500;}
        .avatar { background: #e2e8f0; padding: 5px; border-radius: 50%; }
        
        .main-nav {
            background: var(--primary-color);
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 10px 0;
        }
        
        .main-nav a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        
        .main-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }

        /* --- 主內容區 --- */
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 20px; }
        
        /* Hero 區塊 */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            border-radius: 16px;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="2" fill="rgba(255,255,255,0.05)"/></svg>');
            pointer-events: none;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 15px; margin-top: 0; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .hero p { font-size: 1.1rem; color: #cbd5e1; max-width: 600px; margin: 0 auto; }
        
        /* 功能卡片區 */
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
        .card { 
            background: var(--card-bg); 
            padding: 2rem; 
            border-radius: 16px; 
            box-shadow: var(--shadow-md); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s; 
            border: 1px solid var(--border-color); 
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: var(--shadow-lg); 
        }
        .card h3 { 
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 0; 
            font-size: 1.3rem;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }
        .card h3::before {
            content: '';
            display: block;
            width: 4px;
            height: 24px;
            background: var(--secondary-color);
            border-radius: 2px;
        }
        
        /* 智慧推薦表單 */
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
        input[type="number"], select { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            transition: all 0.2s;
            background-color: #f8fafc;
        }
        input[type="number"]:focus, select:focus { 
            border-color: var(--primary-color); 
            background-color: #ffffff;
            outline: none; 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .btn-action {
            display: block;
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
        }
        .btn-action:hover { background: var(--primary-hover); }
        .btn-action:active { transform: scale(0.98); }

        /* 結果顯示區塊 */
        #result-display { 
            margin-top: 25px; 
            display: none; 
            text-align: left; 
            font-size: 0.95rem; 
        }

        /* JavaScript 生成的卡片樣式補強 */
        .result-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            margin-top: 15px;
            padding: 16px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s;
        }
        .result-card:hover {
            border-color: var(--primary-color);
        }
        .tag-badge {
            display: inline-block;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-right: 6px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <a href="/" class="logo">⚡ 一次買夠</a>
            
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="查詢硬體市價..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">🔍</button>
            </div>

            <div class="header-actions">
                <div id="auth-section">
                    <a href="/login" class="auth-btn">登入 / 註冊</a>
                </div>
                
                <!-- 登入後顯示的會員頭像與下拉選單區塊 -->
                <div id="user-profile">
                    <div class="avatar">👤</div>
                    <span id="user-display-name">載入中...</span>
                    <!-- 隱藏的下拉選單可透過 JS 展開 -->
                    <div class="dropdown-menu" style="display:none; position:absolute; top:40px; right:0; background:#fff; border:1px solid #ddd; padding:10px; border-radius:8px; box-shadow:var(--shadow-md);">
                        <a href="/account.html" style="display:block; padding:5px 0; color:#333; text-decoration:none;">我的帳戶</a>
                        <a href="#" onclick="logout()" style="display:block; padding:5px 0; color:red; text-decoration:none;">登出</a>
                    </div>
                </div>
            </div>
        </div>
        
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/#recommend">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/benchmark-instructions.html">跑分教學</a>
            <a href="/tools">零件查詢與瓦數計算工具</a>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <h1>讓電腦硬體選購更科學</h1>
            <p>整合即時市價、規格分析與跑分知識，幫你在預算內找到最完美的電腦配置。</p>
        </section>

        <section id="recommend" class="features">
            <div class="card">
                <h3>硬體跑分與檢測</h3>
                <p>了解如何透過壓力測試與跑分資料，精準判讀硬體效能與穩定性。</p>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem;">從 CPU、記憶體到顯示卡，依照教學取得可比較的測試結果，拒絕被行銷話術欺騙。</p>
                <a class="btn-action" href="/benchmark-instructions.html" style="text-decoration:none;">📖 查看跑分教學</a>
            </div>

            <div class="card">
                <h3>AI 智慧配置推薦</h3>
                <div class="form-group">
                    <label>商品種類</label>
                    <select id="productType">
                        <option value="desktop">🖥️ 套裝主機 (Desktop)</option>
                        <option value="laptop">💻 筆記型電腦 (Laptop)</option>
                        <option value="component">⚙️ 核心零件 (CPU/顯卡)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>預算範圍 (NTD)</label>
                    <input type="number" id="budget" placeholder="例如: 35000">
                </div>
                <div class="form-group">
                    <label>主要用途</label>
                    <select id="usage">
                        <option value="gaming">🎮 3A 遊戲專用</option>
                        <option value="office">💼 高性能文書/輕度影音</option>
                    </select>
                </div>
                <button class="btn-action" onclick="runRecommend()">✨ 立即生成推薦清單</button>
                <div id="result-display"></div>
            </div>
        </section>
    </div>

    <script>
        // --- 登入狀態檢查 ---
        window.onload = function() {
            const loggedInUser = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (loggedInUser) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-display-name').innerText = userName ? userName : loggedInUser.split('@')[0];
            }
            
            // 簡易的選單開關邏輯
            document.getElementById('user-profile').addEventListener('click', function() {
                const menu = this.querySelector('.dropdown-menu');
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            });
        };

        // 登出功能
        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            alert('已成功登出！');
            window.location.reload();
        }

        // --- 搜尋功能 ---
        function handleSearch(event) {
            if (event.key === 'Enter') {
                triggerSearch();
            }
        }
        
        function triggerSearch() {
            const input = document.querySelector('.nav-search');
            if (input && input.value.trim()) {
                window.location.href = `/scrape?keyword=${encodeURIComponent(input.value.trim())}`;
            }
        }

        // --- 智慧推薦邏輯 ---
        async function runRecommend() {
            const budget = document.getElementById('budget').value;
            const usage = document.getElementById('usage').value;
            const productType = document.getElementById('productType').value; 

            if(!budget) return alert('請先輸入您的預算！');

            const res = document.getElementById('result-display');
            
            try {
                res.style.display = 'block';
                res.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--text-muted); background: #f8fafc; border-radius: 8px;">
                        <span style="font-size: 1.5rem; display: block; margin-bottom: 10px;">⏳</span>
                        系統正在為您即時爬取與分析最新行情，請稍候...
                    </div>`;

                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ budget: parseInt(budget), usage: usage, productType: productType }) 
                });

                if (!response.ok) throw new Error('API 回應錯誤');
                
                const result = await response.json();

                // 低預算警告
                let warningHtml = '';
                const minGamingBudget = 30000; 
                if (usage === 'gaming' && productType !== 'component' && parseInt(budget) < minGamingBudget) {
                    warningHtml = `
                        <div style="background-color: #fef2f2; color: #991b1b; padding: 12px 16px; margin-bottom: 20px; border-radius: 8px; border-left: 4px solid #ef4444; font-size: 0.95rem;">
                            <strong>⚠️ 溫馨提醒：</strong> 您的預算 (NT$ ${parseInt(budget).toLocaleString()}) 執行 3A 遊戲大作可能較為吃力。若以下推薦機型仍無法滿足需求，建議適度提高預算。
                        </div>
                    `;
                }

                let htmlContent = `
                    ${warningHtml}
                    <h4 style="color: var(--text-main); margin: 0 0 10px 0; font-size: 1.1rem;">🏆 最佳推薦清單 (Top 3)</h4>
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                `;
if (result.recommendations && result.recommendations.length > 0) {
                    result.recommendations.forEach((item, index) => {
                        const usageText = usage === 'gaming' ? '遊戲加權' : '工作加權';
                        
                        // 優化推薦結果的卡片 HTML 結構
                        htmlContent += `
                            <div class="result-card">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px;">
                                    <strong style="line-height: 1.4;">
                                        <span style="color: var(--text-muted); font-size: 0.9rem;">#${index + 1}</span>
                                        <a href="${item.url}" target="_blank" style="text-decoration: none; color: var(--primary-color); display: inline-block;">
                                            [${item.platform}] ${item.title}
                                        </a>
                                    </strong>
                                    <span style="background: #fffbeb; color: #b45309; padding: 4px 8px; border-radius: 20px; font-weight: bold; font-size: 1rem; white-space: nowrap;">
                                        $${item.price.toLocaleString()}
                                    </span>
                                </div>
                                <div style="margin-bottom: 8px;">
                                    <span class="tag-badge">⚙️ ${item.cpu}</span>
                                    <span class="tag-badge">🎮 ${item.gpu}</span>
                                    <span class="tag-badge">💾 ${item.ram !== 'UNKNOWN' ? item.ram : 'RAM 依網頁為準'}</span>
                                    <span class="tag-badge">💻 ${item.os !== 'UNKNOWN' ? item.os : '系統依網頁為準'}</span>
                                </div>
                                
                                <!-- 左邊放分數，右邊放計算瓦數的按鈕 -->
                                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px dashed var(--border-color); padding-top: 8px; margin-top: 4px;">
                                    <div>
                                        📊 AI 匹配分數：<strong>${item.matchScore.toFixed(0)}</strong> <span style="font-size: 0.8rem; opacity: 0.8;">(${usageText})</span>
                                    </div>
                                    
                                    <!-- ⚡ 將瓦數計算連結放在這裡，並加上按鈕樣式 -->
                                    <a href="/tools.html?model=${item.gpu}" target="_blank" style="text-decoration: none; background: #e8f4f8; color: #2980b9; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: 1px solid #bce8f1; transition: 0.3s;">
                                        ⚡ 計算 ${item.gpu} 瓦數
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    htmlContent += `
                        <div style="padding: 20px; text-align: center; background: #fef2f2; color: #ef4444; border-radius: 8px;">
                            目前市場上沒有找到符合您預算的機型。
                        </div>`;
                }
                htmlContent += '</div>';
                res.innerHTML = htmlContent;

            } catch (error) {
                console.error('推薦API錯誤:', error);
                res.innerHTML = `
                    <div style="padding: 15px; text-align: center; background: #fef2f2; color: #ef4444; border-radius: 8px; border: 1px solid #fca5a5;">
                        ❌ 系統忙碌中，載入失敗。請檢查連線或稍後再試。
                    </div>`;
            }
        }
    </script>
    <script src="./chat-widget.js"></script>
</body>
</html>
