<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一次買夠 | 電腦硬體選購助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        :root {
            --primary-color: #2563eb;     /* 皇家藍 */
            --primary-hover: #1d4ed8;     /* 深藍 */
            --secondary-color: #0284c7;   /* 湛藍 */
            --tertiary-color: #38bdf8;    /* 天藍 */
            
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --glow-color: rgba(37, 99, 235, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 頂部 Header 設定為 100% 滿版無縫貼合頂部與左右兩側 */
        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        /* Logo 藍色漸層文字 */
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(to right, #1d4ed8, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }
        .logo:hover {
            transform: scale(1.03);
        }

        .search-wrapper {
            display: flex;
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .nav-search {
            width: 100%;
            padding: 10px 16px;
            border: 1.5px solid #3b82f6;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            color: var(--text-main);
        }

        .nav-search::placeholder {
            color: #64748b;
        }

        .nav-search:focus {
            background: #ffffff;
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .header-actions .auth-btn {
            background: linear-gradient(135deg, #1d4ed8, #0284c7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .header-actions .auth-btn:hover {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        #user-profile {
            display: none;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            position: relative;
        }
        #user-display-name { color: var(--text-main) !important; font-weight: 500;}
        .avatar { background: #e2e8f0; padding: 5px; border-radius: 50%; }
        
        /* 導覽列橫條設定為 100% 滿版填滿畫面兩端 */
        .main-nav {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a, #2563eb, #0284c7, #2563eb);
            background-size: 300% 300%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 12px 0;
            margin: 0;
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 主導覽列 (Main Nav) 狀態修正 --- */
        .main-nav a {
            color: rgba(255, 255, 255, 0.95);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            padding: 6px 0; /* 增加留白，讓加粗的底線有足夠空間顯示 */
            transition: color 0.3s ease;
        }

        /* ----- 底邊選取特效加粗且保留特效 ----- */
        .main-nav a::after {
            content: '';
            position: absolute;
            bottom: 0; /* 對齊至 padding 底部 */
            left: 50%;
            width: 0;  /* 預設為 0，透過 hover 觸發展開特效 */
            height: 4px; /* 特效加粗為 4px */
            background: #ffffff;
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 4px; /* 圓潤效果 */
        }
        
        .main-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        
        .main-nav a:hover::after,
        .main-nav a.active::after {
            width: 100%; /* 滑鼠移入或處於當前頁面時底線展開 */
        }

        .main-nav a.active {
            color: #ffffff !important; /* 確保白色文字 */
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
            font-weight: 700;
        }

        .container { 
            max-width: 1100px; 
            margin: 2rem auto; 
            padding: 0 20px;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 大標題區塊與 RGB 特效 --- */
        .hero {
            text-align: center;
            padding: 5.5rem 2rem; 
            color: white;
            border-radius: 20px;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            
            border: 4px solid transparent;

            background-image: 
                linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(30, 58, 138, 0.8) 100%), 
                url('https://images.unsplash.com/photo-1587202372634-32705e3bf49c?q=80&w=1200&auto=format&fit=crop'),
                linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-position: center, center, 0% 50%;
            background-size: cover, cover, 200% 100%;
            background-repeat: no-repeat;
            background-clip: padding-box, padding-box, border-box;
            background-origin: padding-box, padding-box, border-box;
            
            animation: rgbBorderMove 3s linear infinite, rgbGlow 3s linear infinite;
        }

        @keyframes rgbBorderMove {
            0% { background-position: center, center, 0% 50%; }
            100% { background-position: center, center, 200% 50%; }
        }

        @keyframes rgbGlow {
            0%   { box-shadow: 0 0 18px #ff0000, inset 0 0 8px #ff0000; }
            14%  { box-shadow: 0 0 18px #ff7300, inset 0 0 8px #ff7300; }
            28%  { box-shadow: 0 0 18px #fffb00, inset 0 0 8px #fffb00; }
            42%  { box-shadow: 0 0 18px #48ff00, inset 0 0 8px #48ff00; }
            57%  { box-shadow: 0 0 18px #00ffd5, inset 0 0 8px #00ffd5; }
            71%  { box-shadow: 0 0 18px #002bff, inset 0 0 8px #002bff; }
            85%  { box-shadow: 0 0 18px #7a00ff, inset 0 0 8px #7a00ff; }
            100% { box-shadow: 0 0 18px #ff0000, inset 0 0 8px #ff0000; }
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 60%);
            animation: pulseGlow 6s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0; 
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.8) translate(-10%, -10%); }
            100% { transform: scale(1.2) translate(10%, 10%); }
        }

        .hero h1, .hero p {
            position: relative;
            z-index: 1;
        }

        .hero h1 { 
            font-size: 2.6rem; 
            margin-bottom: 15px; 
            margin-top: 0; 
            font-weight: 700; 
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #93c5fd, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        
        .hero p { 
            font-size: 1.15rem; 
            color: #f1f5f9; 
            max-width: 600px; 
            margin: 0 auto; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        } 
        
        .features { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        
        .card { 
            background: var(--card-bg); 
            padding: 2.2rem; 
            border-radius: 16px; 
            box-shadow: var(--shadow-md); 
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); 
            border: 1px solid var(--border-color); 
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0284c7, #2563eb, #38bdf8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card h3 { 
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 0; 
            font-size: 1.35rem;
            color: var(--text-main);
            margin-bottom: 1.2rem;
        }
        
        .card h3::before {
            content: '';
            display: block;
            width: 4px;
            height: 24px;
            background: linear-gradient(to bottom, #1d4ed8, #38bdf8);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
        }

        .btn-action {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(135deg, #1d4ed8, #0284c7);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-action::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }

        .btn-action:hover { 
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            transform: translateY(-2px);
        }

        .btn-action:hover::after {
            left: 140%;
        }

        .btn-action:active { 
            transform: translateY(1px); 
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
    </style>
    <link rel="stylesheet" href="./site-theme.css">
</head>
<body>

    <header>
        <div class="header-main">
            <a href="/" class="logo"> 一次買夠</a>
            
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="查詢硬體市價..." onkeydown="handleSearch(event)" aria-label="查詢硬體市價">
            </div>

            <div class="header-actions">
                <div id="auth-section">
                    <a href="/login" class="auth-btn">登入 / 註冊</a>
                </div>
                
                <div id="user-profile">
                    <div class="avatar">👤</div>
                    <span id="user-display-name">載入中...</span>
                    <div class="dropdown-menu" style="display:none; position:absolute; top:40px; right:0; background:#fff; border:1px solid #ddd; padding:10px; border-radius:8px; box-shadow:var(--shadow-md);">
                        <a href="/account.html" style="display:block; padding:5px 0; color:#333; text-decoration:none;">我的帳戶</a>
                        <a href="#" onclick="logout()" style="display:block; padding:5px 0; color:red; text-decoration:none;">登出</a>
                    </div>
                </div>
            </div>
        </div>
        
        <nav class="main-nav">
            <a href="/" class="active">首頁</a>
            <a href="/recommend.html">智慧推薦</a>
            <a href="/valuation.html">二手硬體估價</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/benchmark-instructions.html">跑分教學</a>
            <a href="/tools">零件查詢與瓦數計算工具</a>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <h1>組電腦免踩雷，價格效能一次比</h1>
            <p>查即時市價、看跑分數據，在預算之內選出最適合的電腦配備。</p>
        </section>

        <section id="recommend" class="features">
            <div class="card">
                <h3>硬體跑分與檢測指南</h3>
                <p>學會用壓力測試與跑分數據，判讀硬體的實際效能與穩定度。</p>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem;">照著教學測試 CPU 與顯卡，用數據講話，買硬體不當冤大頭。</p>
                <a class="btn-action" href="/benchmark-instructions.html" style="text-decoration:none;">📖 查看跑分教學</a>
            </div>
        </section>
    </div>

    <script>
        window.onload = function() {
            const loggedInUser = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (loggedInUser) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-display-name').innerText = userName ? userName : loggedInUser.split('@')[0];
            }
            
            document.getElementById('user-profile').addEventListener('click', function() {
                const menu = this.querySelector('.dropdown-menu');
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            });
        };

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            alert('已成功登出');
            window.location.reload();
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                triggerSearch();
            }
        }
        
        function triggerSearch() {
            const input = document.querySelector('.nav-search');
            if (input && input.value.trim()) {
                window.location.href = `/scrape?keyword=${encodeURIComponent(input.value.trim())}`;
            }
        }
    </script>
    <script src="./chat-widget.js"></script>
</body>
</html>
