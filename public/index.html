<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手硬體交易平台 | 整合展示</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 導覽列 */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo { font-size: 1.5rem; font-weight: bold; }
        nav { display: flex; align-items: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: 500; }
        .auth-btn {
            background-color: var(--secondary-color);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .auth-btn:hover { background-color: #2980b9; }
        #user-profile { display: none; align-items: center; }
        .avatar { width: 35px; height: 35px; background: #ddd; border-radius: 50%; margin-right: 10px; }

        /* 主內容區 */
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 20px; }
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, #ffffff 0%, #eef2f3 100%);
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .hero h1 { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 10px; }
        
        /* 功能卡片區 */
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { border-left: 4px solid var(--secondary-color); padding-left: 10px; margin-top: 0; }
        
        /* 智慧推薦表單 */
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-action { width: 100%; background: var(--secondary-color); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        /* 登入彈窗 (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; width: 380px; padding: 2.5rem; border-radius: 12px; position: relative; text-align: center;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #999; }
        .modal-tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 1.5rem; }
        .tab { flex: 1; padding: 10px; cursor: pointer; font-weight: bold; color: #999; }
        .tab.active { color: var(--secondary-color); border-bottom: 2px solid var(--secondary-color); }
        
        #result-display { margin-top: 20px; padding: 15px; background: #f0f7fa; border-radius: 6px; display: none; text-align: left; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">轉轉轉二手交易平台</div>
        <nav>
            <a href="#">首頁</a>
            <a href="#">智慧推薦</a>
            <a href="#">討論區</a>
            <div id="auth-section">
                <span class="auth-btn" onclick="openModal()">登入 / 註冊</span>
            </div>
            <div id="user-profile">
                <div class="avatar"></div>
                <span>王小明 (已認證賣家)</span>
                <a href="#" style="margin-left:15px; font-size: 0.8rem; color: #ccc;" onclick="logout()">登出</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <h1>讓二手硬體交易更科學</h1>
            <p>結合淡江管科所價格模型與底層數據檢測，解決「礦卡」與「亂開價」的痛點。</p>
        </section>

        <section class="features">
            <div class="card">
                <h3>賣家端硬體驗證</h3>
                <p>想要商品獲得「平台認證」標章？</p>
                <p style="font-size: 0.85rem; color: #666;">系統將執行 5 分鐘 FurMark 壓力測試並抓取 GPU-Z BIOS 數據與 ASIC 品質。</p>
                <button class="btn-action" style="background: var(--primary-color);">下載檢測工具</button>
            </div>

            <div class="card">
                <h3>智慧配置推薦</h3>
                <div class="form-group">
                    <label>預算範圍 (NTD)</label>
                    <input type="number" id="budget" placeholder="例如: 20000">
                </div>
                <div class="form-group">
                    <label>用途</label>
                    <select id="usage">
                        <option value="gaming">3A 遊戲專用 (Cyberpunk 2077)</option>
                        <option value="office">高效率文書機</option>
                    </select>
                </div>
                <button class="btn-action" onclick="runRecommend()">生成推薦清單</button>
                <div id="result-display"></div>
            </div>
        </section>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-tabs">
                <div class="tab active" id="t-login" onclick="switchTab('login')">登入</div>
                <div class="tab" id="t-reg" onclick="switchTab('register')">註冊</div>
            </div>

            <div id="login-form">
                <div class="form-group">
                    <label>帳號/Email</label>
                    <input type="text" placeholder="請輸入帳號" id="user-input">
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <input type="password" placeholder="請輸入密碼">
                </div>
                <button class="btn-action" onclick="fakeLogin()">登入</button>
            </div>

            <div id="register-form" style="display:none;">
                <div class="form-group">
                    <label>電子郵件</label>
                    <input type="email" placeholder="您的@email.com">
                </div>
                <div class="form-group">
                    <label>設定密碼</label>
                    <input type="password" placeholder="至少 8 位字元">
                </div>
                <button class="btn-action" style="background: var(--primary-color);">建立帳號</button>
            </div>
        </div>
    </div>

    <script>
        // 彈窗控制
        function openModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('loginModal').style.display = 'none'; }

        // 切換登入與註冊頁籤
        function switchTab(type) {
            const isLogin = type === 'login';
            document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
            document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
            document.getElementById('t-login').className = isLogin ? 'tab active' : 'tab';
            document.getElementById('t-reg').className = isLogin ? 'tab' : 'tab active';
        }

        // 模擬登入成功邏輯
        function fakeLogin() {
            const user = document.getElementById('user-input').value || "王小明";
            alert('登入成功！歡迎回來，' + user);
            closeModal();
            // 切換主頁 UI 狀態
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-profile').style.display = 'flex';
        }

        // 模擬登出
        function logout() {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('user-profile').style.display = 'none';
        }

        // 智慧推薦邏輯
        async function runRecommend() {
            const budget = document.getElementById('budget').value;
            const usage = document.getElementById('usage').value;

            if(!budget) return alert('請輸入預算');

            try {
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ budget: parseInt(budget), usage })
                });

                const result = await response.json();

                const res = document.getElementById('result-display');
                res.style.display = 'block';
                res.innerHTML = `
                    <strong>系統分析結果：</strong><br>
                    1. ${result.cpu}<br>
                    2. ${result.gpu}<br>
                    3. 用途：${usage === 'gaming' ? '遊戲專用' : '文書機'}<br>
                    4. 狀態：${result.status}
                `;
            } catch (error) {
                alert('推薦系統暫時無法使用，請稍後再試');
                console.error('推薦API錯誤:', error);
            }
        }

        // 點擊彈窗外部關閉
        window.onclick = function(event) {
            const modal = document.getElementById('loginModal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
