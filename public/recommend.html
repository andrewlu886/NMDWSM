<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧推薦 ｜ 一次估夠</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./site-theme.css">
    <style>
        /* --- 全站統一變數 --- */
        :root {
            --primary-color: #2563eb;     /* 皇家藍 */
            --primary-hover: #1d4ed8;     /* 深藍 */
            --secondary-color: #0284c7;   /* 湛藍 */
            --tertiary-color: #38bdf8;    /* 天藍 */
            
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-light);
            color: var(--text-main);
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- 頂部 Header --- */
        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(to right, #1d4ed8, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }
        .logo:hover {
            transform: scale(1.03);
        }

        .search-wrapper {
            display: flex;
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .nav-search {
            width: 100%;
            padding: 10px 16px;
            border: 1.5px solid #3b82f6;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            color: var(--text-main);
        }

        .nav-search::placeholder { color: #64748b; }
        .nav-search:focus {
            background: #ffffff;
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* --- 動態漸層主導覽列 --- */
        .main-nav {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a, #2563eb, #0284c7, #2563eb);
            background-size: 300% 300%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 12px 0;
            margin: 0;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-nav a {
            color: rgba(255, 255, 255, 0.95);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            padding: 6px 0;
            transition: color 0.3s ease;
        }

        .main-nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0; 
            height: 4px;
            background: #ffffff;
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 4px;
        }
        
        .main-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        
        .main-nav a:hover::after,
        .main-nav a.active::after {
            width: 100%; 
        }

        .main-nav a.active {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
            font-weight: 700;
        }

        /* --- 智慧推薦頁面專屬區域 --- */
        .recommend-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 70px;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recommend-hero {
            position: relative;
            overflow: hidden;
            margin-bottom: 28px;
            padding: 46px 40px;
            border-radius: 18px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            box-shadow: var(--shadow-lg);
        }

        .recommend-hero::after {
            content: '';
            position: absolute;
            right: -70px;
            bottom: -100px;
            width: 280px;
            height: 280px;
            border: 42px solid rgba(56, 189, 248, 0.12);
            border-radius: 50%;
        }

        .recommend-eyebrow {
            margin: 0 0 10px;
            color: #7dd3fc;
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        .recommend-hero h1 {
            position: relative;
            z-index: 1;
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 2.6rem);
            line-height: 1.25;
        }

        .recommend-hero p:last-child {
            position: relative;
            z-index: 1;
            max-width: 650px;
            margin: 0;
            color: #cbd5e1;
            line-height: 1.75;
        }

        .recommend-layout {
            display: grid;
            grid-template-columns: minmax(290px, 0.8fr) minmax(0, 1.35fr);
            gap: 24px;
            align-items: start;
        }

        .recommend-card {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: var(--card-bg);
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
        }

        .recommend-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .recommend-form-card {
            padding: 28px;
        }

        .recommend-card h2 {
            margin: 0 0 7px;
            font-size: 1.35rem;
            color: var(--text-main);
        }

        .recommend-intro {
            margin: 0 0 24px;
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        .recommend-field {
            margin-bottom: 20px;
        }

        .recommend-field[hidden] {
            display: none;
        }

        .recommend-field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .recommend-field select,
        .recommend-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-light);
            color: var(--text-main);
            font: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .recommend-field select:focus,
        .recommend-field input:focus {
            border-color: var(--primary-color);
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* 升級版特效按鈕 */
        .recommend-submit {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 18px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #1d4ed8, #0284c7);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .recommend-submit::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 20%; height: 200%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }

        .recommend-submit:hover {
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            transform: translateY(-2px);
        }

        .recommend-submit:hover::after {
            left: 140%;
        }

        .recommend-submit:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .recommend-results {
            min-height: 430px;
            padding: 28px;
        }

        .recommend-empty {
            display: grid;
            min-height: 340px;
            place-content: center;
            padding: 20px;
            color: var(--text-muted);
            text-align: center;
        }

        .recommend-result-list {
            display: grid;
            gap: 14px;
        }

        .recommend-result-item {
            padding: 18px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .recommend-result-item:hover {
            border-color: rgba(37, 99, 235, 0.3);
            box-shadow: var(--shadow-md);
        }

        .recommend-result-head {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 13px;
        }

        .recommend-result-title {
            color: var(--primary-color);
            font-weight: 700;
            line-height: 1.5;
            text-decoration: none;
        }

        .recommend-result-price {
            flex: 0 0 auto;
            color: #b45309;
            font-weight: 700;
        }

        .recommend-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .recommend-tag {
            padding: 5px 9px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #475569;
            font-size: 0.8rem;
        }

        .recommend-result-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
        }

        .recommend-tools-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            box-sizing: border-box;
            padding: 8px 13px;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.86rem;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
            text-decoration: none;
            white-space: normal;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .recommend-tools-link:hover {
            border-color: #93c5fd;
            background: #dbeafe;
        }

        .recommend-results-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .recommend-results-heading h2 {
            margin: 0;
        }

        .recommend-calculator-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 13px;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.86rem;
            font-weight: 700;
            line-height: 1.4;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .recommend-calculator-link:hover {
            border-color: #93c5fd;
            background: #dbeafe;
        }

        .recommend-warning,
        .recommend-error {
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 9px;
            background: #fff7ed;
            color: #9a3412;
            font-size: 0.9rem;
        }

        .recommend-error {
            background: #fef2f2;
            color: #b91c1c;
        }

        @media (max-width: 760px) {
            .header-main {
                flex-wrap: wrap;
                gap: 12px;
            }

            .search-wrapper {
                order: 3;
                min-width: 100%;
                margin: 0;
            }

            .main-nav {
                justify-content: flex-start;
                padding: 10px 15px;
                gap: 1.25rem;
            }

            .recommend-page {
                padding: 20px 14px 60px;
            }

            .recommend-hero {
                padding: 34px 24px;
            }

            .recommend-layout {
                grid-template-columns: 1fr;
            }

            .recommend-results {
                min-height: 320px;
            }

            .recommend-result-head {
                flex-direction: column;
                gap: 8px;
            }

            .recommend-result-actions,
            .recommend-tools-link {
                width: 100%;
            }

            .recommend-results-heading {
                align-items: stretch;
                flex-direction: column;
            }

            .recommend-calculator-link {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <a href="/" class="logo"> 一次估夠</a>
            

        </div>
        
        <nav class="main-nav" aria-label="主要導覽">
            <a href="/">首頁</a>
            <a href="/recommend.html" class="active">智慧推薦</a>
            <a href="/valuation.html">二手硬體估價</a>
            <a href="/scrape">市價查詢</a>
            <a href="/tools">零件查詢與瓦數計算工具</a>
        </nav>
    </header>

    <main class="recommend-page">
        <section class="recommend-hero">
            <p class="recommend-eyebrow">SMART HARDWARE GUIDE</p>
            <h1>智慧硬體配置推薦</h1>
            <p>告訴我們預算、用途與想找的商品類型，系統會整理目前市價資料，找出更適合你的硬體選擇。</p>
        </section>

        <div class="recommend-layout">
            <section class="recommend-card recommend-form-card" aria-labelledby="recommend-form-title">
                <h2 id="recommend-form-title">設定需求</h2>
                <p class="recommend-intro">填寫三個條件，即可產生推薦清單。</p>
                <form id="recommend-form">
                    <div class="recommend-field">
                        <label for="productType">商品種類</label>
                        <select id="productType" name="productType">
                            <option value="desktop">套裝主機（Desktop）</option>
                            <option value="laptop">筆記型電腦（Laptop）</option>
                            <option value="component">電腦零件</option>
                        </select>
                    </div>
                    <div class="recommend-field">
                        <label for="budget">預算範圍（NTD）</label>
                        <input id="budget" name="budget" type="number" min="1000" placeholder="請輸入預算上限"> 
                    </div>
                    <div class="recommend-field" id="usage-field">
                        <label for="usage">主要用途</label>
                        <select id="usage" name="usage">
                            <option value="gaming">3A 遊戲專用</option>
                            <option value="office">文書辦公／影音娛樂</option>
                        </select>
                    </div>
                    <div class="recommend-field" id="component-type-field" hidden>
                        <label for="componentType">零件類別</label>
                        <select id="componentType" name="componentType" disabled>
                            <option value="">請選擇零件類別</option>
                            <option value="cpu">處理器（CPU）</option>
                            <option value="gpu">顯示卡（GPU）</option>
                        </select>
                    </div>
                    <button class="recommend-submit" id="recommend-submit" type="submit">立即生成推薦清單</button>
                </form>
            </section>

            <section class="recommend-card recommend-results" aria-labelledby="recommend-results-title">
                <div class="recommend-results-heading">
                    <h2 id="recommend-results-title">推薦結果</h2>
                    <a class="recommend-calculator-link" href="/tools">開啟瓦數計算器</a>
                </div>
                <div id="result-display" aria-live="polite">
                    <div class="recommend-empty">
                        <strong>你的推薦清單會顯示在這裡</strong>
                        <span>先在左側選擇條件，再開始產生推薦。</span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="./recommend.js?v=20260917-1"></script>
    <script src="./chat-widget.js"></script>
</body>
</html>
