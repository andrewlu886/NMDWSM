<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一次估夠 | 市價查詢</title>
    <!-- 引入與全站統一的 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        /* --- 全站統一變數 (華麗高質感模式) --- */
        :root {
            --primary-blue: #3498db;      
            --primary-gradient: linear-gradient(135deg, #3498db, #8e44ad); /* 動態漸層色 */
            --nav-bg-glass: rgba(26, 75, 140, 0.85); /* 毛玻璃深藍底色 */
            
            --bg-main: #f4f7f9;          /* 帶有微灰的背景，襯托純白卡片 */
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2c3e50;        
            --text-muted: #7f8c8d;       
            --border-color: #eaeaea;     
            --accent-color: #e74c3c;     
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* 高級卡片陰影 */
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* --- 導覽列樣式 (動態漸層 + 毛玻璃) --- */
        header {
            /* 動態漸層背景 */
            background: linear-gradient(-45deg, #1a4b8c, #2980b9, #6a1b9a, #1a4b8c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            
            /* 毛玻璃特效 */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .search-wrapper {
            display: flex;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            transition: 0.3s ease;
        }

        .search-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .nav-search {
            border: none;
            padding: 10px 16px;
            outline: none;
            background: transparent;
            color: white;
            width: 220px;
            font-size: 0.95rem;
        }
        
        .nav-search::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .main-nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 0 20px;
            background-color: rgba(0, 0, 0, 0.15); 
            height: 50px;
            align-items: center;
        }

        .main-nav a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 4px;
            position: relative;
            transition: color 0.3s;
        }

        .main-nav a:hover, .main-nav a.active {
            color: white;
        }

        /* 展開底線動畫 (Active / Hover) */
        .main-nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            background: #fff;
            border-radius: 3px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: translateX(-50%);
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        .main-nav a:hover::after, .main-nav a.active::after {
            width: 100%;
        }

        /* --- 頁面主要區塊與 Hero --- */
        .nmd-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .nmd-hero {
            text-align: center;
            padding: 3rem 0 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .nmd-hero h1 {
            color: var(--text-main);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .nmd-hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 搜尋區塊 (高質感卡片風格) */
        .search-box {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 多選通路區塊 */
        .platform-options {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .platform-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .platform-options label:hover {
            background: #f0f4f8;
        }

        .platform-options input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-blue);
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.05rem;
            color: var(--text-main);
            background-color: #fafafa;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.15);
            background-color: #fff;
        }

        /* 特效按鈕 */
        .btn-search {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            white-space: nowrap;
        }

        .btn-search:hover { 
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.5);
            filter: brightness(1.1);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        /* --- 結果顯示區塊 --- */
        #loading { 
            display: none; 
            text-align: center; 
            margin: 2rem 0; 
            color: var(--primary-blue); 
            font-weight: bold;
            font-size: 1.1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .result-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid transparent;
            border-left: 6px solid var(--primary-blue);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow);
            border-color: rgba(52, 152, 219, 0.2);
        }

        .result-info {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 20px;
        }

        .result-card .platform { 
            font-size: 0.85rem; 
            color: #fff; 
            background: linear-gradient(135deg, #2c3e50, #34495e); 
            padding: 6px 12px; 
            border-radius: 20px; 
            white-space: nowrap;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .result-card h4 { 
            margin: 0; 
            color: var(--text-main); 
            font-size: 1.1rem; 
            line-height: 1.5; 
            flex: 1;
            font-weight: 500;
        }

        .result-card .price { 
            color: var(--accent-color); 
            font-size: 1.4rem; 
            font-weight: 700; 
            white-space: nowrap;
        }
        
        .btn-link {
            text-align: center;
            background: #f0f4f8;
            color: #2c3e50 !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.2s;
            white-space: nowrap;
            border: 1px solid #dce4ec;
        }

        .btn-link:hover { 
            background: var(--primary-blue); 
            color: white !important;
            border-color: var(--primary-blue);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        /* --- RWD 手機版 --- */
        @media (max-width: 768px) {
            .header-main {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .search-wrapper, .nav-search {
                width: 100%;
            }
            .main-nav {
                justify-content: flex-start;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding: 0 15px;
            }
            .input-group { 
                flex-direction: column; 
            }
            .btn-search, .btn-link { 
                width: 100%; 
                box-sizing: border-box;
            }
            .result-card { 
                flex-direction: column; 
                align-items: flex-start; 
                padding: 1.2rem;
            }
            .result-info { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 12px;
                width: 100%;
            }
            .result-card .price {
                align-self: flex-end;
            }
        }
    </style>
    <link rel="stylesheet" href="./site-theme.css">
</head>
<body>

    <header>
        <div class="header-main">
            <a href="/" class="logo">一次估夠</a>
            

        </div>
        
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/recommend.html">智慧推薦</a>
            <a href="/valuation.html">二手硬體估價</a>
            <a href="/scrape" class="active">市價查詢</a>
            <a href="/tools">零件查詢與瓦數計算工具</a>
        </nav>
    </header>

    <main class="nmd-page market-page">
        <section class="nmd-hero market-hero">
            <div>
                <h1>全通路市價快搜</h1>
                <p>即時比對各通路價格，協助你掌握硬體行情與選購預算。</p>
            </div>
        </section>
        
        <div class="search-box">
            <div class="platform-options" id="platform-checkboxes">
                <label><input type="checkbox" value="coolpc" checked> 原價屋</label>
                <label><input type="checkbox" value="sinya" checked> 欣亞數位</label>
                <label><input type="checkbox" value="ruten"> 露天拍賣</label>
                <label><input type="checkbox" value="pchome"> PChome 24h</label>
                <label><input type="checkbox" value="momo"> Momo 購物網</label>
                <label><input type="checkbox" value="newegg"> Newegg</label>
                <label><input type="checkbox" value="yahoo"> Yahoo 購物中心</label>
            </div>
            
            <div class="input-group">
                <input type="text" id="keyword-input" placeholder="請輸入硬體關鍵字 (例如: RTX 4060)" onkeypress="handleKeyPressSearch(event)">
                <input type="text" id="exclude-input" placeholder="排除關鍵字 (例: 筆電 主機)" onkeypress="handleKeyPressSearch(event)">
                <button class="btn-search" onclick="fetchPrices()">搜尋</button>
            </div>
        </div>

        <div id="loading">正在查詢各通路商品與價格，請稍候…</div>
        <div class="results-list" id="results-container"></div>
    </main>

    <script>
        window.onload = function() {
            const keyword = new URLSearchParams(window.location.search).get('keyword');
            if (keyword) {
                document.getElementById('keyword-input').value = keyword;
                fetchPrices();
            }
        };

        function handleKeyPressSearch(event) {
            if (event.key === 'Enter') fetchPrices();
        }

        async function fetchPrices() {
            const keyword = document.getElementById('keyword-input').value.trim();
            const exclude = document.getElementById('exclude-input').value.trim();
            const container = document.getElementById('results-container');
            const loading = document.getElementById('loading');
            
            const checkboxes = document.querySelectorAll('#platform-checkboxes input[type="checkbox"]:checked');
            const selectedPlatforms = Array.from(checkboxes).map(cb => cb.value).join(',');

            if (selectedPlatforms.length === 0) {
                alert('請至少選擇一個通路！');
                return;
            }

            if (!keyword) {
                alert('請先輸入要查詢的硬體關鍵字！');
                return;
            }

            container.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch(`/api/scrape?keyword=${encodeURIComponent(keyword)}&platform=${encodeURIComponent(selectedPlatforms)}&exclude=${encodeURIComponent(exclude)}`);
                if (!response.ok) throw new Error('網路回應不正常');
                
                const result = await response.json();
                console.log("收到後端回傳資料:", result);

                loading.style.display = 'none';

                if (result.success && result.data && result.data.length > 0) {
                    result.data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'result-card';
                        
                        const displayPrice = (item.price && item.price !== "待實作 DOM 解析") ? `${item.price} 元` : "點擊查看價格";
                        
                        card.innerHTML = `
                            <div class="result-info">
                                <span class="platform">${item.platform}</span>
                                <h4>${item.name}</h4>
                                <div class="price">${displayPrice}</div>
                            </div>
                            <a href="${item.url}" class="btn-link" target="_blank">前往商場確認</a>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; width: 100%; padding: 2rem; font-size: 1.1rem; background: var(--card-bg); border-radius: 12px;">目前沒有找到相關結果，請更換關鍵字或減少排除條件再試一次。</p>';
                }

            } catch (error) {
                loading.style.display = 'none';
                console.error('Fetch 發生錯誤:', error);
                container.innerHTML = '<p style="color: var(--accent-color); text-align: center; width: 100%; padding: 2rem; font-size: 1.1rem; background: var(--card-bg); border-radius: 12px; font-weight: bold;">連線失敗：請確認後端伺服器 (server.js) 是否已啟動。</p>';
            }
        }
    </script>
    <script src="./chat-widget.js"></script>
</body>
</html>
