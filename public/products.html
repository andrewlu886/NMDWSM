<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的商品 | 一次買夠二手交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 20px; }
        .header-action { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 18px; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
        .toolbar select { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: white; }
        .product-list-item { display: grid; grid-template-columns: 120px 1fr auto; gap: 18px; align-items: center; background: white; padding: 16px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 3px 12px rgba(15,23,42,0.06); border: 1px solid #edf0f4; }
        .item-image { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; background: #eef2f7; }
        .item-title { margin: 0 0 8px; color: var(--primary-color); font-size: 1.15rem; }
        .item-desc { color: #667085; margin: 0; line-height: 1.5; }
        .item-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .badge { padding: 4px 8px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; background: #eef2ff; color: #3949ab; }
        .badge.active { background: #e8f8ef; color: #16803d; }
        .badge.sold { background: #fff3e0; color: #a15c00; }
        .badge.inactive { background: #f1f5f9; color: #64748b; }
        .item-aside { text-align: right; min-width: 220px; }
        .item-price { color: var(--accent-color); font-size: 1.35rem; font-weight: 800; margin-bottom: 10px; }
        .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
        .btn-small { border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; font-weight: 700; color: white; background: #3498db; }
        .btn-muted { background: #64748b; }
        .seller-subnav { display: flex; gap: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); margin-bottom: 16px; }
        .seller-subnav a { text-decoration: none; color: #475467; font-weight: 800; padding: 9px 14px; border-radius: 6px; }
        .seller-subnav a.active, .seller-subnav a:hover { background: var(--secondary-color); color: #fff; }
        .btn-warning { background: #f59e0b; }
        .btn-danger { background: #e74c3c; }
        .empty-state { background: white; padding: 48px 24px; text-align: center; border-radius: 8px; color: #667085; }
        .seller-orders { margin-top: 28px; }
        .order-item { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 12px; }
        @media (max-width: 820px) { .product-list-item { grid-template-columns: 1fr; } .item-image { width: 100%; height: 180px; } .item-aside { text-align: left; } .actions { justify-content: flex-start; } }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠二手交易平台</a>
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">搜尋</button>
            </div>
            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">購物車 <span id="cart-count" class="cart-count">0</span></a>
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile">
                    <div class="avatar">U</div>
                    <span id="user-display-name" style="color: white; font-size: 0.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="/products.html">我的商品</a>
                        <a href="/transactions">我的交易</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/marketplace">商城</a>
            <a href="/#recommend">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/seller">賣家中心</a>
        </nav>
    </header>

    <main class="container">
        <div class="seller-subnav">
            <a href="/seller">新增商品</a>
            <a href="/products.html" class="active">我的商品</a>
            <a href="/transactions">我的交易</a>
        </div>
        <div class="header-action">
            <h2>我的商品管理</h2>
            <button class="btn-action" onclick="window.location.href='/seller.html'">+ 新增商品</button>
        </div>
        <div class="toolbar">
            <select id="status-filter" onchange="renderProducts()">
                <option value="all">全部狀態</option>
                <option value="active">上架中</option>
                <option value="sold">已售出</option>
                <option value="inactive">已下架</option>
            </select>
            <select id="sort-select" onchange="renderProducts()">
                <option value="newest">最新上架</option>
                <option value="price-desc">價格高到低</option>
                <option value="price-asc">價格低到高</option>
                <option value="views">瀏覽數</option>
            </select>
        </div>
        <section id="products-container"></section>
        <section class="seller-orders">
            <h2>收到的購買需求</h2>
            <div id="seller-orders-container" class="empty-state">載入中...</div>
        </section>
    </main>

    <script>
        let productsCache = [];
        let sellerOrders = [];

        window.onload = async function() {
            const loggedInUser = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (!loggedInUser) {
                alert('請先登入後再查看我的商品');
                window.location.href = '/login';
                return;
            }

            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-profile').style.display = 'flex';
            document.getElementById('user-display-name').innerText = userName || loggedInUser.split('@')[0];
            await updateCartCount();
            await fetchMyProducts(loggedInUser);
            await fetchSellerOrders(loggedInUser);
        };

        function placeholderImage() {
            return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 450%22%3E%3Crect width=%22600%22 height=%22450%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%22300%22 y=%22235%22 text-anchor=%22middle%22 fill=%22%23667285%22 font-size=%2230%22%3ENo Image%3C/text%3E%3C/svg%3E';
        }

        function statusLabel(status) {
            return { active: '上架中', sold: '已售出', inactive: '已下架' }[status] || status;
        }

        async function fetchMyProducts(email) {
            const res = await fetch(`/api/products?seller=${encodeURIComponent(email)}`);
            productsCache = await res.json();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            const status = document.getElementById('status-filter').value;
            const sort = document.getElementById('sort-select').value;
            let products = [...productsCache];

            if (status !== 'all') products = products.filter(product => product.status === status);
            if (sort === 'price-desc') products.sort((a, b) => b.price - a.price);
            if (sort === 'price-asc') products.sort((a, b) => a.price - b.price);
            if (sort === 'views') products.sort((a, b) => (b.views || 0) - (a.views || 0));
            if (sort === 'newest') products.sort((a, b) => b.id - a.id);

            if (!products.length) {
                container.innerHTML = '<div class="empty-state">目前沒有符合條件的商品。</div>';
                return;
            }

            container.innerHTML = products.map(product => `
                <article class="product-list-item">
                    <img class="item-image" src="${product.image || placeholderImage()}" alt="${product.title}">
                    <div>
                        <h3 class="item-title">${product.title}</h3>
                        <p class="item-desc">${product.desc || '尚未填寫商品描述'}</p>
                        <div class="item-meta">
                            <span class="badge ${product.status}">${statusLabel(product.status)}</span>
                            <span class="badge">${product.category}</span>
                            <span class="badge">${product.condition || 'used'}</span>
                            <span class="badge">瀏覽 ${product.views || 0}</span>
                            <span class="badge">${product.usageTag || '未分類用途'}</span>
                        </div>
                    </div>
                    <div class="item-aside">
                        <div class="item-price">NT$ ${Number(product.price).toLocaleString()}</div>
                        <div class="actions">
                            <button class="btn-small" onclick="window.location.href='/product?id=${product.id}'">詳情</button>
                            <button class="btn-small" onclick="editProduct(${product.id})">編輯</button>
                            <button class="btn-small btn-warning" onclick="setStatus(${product.id}, 'sold')">售出</button>
                            <button class="btn-small btn-muted" onclick="setStatus(${product.id}, 'active')">上架</button>
                            <button class="btn-small btn-danger" onclick="setStatus(${product.id}, 'inactive')">下架</button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        async function setStatus(id, status) {
            const seller = localStorage.getItem('userEmail');
            const res = await fetch(`/api/products/${id}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seller, status })
            });
            const result = await res.json();
            if (!result.success) return alert(result.message || '狀態更新失敗');
            await fetchMyProducts(seller);
        }

        async function fetchSellerOrders(email) {
            const res = await fetch(`/api/transactions?role=seller&userEmail=${encodeURIComponent(email)}`);
            const result = await res.json();
            sellerOrders = result.success ? result.data : [];
            renderSellerOrders();
        }

        function renderSellerOrders() {
            const container = document.getElementById('seller-orders-container');
            if (!sellerOrders.length) {
                container.className = 'empty-state';
                container.innerHTML = '目前還沒有買家提出購買需求。';
                return;
            }
            container.className = '';
            container.innerHTML = sellerOrders.map(order => `
                <div class="order-item">
                    <div>
                        <strong>${order.title}</strong>
                        <div style="color:#667085;">買家：${order.buyer || '使用者'}，狀態：${transactionLabel(order.status)}</div>
                    </div>
                    <div class="actions">
                        <button class="btn-small" onclick="updateOrder(${order.id}, 'contacting')">洽談中</button>
                        <button class="btn-small btn-warning" onclick="updateOrder(${order.id}, 'completed')">已成交</button>
                        <button class="btn-small btn-danger" onclick="updateOrder(${order.id}, 'cancelled')">取消</button>
                    </div>
                </div>
            `).join('');
        }

        function transactionLabel(status) {
            return { pending: '待聯絡', contacting: '洽談中', completed: '已成交', cancelled: '已取消' }[status] || status;
        }

        async function updateOrder(id, status) {
            const userEmail = localStorage.getItem('userEmail');
            await fetch(`/api/transactions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, status })
            });
            await fetchSellerOrders(userEmail);
        }

        function editProduct(id) { window.location.href = `/seller.html?id=${id}`; }

        async function updateCartCount() {
            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/cart?userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            const items = result.success ? result.data : [];
            document.getElementById('cart-count').innerText = items.reduce((total, item) => total + (parseInt(item.quantity, 10) || 1), 0);
        }

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            window.location.href = '/';
        }

        function triggerSearch() {
            const query = document.querySelector('.nav-search').value.trim();
            if (query) window.location.href = `/marketplace?q=${encodeURIComponent(query)}`;
        }

        function handleSearch(event) {
            if (event.key === 'Enter') triggerSearch();
        }
    </script>
</body>
</html>
