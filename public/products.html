<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的商品 | 二手硬體交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* 主內容區 */
        .container { max-width: 900px; margin: 3rem auto; padding: 0 20px; }
        .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .header-action h2 { margin: 0; color: var(--primary-color); }
        
        .empty-state {
            background: white; padding: 4rem 2rem; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-align: center; color: #999;
        }

        .product-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #f9f9f9;
        }
        .product-list-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #eee;
        }
        .item-main { flex-grow: 1; margin-right: 20px; }
        .item-title { margin: 0 0 8px 0; font-size: 1.25rem; color: var(--primary-color); }
        .item-category { font-size: 0.9rem; color: #7f8c8d; font-weight: normal; }
        .item-desc { margin: 0; color: #666; font-size: 0.95rem; line-height: 1.5; }
        .item-aside { text-align: right; min-width: 120px; }
        .item-price { font-size: 1.4rem; color: var(--accent-color); font-weight: bold; margin: 0 0 10px 0; }
        .btn-edit {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-edit:hover { background: #2980b9; }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-delete:hover { background: #c0392b; }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <a href="/" class="logo">轉轉轉二手平台</a>
            
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品或文章..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">🔍</button>
            </div>

            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">
                    🛒 <span id="cart-count" class="cart-count">0</span>
                </a>
                
                <div id="auth-section">
                    <a href="/login" class="auth-btn">登入 / 註冊</a>
                </div>
                
                <div id="user-profile">
                    <div class="avatar">👤</div>
                    <span id="user-display-name" style="color: white; font-size: 0.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="/products.html">我的商品</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/marketplace">🛒 商城</a>
            <a href="#">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/seller">賣家中心</a>
        </nav>
    </header>

    <div class="container">
        <div class="header-action">
            <h2>我的商品管理</h2>
            <button class="btn-action">+ 新增商品</button>
        </div>
        <div class="empty-state">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
            <h3>您目前還沒有上架任何商品喔！</h3>
            <p>點擊右上方「新增商品」開始您的第一筆交易吧。</p>
        </div>
    </div>

    <script>
        window.onload = function() {
        const loggedInUser = localStorage.getItem('userEmail');
        const userName = localStorage.getItem('userName');
        if (!loggedInUser) {
            document.getElementById('user-profile').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
        } else {
            document.getElementById('user-display-name').innerText = (userName ? userName : loggedInUser.split('@')[0]) + " (會員)";
            fetchMyProducts(loggedInUser); // 登入後抓取商品
        }
        
        // 綁定右上角的新增商品按鈕
        document.querySelector('.btn-action').onclick = function() {
            window.location.href = '/seller.html';
        };
    };

    function logout() {
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userName');
        alert('已成功登出！');
        window.location.href = '/';
    }

    // 抓取並顯示目前登入者的商品
    async function fetchMyProducts(email) {
        try {
            const res = await fetch(`/api/products?seller=${encodeURIComponent(email)}`);
            const products = await res.json();
            
            if (products.length > 0) {
                let html = `<div class="header-action">
                                <h2>我的商品管理</h2>
                                <button class="btn-action" onclick="window.location.href='/seller.html'">+ 新增商品</button>
                            </div>`;
                products.forEach(p => {
                    html += `
                    <div class="product-list-item">
                        <div class="item-main">
                            <h3 class="item-title">${p.title} <span class="item-category">(${p.category})</span></h3>
                            <p class="item-desc">${p.desc}</p>
                        </div>
                        <div class="item-aside">
                            <p class="item-price">NT$ ${p.price}</p>
                            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                                <button class="btn-edit" onclick="editProduct(${p.id})">修改</button>
                                <button class="btn-delete" onclick="deleteProduct(${p.id})">下架刪除</button>
                            </div>
                        </div>
                    </div>
                    `;
                });
                document.querySelector('.container').innerHTML = html;
            }
        } catch (err) {
            console.error('抓取商品失敗', err);
        }
    }

    // 實作編輯商品功能
    function editProduct(id) {
        window.location.href = `/seller.html?id=${id}`;
    }

    // 實作刪除商品功能
    async function deleteProduct(id) {
        if(!confirm('確定要下架並刪除這個商品嗎？')) return;
        try {
            const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
            const result = await res.json();
            if(result.success) {
                alert('商品已刪除');
                location.reload(); // 重整頁面更新畫面
            }
        } catch(err) {
            alert('刪除失敗');
        }
    }
    </script>
</body>
</html>
