<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 | 一次買夠二手交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background: var(--nmd-bg); }
        .seller-layout { display:grid; grid-template-columns:230px minmax(0,1fr); gap:24px; align-items:start; }
        .seller-nav a { display:block; padding:12px 14px; border-radius:12px; color:var(--nmd-text); text-decoration:none; font-weight:900; margin-bottom:6px; }
        .seller-nav a.active, .seller-nav a:hover { background:var(--nmd-blue-soft); color:var(--nmd-blue); }
        .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
        .toolbar select { max-width:220px; }
        .product-row { grid-template-columns:110px minmax(0,1fr) 120px 110px 230px; }
        .actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
        @media(max-width:980px){ .seller-layout{grid-template-columns:1fr;} .product-row{grid-template-columns:1fr;} .actions{justify-content:flex-start;} }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠二手交易平台</a>
            <div class="search-wrapper"><input type="text" class="nav-search" placeholder="搜尋商品..." onkeydown="handleSearch(event)"><button class="search-btn" onclick="triggerSearch()">搜尋</button></div>
            <div class="header-actions"><a href="/cart" class="cart-link" title="購物車">購物車<span id="cart-count" class="cart-count">0</span></a><div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div><div id="user-profile"><div class="avatar">U</div><span id="user-display-name" style="color:white;font-size:.95rem;">載入中...</span><div class="dropdown-menu"><a href="/account.html">我的帳戶</a><a href="/transactions">購買清單</a><a href="#" onclick="logout()">登出</a></div></div></div>
        </div>
        <nav class="main-nav"><a href="/">首頁</a><a href="/marketplace">商城</a><a href="/#recommend">智慧推薦</a><a href="/forum">討論區</a><a href="/scrape">市價查詢</a><a href="/seller" class="active">賣家中心</a></nav>
    </header>

    <main class="nmd-page nmd-page-wide">
        <div class="seller-layout">
            <aside class="nmd-card nmd-card-pad seller-nav">
                <h2>賣家中心</h2>
                <a href="/seller">賣家首頁</a>
                <a href="/transactions">我的銷售</a>
                <a href="/products.html" class="active">我的商品</a>
                <a href="/seller#product-workspace">新增商品</a>
                <a href="/scrape">市價查詢</a>
                <a href="/forum">討論區</a>
            </aside>
            <section>
                <div class="nmd-hero">
                    <div><h1>商品管理</h1><p>管理上架中、已售出與已下架的二手零件。</p></div>
                    <a class="nmd-btn" href="/seller#product-workspace">新增商品</a>
                </div>
                <div class="toolbar">
                    <select id="status-filter" class="nmd-field" onchange="renderProducts()"><option value="all">全部狀態</option><option value="active">上架中</option><option value="sold">已售出</option><option value="inactive">已下架</option></select>
                    <select id="sort-select" class="nmd-field" onchange="renderProducts()"><option value="newest">最新上架</option><option value="price-desc">價格高到低</option><option value="price-asc">價格低到高</option><option value="views">瀏覽數</option></select>
                </div>
                <section id="products-container" class="nmd-card">載入商品中...</section>
            </section>
        </div>
    </main>

    <script>
        let productsCache = [];

        window.onload = async function() {
            const userEmail = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (!userEmail) { alert('請先登入後再查看商品管理'); window.location.href = '/login'; return; }
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-profile').style.display = 'flex';
            document.getElementById('user-display-name').innerText = userName || userEmail.split('@')[0];
            await updateCartCount();
            await fetchMyProducts(userEmail);
        };

        async function fetchMyProducts(email) {
            const res = await fetch(`/api/products?seller=${encodeURIComponent(email)}`);
            productsCache = await res.json();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            const status = document.getElementById('status-filter').value;
            const sort = document.getElementById('sort-select').value;
            let products = [...productsCache];
            if (status !== 'all') products = products.filter(product => product.status === status);
            if (sort === 'price-desc') products.sort((a,b) => b.price - a.price);
            if (sort === 'price-asc') products.sort((a,b) => a.price - b.price);
            if (sort === 'views') products.sort((a,b) => (b.views || 0) - (a.views || 0));
            if (sort === 'newest') products.sort((a,b) => b.id - a.id);
            if (!products.length) { container.innerHTML = '<div class="nmd-empty">目前沒有符合條件的商品。</div>'; return; }
            container.innerHTML = products.map(product => `
                <article class="nmd-table-row product-row">
                    <img class="nmd-thumb" src="${escapeHtml(product.image || placeholderImage())}" alt="${escapeHtml(product.title)}">
                    <div><strong>${escapeHtml(product.title)}</strong><div class="nmd-muted">${escapeHtml(product.desc || '尚未提供商品描述')}</div><div class="nmd-pills" style="margin-top:10px;"><span class="nmd-pill ${product.status === 'sold' ? 'success' : product.status === 'inactive' ? 'gray' : ''}">${statusLabel(product.status)}</span><span class="nmd-pill">${categoryLabel(product.category, product.coolingType)}</span><span class="nmd-pill">瀏覽 ${product.views || 0}</span></div></div>
                    <strong class="nmd-price">NT$ ${Number(product.price || 0).toLocaleString()}</strong>
                    <span>${conditionLabel(product.condition)}</span>
                    <div class="actions"><a class="nmd-btn secondary" href="/product?id=${product.id}">查看</a><button class="nmd-btn secondary" onclick="editProduct(${product.id})">編輯</button><button class="nmd-btn danger" onclick="setStatus(${product.id}, 'inactive')">下架</button></div>
                </article>`).join('');
        }

        async function setStatus(id, status) {
            const seller = localStorage.getItem('userEmail');
            const res = await fetch(`/api/products/${id}/status`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ seller, status }) });
            const result = await res.json();
            if (!result.success) return alert(result.message || '狀態更新失敗');
            await fetchMyProducts(seller);
        }

        function editProduct(id) { window.location.href = `/seller?id=${id}`; }
        function statusLabel(status){ return { active:'上架中', sold:'已售出', inactive:'已下架' }[status] || status || '上架中'; }
        function categoryLabel(category, coolingType = ''){ const base = { cpu:'處理器 CPU', gpu:'顯示卡 GPU', mb:'主機板 MB', ram:'記憶體 RAM', cooler:'散熱', ssd:'固態硬碟 SSD', hdd:'傳統硬碟 HDD', case:'機殼 Case', psu:'電源供應器 PSU' }[category] || category || '其他零件'; return category === 'cooler' && coolingType ? `${base} / ${coolingTypeLabel(coolingType)}` : base; }
        function coolingTypeLabel(type){ return { liquid:'水冷', fan:'風扇' }[type] || type || ''; }
        function conditionLabel(condition){ return { new:'全新未拆', excellent:'九成新', good:'正常使用', used:'二手零件' }[condition] || condition || '二手'; }
        async function updateCartCount(){ const userEmail=localStorage.getItem('userEmail'); const res=await fetch(`/api/cart?userEmail=${encodeURIComponent(userEmail)}`); const result=await res.json(); const items=result.success?result.data:[]; document.getElementById('cart-count').innerText=items.reduce((s,i)=>s+(parseInt(i.quantity,10)||1),0); }
        function placeholderImage(){ return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 450%22%3E%3Crect width=%22600%22 height=%22450%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%22300%22 y=%22235%22 text-anchor=%22middle%22 fill=%22%23667285%22 font-size=%2230%22%3ENo Image%3C/text%3E%3C/svg%3E'; }
        function triggerSearch(){ const q=document.querySelector('.nav-search').value.trim(); if(q) window.location.href=`/marketplace?q=${encodeURIComponent(q)}`; }
        function handleSearch(event){ if(event.key==='Enter') triggerSearch(); }
        function escapeHtml(value){ return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function logout(){ localStorage.removeItem('userEmail'); localStorage.removeItem('userName'); window.location.href='/'; }
    </script>
</body>
</html>
