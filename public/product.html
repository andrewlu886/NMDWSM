<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品詳情 | 一次買夠二手交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background: radial-gradient(circle at 90% 5%, rgba(47,143,216,.13), transparent 28rem), var(--nmd-bg); }
        .product-photo { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:18px; background:#eef2f7; border:1px solid #edf1f5; }
        .gallery { position:relative; }
        .gallery-btn { position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border:0; border-radius:999px; background:rgba(15,23,42,.72); color:#fff; font-size:1.4rem; cursor:pointer; display:grid; place-items:center; }
        .gallery-btn.prev { left:12px; }
        .gallery-btn.next { right:12px; }
        .gallery-count { position:absolute; right:14px; bottom:14px; background:rgba(15,23,42,.72); color:#fff; border-radius:999px; padding:5px 10px; font-weight:900; font-size:.85rem; }
        .gallery-thumbs { display:flex; gap:8px; overflow-x:auto; padding:2px; }
        .gallery-thumb { width:72px; height:54px; object-fit:cover; border-radius:8px; border:2px solid transparent; cursor:pointer; background:#eef2f7; flex:0 0 auto; }
        .gallery-thumb.active { border-color:var(--nmd-blue); }
        .image-note, .info-box, .seller-box, .verify-box { background:#f8fbff; border:1px solid var(--nmd-border); border-radius:14px; padding:16px; }
        .detail-stack { display:grid; gap:16px; align-content:start; }
        .title { margin:0; color:var(--nmd-text); font-size:clamp(1.8rem,3vw,2.35rem); line-height:1.25; }
        .price { color:var(--nmd-red); font-size:2.2rem; font-weight:900; }
        .info-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .info-box span, .seller-box span, .verify-box span { display:block; color:var(--nmd-muted); font-size:.86rem; font-weight:900; margin-bottom:6px; }
        .description-text { white-space:pre-wrap; line-height:1.85; }
        .product-copy { background:#fff; border:1px solid var(--nmd-border); border-radius:14px; padding:18px; display:grid; gap:18px; }
        .product-copy h2 { margin:0 0 10px; }
        .product-copy-section { text-align:left; }
        .product-copy-section + .product-copy-section { border-top:1px solid var(--nmd-border); padding-top:18px; }
        .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .action-grid .wide { grid-column:1/-1; }
        @media (max-width:620px){ .info-grid,.action-grid{grid-template-columns:1fr;} .action-grid .wide{grid-column:auto;} }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠二手交易平台</a>
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">搜尋</button>
            </div>
            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">購物車<span id="cart-count" class="cart-count">0</span></a>
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile">
                    <div class="avatar">U</div>
                    <span id="user-display-name" style="color:white;font-size:.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="/transactions">購買清單</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">首頁</a><a href="/marketplace">商城</a><a href="/#recommend">智慧推薦</a><a href="/forum">討論區</a><a href="/scrape">市價查詢</a><a href="/seller">賣家中心</a>
        </nav>
    </header>

    <main class="nmd-page">
        <section id="product-detail" class="nmd-grid-product">載入商品中...</section>
    </main>

    <script>
        let product = null;
        let currentImageIndex = 0;

        window.onload = async function() {
            setupUser();
            await updateCartCount();
            await loadProduct();
        };

        function setupUser() {
            const userEmail = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (!userEmail) return;
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-profile').style.display = 'flex';
            document.getElementById('user-display-name').innerText = userName || userEmail.split('@')[0];
        }

        async function loadProduct() {
            const id = new URLSearchParams(window.location.search).get('id');
            const container = document.getElementById('product-detail');
            if (!id) {
                container.innerHTML = '<div class="nmd-card nmd-card-pad">缺少商品 id，請從商城選擇商品。</div>';
                return;
            }
            const res = await fetch(`/api/products/${id}`);
            if (!res.ok) {
                container.innerHTML = '<div class="nmd-card nmd-card-pad">找不到商品。</div>';
                return;
            }
            product = await res.json();
            renderProduct();
        }

        function renderProduct() {
            const images = productImages();
            document.getElementById('product-detail').innerHTML = `
                <div class="detail-stack">
                    <div class="gallery">
                        <img id="main-product-photo" class="product-photo" src="${escapeHtml(images[currentImageIndex])}" alt="${escapeHtml(product.title)}">
                        ${images.length > 1 ? `
                            <button class="gallery-btn prev" onclick="changeImage(-1)" aria-label="上一張">‹</button>
                            <button class="gallery-btn next" onclick="changeImage(1)" aria-label="下一張">›</button>
                            <div class="gallery-count">${currentImageIndex + 1} / ${images.length}</div>
                        ` : ''}
                    </div>
                    ${images.length > 1 ? `<div class="gallery-thumbs">${images.map((src, index) => `<img class="gallery-thumb ${index === currentImageIndex ? 'active' : ''}" src="${escapeHtml(src)}" alt="商品圖片 ${index + 1}" onclick="setImage(${index})">`).join('')}</div>` : ''}
                    <div class="image-note nmd-muted">二手零件建議面交測試，確認外觀、序號、配件與實際運作狀況後再完成交易。</div>
                </div>
                <div class="nmd-card nmd-card-pad detail-stack">
                    <div class="nmd-pills"><span class="nmd-pill">${escapeHtml(categoryLabel(product.category, product.coolingType))}</span><span class="nmd-pill">${escapeHtml(conditionLabel(product.condition))}</span><span class="nmd-pill">${escapeHtml(product.usageTag || '一般用途')}</span><span class="nmd-pill">瀏覽 ${product.views || 0}</span></div>
                    <h1 class="title">${escapeHtml(product.title)}</h1>
                    <div class="price">NT$ ${Number(product.price || 0).toLocaleString()}</div>
                    <div class="action-grid">
                        <button class="nmd-btn" onclick="buyNow()">立即購買</button>
                        <button class="nmd-btn secondary" onclick="addToCart()">加入購物車</button>
                        <button class="nmd-btn secondary wide" onclick="addFavorite()">收藏商品</button>
                    </div>
                    <div class="info-grid">
                        <div class="info-box"><span>商品分類</span><strong>${escapeHtml(categoryLabel(product.category, product.coolingType))}</strong></div>
                        <div class="info-box"><span>商品狀況</span><strong>${escapeHtml(conditionLabel(product.condition))}</strong></div>
                        <div class="info-box"><span>廠商 / 品牌</span><strong>${escapeHtml(product.location || '未提供')}</strong></div>
                        <div class="info-box"><span>商品狀態</span><strong>${product.status === 'active' ? '可購買' : '暫不可購買'}</strong></div>
                    </div>
                    <div class="seller-box"><span>賣家名稱</span><strong>${escapeHtml(product.seller || '平台使用者')}</strong></div>
                    <div class="product-copy">
                        <section class="product-copy-section description">
                            <h2>商品描述</h2>
                            <div class="description-text">${escapeHtml(combinedDescription())}</div>
                        </section>
                        <section class="product-copy-section verify-box">
                            <span>燒機驗證</span><strong>未來可接入測試資料</strong><div class="nmd-muted" style="margin-top:6px;">本階段先保留擴充位置，不影響目前交易流程展示。</div>
                        </section>
                    </div>
                </div>
            `;
        }

        function combinedDescription() {
            const parts = [product.specs, product.desc].map(cleanProductCopy).filter(Boolean);
            return parts.length ? parts.join('\n\n') : '賣家尚未提供商品描述。';
        }

        function cleanProductCopy(text) {
            return String(text || '')
                .split('\n')
                .map(line => line.trim())
                .join('\n')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        function productImages() {
            const images = Array.isArray(product.images) ? product.images.filter(Boolean) : [];
            if (!images.length && product.image) images.push(product.image);
            if (!images.length) images.push(placeholderImage());
            if (currentImageIndex >= images.length) currentImageIndex = 0;
            return images;
        }

        function changeImage(delta) {
            const images = productImages();
            currentImageIndex = (currentImageIndex + delta + images.length) % images.length;
            renderProduct();
        }

        function setImage(index) {
            currentImageIndex = index;
            renderProduct();
        }

        async function addToCart() {
            const userEmail = localStorage.getItem('userEmail');
            if (!userEmail) return goLogin();
            const res = await fetch('/api/cart', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userEmail, productId: product.id }) });
            const result = await res.json();
            alert(result.message || '已加入購物車');
            await updateCartCount();
        }

        function buyNow() {
            if (!localStorage.getItem('userEmail')) return goLogin();
            window.location.href = `/checkout?productId=${product.id}`;
        }

        async function addFavorite() {
            const userEmail = localStorage.getItem('userEmail');
            if (!userEmail) return goLogin();
            const res = await fetch('/api/favorites', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userEmail, productId: product.id }) });
            const result = await res.json();
            alert(result.message || '已收藏商品');
        }

        function goLogin() { alert('請先登入'); window.location.href = '/login'; }

        async function updateCartCount() {
            const userEmail = localStorage.getItem('userEmail');
            const el = document.getElementById('cart-count');
            if (!userEmail) { el.innerText = 0; return; }
            const res = await fetch(`/api/cart?userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            const items = result.success ? result.data : [];
            el.innerText = items.reduce((sum, item) => sum + (parseInt(item.quantity, 10) || 1), 0);
        }

        function categoryLabel(category, coolingType = '') {
            const labels = { cpu:'處理器 CPU', gpu:'顯示卡 GPU', mb:'主機板 MB', ram:'記憶體 RAM', cooler:'散熱', ssd:'固態硬碟 SSD', hdd:'傳統硬碟 HDD', case:'機殼 Case', psu:'電源供應器 PSU' };
            const base = labels[category] || category || '其他零件';
            if (category === 'cooler' && coolingType) return `${base} / ${coolingTypeLabel(coolingType)}`;
            return base;
        }

        function coolingTypeLabel(type) {
            return { liquid: '水冷', fan: '風扇' }[type] || type || '';
        }

        function conditionLabel(condition) {
            const labels = { new:'全新未拆', excellent:'九成新', good:'正常使用', used:'二手零件' };
            return labels[condition] || condition || '二手';
        }

        function placeholderImage() { return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 450%22%3E%3Crect width=%22600%22 height=%22450%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%22300%22 y=%22235%22 text-anchor=%22middle%22 fill=%22%23667285%22 font-size=%2230%22%3ENo Image%3C/text%3E%3C/svg%3E'; }
        function triggerSearch() { const q = document.querySelector('.nav-search').value.trim(); if (q) window.location.href = `/marketplace?q=${encodeURIComponent(q)}`; }
        function handleSearch(event) { if (event.key === 'Enter') triggerSearch(); }
        function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function logout() { localStorage.removeItem('userEmail'); localStorage.removeItem('userName'); window.location.href = '/'; }
    </script>
</body>
</html>
