<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>討論區 | 一次買夠</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        /* --- 基礎色彩與變數設定：與 index.html 完全統一 --- */
        :root {
            --primary-color: #2563eb;      /* 科技藍 */
            --primary-hover: #1d4ed8;
            --secondary-color: #0ea5e9;    /* 亮藍色點綴 */
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 主導覽列 (Main Nav) 狀態修正 --- */
        .main-nav a {
            position: relative;
            padding: 6px 0; /* 增加留白，讓加粗的底線有足夠空間顯示 */
            text-decoration: none;
            transition: color 0.3s ease;
        }

        /* ----- 底邊選取特效加粗且保留特效 ----- */
        .main-nav a::after {
            content: '';
            position: absolute;
            bottom: 0; /* 對齊至 padding 底部 */
            left: 50%;
            width: 0;  /* 預設為 0，透過 hover 觸發展開特效 */
            height: 4px; /* 特效加粗為 4px */
            background: #ffffff;
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 4px; /* 圓潤效果 */
        }

        .main-nav a:hover::after,
        .main-nav a.active::after {
            width: 100%; /* 滑鼠移入，或是目前所在頁面（active）時展開底線 */
        }

        .main-nav a.active {
            color: #ffffff !important; /* 確保白色文字 */
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
            font-weight: 700;
        }

        /* --- 主內容區佈局 --- */
        .container {
            max-width: 1100px; /* 統一容器寬度 */
            margin: 2.5rem auto; /* 加大上下間距 */
            padding: 0 20px;
        }
        
        @media (max-width: 480px) {
            .container { margin: 1.5rem auto; }
        }

        /* --- 現代化卡片式佈局：應用與 index.html 相同的裝飾與動態效果 --- */
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px; /* 統一圓角 */
            box-shadow: var(--shadow-md); /* 統一陰影 */
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
        }

        /* 功能卡片區滑鼠懸停效果 */
        .panel:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        /* --- 發文器 (Composer) 佈局與表單優化 --- */
        .composer {
            padding: 2rem; /* 加大 Padding */
            margin-bottom: 2rem; /* 增加底部間距 */
        }
        
        @media (max-width: 600px) {
            .composer { padding: 1.5rem; }
        }

        .composer h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }
        
        /* 標題前藍色裝飾條 */
        .composer h3::before {
            content: '';
            display: block;
            width: 4px;
            height: 24px;
            background: var(--secondary-color);
            border-radius: 2px;
        }

        .field {
            margin-bottom: 15px; /* 統一表單群組間距 */
            text-align: left;
        }

        /* 行動裝置下拉選單游標修正 */
        select {
             cursor: pointer;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 8px; /* 統一輸入框圓角 */
            padding: 12px 15px;
            font: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background-color: #f8fafc; /* 預設灰白背景 */
            appearance: none; /* 移除 iOS 預設樣式 */
        }
        
        /* 表單 Focus 效果 */
        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            background-color: #ffffff; /* Focus 時改為純白 */
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .field textarea {
            min-height: 140px;
            resize: vertical;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 20px; /* 增加與上方表單距離 */
        }

        /* --- 按鈕 (Button) 現代化與配色統一 --- */
        .btn {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            background: var(--primary-color); /* 主按鈕為科技藍 */
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }

        /* 次要/編輯/刪除按鈕配色 */
        .btn.secondary { background: #94a3b8; }
        .btn.danger { background: #ef4444; } /* 現代紅 */
        .btn.warning { background: #f97316; } /* 現代橘 */

        /* --- 貼文卡片與列表 --- */
        .posts {
            display: grid;
            /* 調整 Grid minmax，平板行動裝置更友善 */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        @media (max-width: 600px) {
             .posts { gap: 1.5rem; }
        }

        .post-card {
            padding: 2rem; /* 加大 Padding */
            /* 貼文左側強調色塊已修正為科技藍 */
            border-left: 5px solid var(--primary-color);
        }
        
        @media (max-width: 600px) {
            .post-card { padding: 1.5rem; }
        }

        .post-head {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: flex-start;
            margin-bottom: 1.25rem;
        }

        .post-title {
            margin: 0;
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.35;
        }

        .meta {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px dashed var(--border-color); /* 增加分割線 */
            padding-bottom: 8px;
        }
        
        .post-body, .reply-body {
            line-height: 1.7;
            white-space: normal;
            word-break: break-word;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        /* 按鈕群組排列修正 */
        .post-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-top: 5px;
        }

        /* 圖片區域與縮圖樣式 */
        .images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 1.25rem;
        }
        .images img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .images img:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-sm);
        }

        /* --- 原地編輯器與回覆表單 --- */
        .inline-editor, .reply-form {
            margin-top: 1rem;
            padding: 1.25rem;
            border-radius: 14px;
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
        }
        .inline-editor textarea, .reply-form textarea {
            min-height: 120px;
            background: white !important; /* 編輯狀態背景為純白 */
        }
        
        .inline-note {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 15px; /* 增加上邊距 */
            text-align: left;
        }

        /* --- 回覆列表與卡片 --- */
        .reply-wrap {
            margin-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.25rem;
        }
        
        .reply-list {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .reply-card {
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: #fbfdff;
        }
        
        .reply-meta {
            color: var(--text-muted);
            font-size: 0.84rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        /* 樣式補強類 */
        .small { font-size: 0.85rem; color: var(--text-muted); }
        .empty {
            padding: 2.5rem 1rem;
            text-align: center;
            color: var(--text-muted);
            background: white;
            border-radius: 16px;
        }

        /* RWD 卡片排列修正 */
        @media (max-width: 720px) {
            .post-head { flex-direction: column; gap: 8px; }
            .post-actions { justify-content: flex-start; width: 100%; margin-top: 8px;}
            .btn { width: auto; font-size: 0.9rem; padding: 8px 16px;}
        }

        /* --- 登入 / 註冊 按鈕文字顏色修正 --- */
        .auth-btn {
            color: #ffffff !important; /* 強制設定為白色 */
            text-decoration: none;     /* 移除超連結底線 */
            font-weight: 600;          /* 稍微加粗讓字體更清晰 */
            transition: color 0.2s;    /* 增加滑鼠移過去的漸變效果 */
        }

        .auth-btn:hover {
            color: #cbd5e1 !important; /* 滑鼠移過時變成淡淡的灰白色，增加互動感 */
        }

    </style>
    <link rel="stylesheet" href="./site-theme.css">
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠</a>
            
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="查詢硬體市價..." onkeydown="handleSearch(event)">
            </div>

            <div class="header-actions">
                <div id="auth-section">
                    <a href="/login" class="auth-btn">登入 / 註冊</a>
                </div>
                
                <div id="user-profile">
                    <div class="avatar">👤</div>
                    <span id="user-display-name">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/recommend.html">智慧推薦</a>
            <a href="/valuation.html">二手硬體估價</a>
            <a href="/forum" class="active">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/benchmark-instructions.html">跑分教學</a>
            <a href="/tools">零件查詢與瓦數計算工具</a>
        </nav>
    </header>

    <div class="container">
        <section class="panel composer">
            <h3 id="composer-title">發佈新討論</h3>
            <div class="field"><input type="text" id="post-title" placeholder="請輸入標題，例如：徵求一張 RTX 3060"></div>
            <div class="field">
                <select id="post-category">
                    <option value="硬體交易">硬體交易</option>
                    <option value="組裝求助">組裝求助</option>
                    <option value="價格詢問">價格詢問</option>
                    <option value="燒機驗證">燒機驗證</option>
                </select>
            </div>
            <div class="field"><textarea id="post-content" placeholder="請輸入內容，支援換行。"></textarea></div>
            <div class="field"><input type="file" id="post-images" multiple accept="image/*"></div>
            <div class="toolbar">
                <button class="btn" id="submit-post-btn" onclick="submitPost()">發表文章</button>
                <button class="btn secondary" id="cancel-edit-btn" onclick="cancelEdit()" style="display:none;">取消編輯</button>
            </div>
            <div class="inline-note">可以直接上傳圖片，文章與回覆都支援原地編輯。</div>
        </section>

        <section id="posts-container" class="posts">
            <div class="empty">載入文章中...</div>
        </section>
    </div>

    <script>
        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
        let currentUser = localStorage.getItem('userEmail') || '';
        let postsCache = [];
        let editingPostId = null;
        let replyingPostId = null;

        function getApiUrl(path) { return `${API_BASE}${path}`; }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatText(value) { return escapeHtml(value).replace(/\n/g, '<br>'); }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function filesToDataUrls(fileList) {
            const files = Array.from(fileList || []);
            return Promise.all(files.map(file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('讀取圖片失敗'));
                reader.readAsDataURL(file);
            })));
        }

        function imageMarkup(images) {
            if (!Array.isArray(images) || images.length === 0) return '';
            return `<div class="images">${images.map(image => `<img src="${image}" alt="貼文圖片">`).join('')}</div>`;
        }

        function renderPostCard(post) {
            const canEdit = currentUser && post.authorEmail === currentUser;
            const isEditing = editingPostId === post.id;
            const isReplying = replyingPostId === post.id;
            const replies = Array.isArray(post.replies) ? post.replies : [];

            return `
                <article class="panel post-card">
                    <div class="post-head">
                        <div>
                            ${isEditing ? `<div class="field"><input id="edit-title-${post.id}" type="text" value="${escapeHtml(post.title)}"></div>` : `<h3 class="post-title">${escapeHtml(post.title)}</h3>`}
                            <div class="meta">分類：${escapeHtml(post.category || '一般討論')} ｜ 作者：${escapeHtml(post.author || '匿名使用者')} ｜ 時間：${formatDate(post.date)}</div>
                        </div>
                        <div class="post-actions">
                            <button class="btn secondary" onclick="toggleReplyForm(${post.id})">回覆</button>
                            ${canEdit ? `<button class="btn warning" onclick="startEditPost(${post.id})">編輯</button>` : ''}
                            ${canEdit ? `<button class="btn danger" onclick="deletePost(${post.id})">刪除</button>` : ''}
                        </div>
                    </div>

                    ${isEditing ? `
                        <div class="inline-editor">
                            <div class="field"><textarea id="edit-content-${post.id}" placeholder="請輸入內容">${escapeHtml(post.content)}</textarea></div>
                            <div class="field"><input type="file" id="edit-images-${post.id}" multiple accept="image/*"></div>
                            ${post.images && post.images.length ? `<div class="small">目前已有 ${post.images.length} 張圖片；若選擇新圖片，將以新圖片取代。</div>` : ''}
                            ${imageMarkup(post.images)}
                            <div class="toolbar">
                                <button class="btn" onclick="savePostEdit(${post.id})">儲存變更</button>
                                <button class="btn secondary" onclick="cancelEdit()">取消</button>
                            </div>
                        </div>
                    ` : `
                        <div class="post-body">${formatText(post.content)}</div>
                        ${imageMarkup(post.images)}
                    `}

                    <div class="reply-wrap">
                        <div class="small">回覆 ${replies.length} 則</div>
                        ${isReplying ? `
                            <div class="reply-form">
                                <div class="field"><textarea id="reply-content-${post.id}" placeholder="寫下你的回覆..."></textarea></div>
                                <div class="field"><input type="file" id="reply-images-${post.id}" multiple accept="image/*"></div>
                                <div class="toolbar">
                                    <button class="btn" onclick="submitReply(${post.id})">送出回覆</button>
                                    <button class="btn secondary" onclick="toggleReplyForm(${post.id})">取消</button>
                                </div>
                            </div>
                        ` : ''}

                        <div class="reply-list">
                            ${replies.length ? replies.map(reply => `
                                <div class="reply-card">
                                    <div class="reply-meta">${escapeHtml(reply.author || '匿名使用者')} ｜ ${formatDate(reply.date)}</div>
                                    <div class="reply-body">${formatText(reply.content)}</div>
                                    ${imageMarkup(reply.images)}
                                </div>
                            `).join('') : `<div class="small">還沒有回覆，先來留下一則吧。</div>`}
                        </div>
                    </div>
                </article>
            `;
        }

        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            if (!posts.length) {
                container.innerHTML = '<div class="empty">目前還沒有文章，來當第一個發文的人吧！</div>';
                return;
            }

            container.innerHTML = posts.map(renderPostCard).join('');
        }

        async function loadPosts() {
            try {
                const response = await fetch(getApiUrl('/api/posts'));
                const posts = await response.json();
                postsCache = Array.isArray(posts) ? posts.sort((a, b) => b.id - a.id) : [];
                renderPosts(postsCache);
            } catch (error) {
                console.error('載入文章失敗:', error);
                document.getElementById('posts-container').innerHTML = '<div class="empty" style="color:#b91c1c;">無法載入文章，請稍後再試。</div>';
            }
        }

        async function submitPost() {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const category = document.getElementById('post-category').value;
            if (!title || !content) {
                alert('標題與內容不能為空！');
                return;
            }

            try {
                const images = await filesToDataUrls(document.getElementById('post-images').files);
                const response = await fetch(getApiUrl('/api/posts'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content, category, author: currentUser || '匿名使用者', images })
                });

                const result = await response.json();
                if (result.success) {
                    document.getElementById('post-title').value = '';
                    document.getElementById('post-content').value = '';
                    document.getElementById('post-images').value = '';
                    await loadPosts();
                } else {
                    alert(result.message || '發文失敗');
                }
            } catch (error) {
                console.error('發文失敗:', error);
                alert('發文失敗');
            }
        }

        function startEditPost(postId) {
            editingPostId = postId;
            replyingPostId = null;
            document.getElementById('composer-title').innerText = '編輯文章';
            document.getElementById('submit-post-btn').style.display = 'none';
            document.getElementById('cancel-edit-btn').style.display = 'inline-block';
            renderPosts(postsCache);
        }

        function cancelEdit() {
            editingPostId = null;
            document.getElementById('composer-title').innerText = '發佈新討論';
            document.getElementById('submit-post-btn').style.display = 'inline-block';
            document.getElementById('cancel-edit-btn').style.display = 'none';
            renderPosts(postsCache);
        }

        function toggleReplyForm(postId) {
            replyingPostId = replyingPostId === postId ? null : postId;
            renderPosts(postsCache);
        }

        async function savePostEdit(postId) {
            const title = document.getElementById(`edit-title-${postId}`).value.trim();
            const content = document.getElementById(`edit-content-${postId}`).value.trim();
            const post = postsCache.find(item => item.id === postId);
            if (!post) {
                alert('找不到要編輯的文章');
                return;
            }
            if (!title || !content) {
                alert('標題與內容不能為空！');
                return;
            }

            try {
                let images = post.images || [];
                const imageInput = document.getElementById(`edit-images-${postId}`);
                if (imageInput && imageInput.files && imageInput.files.length > 0) {
                    images = await filesToDataUrls(imageInput.files);
                }

                const response = await fetch(getApiUrl(`/api/posts/${postId}`), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content, images })
                });

                const result = await response.json();
                if (result.success) {
                    editingPostId = null;
                    document.getElementById('composer-title').innerText = '發佈新討論';
                    document.getElementById('submit-post-btn').style.display = 'inline-block';
                    document.getElementById('cancel-edit-btn').style.display = 'none';
                    await loadPosts();
                } else {
                    alert(result.message || '修改失敗');
                }
            } catch (error) {
                console.error('修改失敗:', error);
                alert('修改失敗');
            }
        }

        async function submitReply(postId) {
            const content = document.getElementById(`reply-content-${postId}`).value.trim();
            if (!content) {
                alert('回覆內容不能為空！');
                return;
            }

            try {
                const images = await filesToDataUrls(document.getElementById(`reply-images-${postId}`).files);
                const response = await fetch(getApiUrl(`/api/posts/${postId}/replies`), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, author: currentUser || '匿名使用者', images })
                });

                const result = await response.json();
                if (result.success) {
                    replyingPostId = null;
                    await loadPosts();
                } else {
                    alert(result.message || '回覆失敗');
                }
            } catch (error) {
                console.error('回覆失敗:', error);
                alert('回覆失敗');
            }
        }

        async function deletePost(postId) {
            if (!confirm('確定刪除文章？')) return;
            try {
                const response = await fetch(getApiUrl(`/api/posts/${postId}`), { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    if (editingPostId === postId) {
                        editingPostId = null;
                        document.getElementById('composer-title').innerText = '發佈新討論';
                        document.getElementById('submit-post-btn').style.display = 'inline-block';
                        document.getElementById('cancel-edit-btn').style.display = 'none';
                    }
                    await loadPosts();
                } else {
                    alert(result.message || '刪除失敗');
                }
            } catch (error) {
                console.error('刪除失敗:', error);
                alert('刪除失敗');
            }
        }

        // Header functionality
        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            alert('已成功登出！');
            window.location.reload();
        }

        function triggerSearch() {
            const input = document.querySelector('.nav-search');
            if (input && input.value.trim()) {
                window.location.href = `/scrape?keyword=${encodeURIComponent(input.value.trim())}`;
            }
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                triggerSearch();
            }
        }

        window.addEventListener('load', () => {
            const userName = localStorage.getItem('userName');
            if (currentUser) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-display-name').innerText = userName ? userName : currentUser.split('@')[0];
            }
            loadPosts();
        });
    </script>
    <script src="./chat-widget.js"></script>
</body>
</html>
