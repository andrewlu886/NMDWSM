<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手硬體估價 | 一次買夠</title>
    <meta name="description" content="輸入硬體型號、使用時間與商品狀況，透過定價模型取得二手硬體價格評估。">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./valuation.css">
    <link rel="stylesheet" href="./site-theme.css">
    <!-- 確保隱藏屬性絕對生效 -->
    <style>
        .valuation-dynamic-group[hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠</a>
            <form class="search-wrapper" action="/scrape" method="get">
                <input type="search" name="keyword" class="nav-search" placeholder="查詢硬體市價..." aria-label="查詢硬體市價">
            </form>
            <div class="header-actions">
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile" style="display:none;">
                    <div class="avatar">👤</div>
                    <span id="user-display-name">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">會員資料</a>
                        <a href="#" id="logout-link">登出</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/recommend.html">智慧推薦</a>
            <a href="/valuation.html" class="active">二手硬體估價</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/benchmark-instructions.html">跑分教學</a>
            <a href="/tools">零件查詢與瓦數計算工具</a>
        </nav>
    </header>

    <main class="nmd-page valuation-page">
        <section class="nmd-hero valuation-hero">
            <div>
                <p class="valuation-eyebrow">HARDWARE VALUATION</p>
                <h1>二手硬體估價模型</h1>
                <p>填入硬體規格與使用狀況，由模型提供價格評估；本工具不包含商品刊登或交易功能。</p>
            </div>
        </section>

        <section class="valuation-card">
            <div class="valuation-heading-row">
                <div>
                    <h2>選擇硬體種類</h2>
                    <p>先選擇分類，再填寫模型需要的基本資料。</p>
                </div>
                <span class="model-badge" id="model-badge">模型待連接</span>
            </div>

            <!-- 移除了 SSD，保留 CPU, GPU, RAM, 主機板, 滑鼠, 鍵盤 -->
            <div class="category-tabs" role="tablist">
                <button type="button" class="category-tab active" role="tab" data-category="cpu">CPU</button>
                <button type="button" class="category-tab" role="tab" data-category="gpu">顯示卡</button>
                <button type="button" class="category-tab" role="tab" data-category="motherboard">主機板</button>
                <button type="button" class="category-tab" role="tab" data-category="ram">記憶體</button>
                <button type="button" class="category-tab" role="tab" data-category="mouse">滑鼠</button>
                <button type="button" class="category-tab" role="tab" data-category="keyboard">鍵盤</button>
            </div>

            <div class="valuation-layout">
                <form id="valuation-form" class="valuation-form">
                    <input type="hidden" id="category" name="category" value="cpu">

                    <!-- 通用基礎欄位：型號與品牌 -->
                    <div class="field full-width">
                        <label for="model">完整型號</label>
                        <input id="model" name="model" type="text" required placeholder="例如：Intel Core i5-13400F">
                    </div>
                    <div class="field">
                        <label for="brand">品牌</label>
                        <input id="brand" name="brand" type="text" required placeholder="例如：Intel">
                    </div>

                    <!-- 1. CPU / 一般核心硬體專屬區塊 -->
                    <div id="cpu-fields" class="valuation-dynamic-group full-width">
                        <div class="field">
                            <label>原始價格（NTD）</label>
                            <input name="cpuOriginalPrice" type="number" min="0" step="1" placeholder="例如：6500">
                        </div>
                        <div class="field">
                            <label>保固月份（到保固期還有多久）</label>
                            <input name="cpuWarrantyMonths" type="number" min="0" step="1" value="0">
                        </div>
                    </div>

                    <!-- 2. RAM 專屬區塊 -->
                    <div id="ram-fields" class="valuation-dynamic-group full-width" hidden>
                        <div class="field">
                            <label>原始價格（NTD）</label>
                            <input name="ramOriginalPrice" type="number" min="0" step="1">
                        </div>
                        <div class="field full-width">
                            <label>特殊的規格或損耗（非功能性故障）</label>
                            <input name="ramSpecialCondition" type="text" placeholder="例如：散熱片輕微刮傷、RGB 燈效偏黃...">
                        </div>
                    </div>

                    <!-- 3. 滑鼠專屬區塊 -->
                    <div id="mouse-fields" class="valuation-dynamic-group full-width" hidden>
                        <div class="field">
                            <label>原始價格（NTD）</label>
                            <input name="mouseOriginalPrice" type="number" min="0" step="1">
                        </div>
                        <div class="field">
                            <label>保固月份（到保固期還有多久）</label>
                            <input name="mouseWarrantyMonths" type="number" min="0" step="1" value="0">
                        </div>
                        <div class="field full-width">
                            <label>使用損耗程度</label>
                            <select name="mouseUsageCondition">
                                <option value="good">正常</option>
                                <option value="minor">輕微損耗 (如：微動偏軟)</option>
                                <option value="heavy">嚴重損耗 (如：連點、滾輪失靈)</option>
                            </select>
                        </div>
                        <div class="field full-width">
                            <label>外觀損耗程度</label>
                            <select name="mouseAppearanceCondition">
                                <option value="good">正常痕跡</option>
                                <option value="minor">輕微打油/掉漆</option>
                                <option value="heavy">嚴重破損/發黏</option>
                            </select>
                        </div>
                    </div>

                    <!-- 4. 鍵盤專屬區塊 -->
                    <div id="keyboard-fields" class="valuation-dynamic-group full-width" hidden>
                        <div class="field">
                            <label>原始價格（NTD）</label>
                            <input name="keyboardOriginalPrice" type="number" min="0" step="1">
                        </div>
                        <div class="field">
                            <label>保固月份（到保固期還有多久）</label>
                            <input name="keyboardWarrantyMonths" type="number" min="0" step="1" value="0">
                        </div>
                        <div class="field full-width">
                            <label>使用損耗程度</label>
                            <select name="keyboardUsageCondition">
                                <option value="good">正常</option>
                                <option value="minor">輕微損耗 (如：個別按鍵手感變差)</option>
                                <option value="heavy">嚴重損耗 (如：卡鍵、失靈)</option>
                            </select>
                        </div>
                        <div class="field full-width">
                            <label>外觀損耗程度</label>
                            <select name="keyboardAppearanceCondition">
                                <option value="good">正常痕跡</option>
                                <option value="minor">鍵帽打油/輕微掉字</option>
                                <option value="heavy">外殼破損/生鏽</option>
                            </select>
                        </div>
                    </div>

                    <button class="valuation-submit full-width" id="valuation-submit" type="submit">
                        <span>✨ 開始估價</span>
                    </button>
                    <p class="form-message full-width" id="form-message" aria-live="polite"></p>
                </form>

                <!-- 右側估價結果 -->
                <aside class="valuation-result" aria-live="polite">
                    <div class="result-empty" id="result-empty">
                        <span class="result-icon">⌁</span>
                        <h3>等待估價資料</h3>
                        <p>完成左側欄位後，模型估價會顯示在這裡。</p>
                    </div>
                    <div class="result-content" id="result-content" hidden>
                        <!-- 加上 result-category -->
                        <p class="result-label">模型估計價格 (<span id="result-category">CPU</span>)</p> 
                        <p class="result-price" id="result-price">NT$ 0</p>
                        <!-- 加上 result-range 與 result-confidence -->
                        <p>價格區間: <span id="result-range">未提供</span></p>
                        <p>模型信心度: <span id="result-confidence">未提供</span></p>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <script src="./valuation.js"></script>
    <script src="./chat-widget.js"></script>
</body>
</html>
