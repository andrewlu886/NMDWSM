<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手硬體估價 | 一次買夠</title>
    <meta name="description" content="輸入硬體型號、使用時間與商品狀況，透過定價模型取得二手硬體價格評估。">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./valuation.css">
    <link rel="stylesheet" href="./site-theme.css">
    <style>
        /* 確保隱藏屬性絕對生效 */
        .valuation-dynamic-group[hidden] {
            display: none !important;
        }

        /* --- 動態漸層導覽列 (加粗動態底線) --- */
        .main-nav {
            background: linear-gradient(90deg, #1e3a8a, #2563eb, #0284c7, #2563eb) !important;
            background-size: 300% 300% !important;
            animation: navGradientMove 10s ease infinite !important;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 12px 0;
        }
        @keyframes navGradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .main-nav a {
            color: rgba(255, 255, 255, 0.9) !important;
            position: relative;
            text-decoration: none;
            padding: 6px 0;
            transition: all 0.3s ease;
        }
        .main-nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 4px;
            background: #ffffff;
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }
        .main-nav a:hover, .main-nav a.active {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            font-weight: bold !important;
        }
        .main-nav a:hover::after, .main-nav a.active::after {
            width: 100%;
        }

        /* --- Logo 微互動 --- */
        .logo {
            transition: transform 0.2s ease;
            display: inline-block;
        }
        .logo:hover {
            transform: scale(1.05);
        }

        /* --- 卡片進場動畫與頂部發光邊框 --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .valuation-card {
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
            transition: all 0.3s ease;
        }
        .valuation-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0284c7, #2563eb, #38bdf8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .valuation-card:hover {
            box-shadow: 0 12px 24px -5px rgba(0, 0, 0, 0.12);
            border-color: rgba(37, 99, 235, 0.3);
        }
        .valuation-card:hover::before {
            opacity: 1;
        }

        /* --- 分類標籤切換與動態選中 --- */
        .category-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }
        .category-tab:hover {
            border-color: #2563eb !important;
            color: #2563eb !important;
            transform: translateY(-2px);
        }
        .category-tab.active {
            background: linear-gradient(135deg, #1d4ed8, #0284c7) !important;
            color: #ffffff !important;
            border-color: transparent !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3) !important;
            transform: translateY(0);
        }

        /* --- 輸入框聚焦藍光 --- */
        .field input, .field select, .nav-search {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .field input:focus, .field select:focus, .nav-search:focus {
            border-color: #3b82f6 !important;
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
            background-color: #ffffff !important;
        }

        /* --- 按鈕金屬光澤掃光動畫 --- */
        .valuation-submit {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #1d4ed8, #0284c7) !important;
            color: #ffffff !important;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            cursor: pointer;
        }
        .valuation-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.35);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }
        .valuation-submit:hover {
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            transform: translateY(-2px);
        }
        .valuation-submit:hover::after {
            left: 140%;
        }
        .valuation-submit:active {
            transform: translateY(1px);
        }

        /* --- 結果顯示平滑淡入 --- */
        .result-content {
            animation: fadeInUp 0.5s ease-out;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠</a>
            <form class="search-wrapper" action="/scrape" method="get">
                <input type="search" name="keyword" class="nav-search" placeholder="查詢硬體市價..." aria-label="查詢硬體市價">
            </form>
            <div class="header-actions">
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile" style="display:none;">
                    <div class="avatar">👤</div>
                    <span id="user-display-name">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">會員資料</a>
                        <a href="#" id="logout-link">登出</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/recommend.html">智慧推薦</a>
            <a href="/valuation.html" class="active">二手硬體估價</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/benchmark-instructions.html">跑分教學</a>
            <a href="/tools">零件查詢與瓦數計算工具</a>
        </nav>
    </header>

    <main class="nmd-page valuation-page">
        <section class="nmd-hero valuation-hero">
            <div>
                <p class="valuation-eyebrow">HARDWARE VALUATION</p>
                <h1>二手硬體估價模型</h1>
                <p>填入硬體規格與使用狀況，由模型提供價格評估；本工具不包含商品刊登或交易功能。</p>
            </div>
        </section>

        <section class="valuation-card">
            <div class="valuation-heading-row">
                <div>
                    <h2>選擇硬體種類</h2>
                    <p>先選擇分類，再填寫模型需要的基本資料。</p>
                </div>
                <span class="model-badge" id="model-badge">模型待連接</span>
            </div>

            <!-- 移除了 SSD，保留 CPU, GPU, RAM, 主機板, 滑鼠, 鍵盤 -->
            <div class="category-tabs" role="tablist">
                <button type="button" class="category-tab active" role="tab" data-category="cpu">CPU</button>
                <button type="button" class="category-tab" role="tab" data-category="gpu">顯示卡</button>
                <button type="button" class="category-tab" role="tab" data-category="motherboard">主機板</button>
                <button type="button" class="category-tab" role="tab" data-category="ram">記憶體</button>
                <button type="button" class="category-tab" role="tab" data-category="mouse">滑鼠</button>
                <button type="button" class="category-tab" role="tab" data-category="keyboard">鍵盤</button>
            </div>

            <div class="valuation-layout">
                <form id="valuation-form" class="valuation-form">
                    <input type="hidden" id="category" name="category" value="cpu">

                    <!-- 通用基礎欄位：型號與品牌 -->
                    <div class="field full-width">
                        <label for="model">完整型號</label>
                        <input id="model" name="model" type="text" required placeholder="例如：Intel Core i5-13400F">
                    </div>
                    <div class="field">
                        <label for="brand">品牌</label>
                        <input id="brand" name="brand" type="text" required placeholder="例如：Intel">
                    </div>

                    <!-- 1. CPU / 一般核心硬體專屬區塊 -->
                    <div id="cpu-fields" class="valuation-dynamic-group full-width">
                        <div class="field">
                            <label>原始價格（NTD）</label>
                            <input name="cpuOriginalPrice" type="number" min="0" step="1" placeholder="例如：6500">
                        </div>
                        <div class="field">
                            <label>保固月份（到保固期還有多久）</label>
                            <input name="cpuWarrantyMonths" type="number" min="0" step="1" value="0">
                        </div>
                    </div>

                    <!-- 2. RAM 專屬區塊 -->
                    <div id="ram-fields" class="valuation-dynamic-group full-width" hidden>
                        <div class="field">
                            <label>原始價格（NTD）</label>
                            <input name="ramOriginalPrice" type="number" min="0" step="1">
                        </div>
                        <div class="field full-width">
                            <label>特殊的規格或損耗（非功能性故障）</label>
                            <input name="ramSpecialCondition" type="text" placeholder="例如：散熱片輕微刮傷、RGB 燈效偏黃...">
                        </div>
                    </div>

                    <!-- 3. 滑鼠專屬區塊 -->
                    <div id="mouse-fields" class="valuation-dynamic-group full-width" hidden>
                        <div class="field">
                            <label>原始價格（NTD）</label>
                            <input name="mouseOriginalPrice" type="number" min="0" step="1">
                        </div>
                        <div class="field">
                            <label>保固月份（到保固期還有多久）</label>
                            <input name="mouseWarrantyMonths" type="number" min="0" step="1" value="0">
                        </div>
                        <div class="field full-width">
                            <label>使用損耗程度</label>
                            <select name="mouseUsageCondition">
                                <option value="good">正常</option>
                                <option value="minor">輕微損耗 (如：微動偏軟)</option>
                                <option value="heavy">嚴重損耗 (如：連點、滾輪失靈)</option>
                            </select>
                        </div>
                        <div class="field full-width">
                            <label>外觀損耗程度</label>
                            <select name="mouseAppearanceCondition">
                                <option value="good">正常痕跡</option>
                                <option value="minor">輕微打油/掉漆</option>
                                <option value="heavy">嚴重破損/發黏</option>
                            </select>
                        </div>
                    </div>

                    <!-- 4. 鍵盤專屬區塊 -->
                    <div id="keyboard-fields" class="valuation-dynamic-group full-width" hidden>
                        <div class="field">
                            <label>原始價格（NTD）</label>
                            <input name="keyboardOriginalPrice" type="number" min="0" step="1">
                        </div>
                        <div class="field">
                            <label>保固月份（到保固期還有多久）</label>
                            <input name="keyboardWarrantyMonths" type="number" min="0" step="1" value="0">
                        </div>
                        <div class="field full-width">
                            <label>使用損耗程度</label>
                            <select name="keyboardUsageCondition">
                                <option value="good">正常</option>
                                <option value="minor">輕微損耗 (如：個別按鍵手感變差)</option>
                                <option value="heavy">嚴重損耗 (如：卡鍵、失靈)</option>
                            </select>
                        </div>
                        <div class="field full-width">
                            <label>外觀損耗程度</label>
                            <select name="keyboardAppearanceCondition">
                                <option value="good">正常痕跡</option>
                                <option value="minor">鍵帽打油/輕微掉字</option>
                                <option value="heavy">外殼破損/生鏽</option>
                            </select>
                        </div>
                    </div>

                    <button class="valuation-submit full-width" id="valuation-submit" type="submit">
                        <span>✨ 開始估價</span>
                    </button>
                    <p class="form-message full-width" id="form-message" aria-live="polite"></p>
                </form>

                <!-- 右側估價結果 -->
                <aside class="valuation-result" aria-live="polite">
                    <div class="result-empty" id="result-empty">
                        <span class="result-icon">⌁</span>
                        <h3>等待估價資料</h3>
                        <p>完成左側欄位後，模型估價會顯示在這裡。</p>
                    </div>
                    <div class="result-content" id="result-content" hidden>
                        <p class="result-label">模型估計價格 (<span id="result-category">CPU</span>)</p>
                        <p class="result-price" id="result-price">NT$ 0</p>
                        <p>價格區間: <span id="result-range">未提供</span></p>
                        <p>模型信心度: <span id="result-confidence">未提供</span></p>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <!-- 直接將估價腳本寫在 HTML 內方便修改 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('valuation-form');
            const categoryTabs = document.querySelectorAll('.category-tab');
            const categoryInput = document.getElementById('category');
            const dynamicGroups = document.querySelectorAll('.valuation-dynamic-group');
            const resultEmpty = document.getElementById('result-empty');
            const resultContent = document.getElementById('result-content');
            const resultPrice = document.getElementById('result-price');
            const resultCategory = document.getElementById('result-category');
            const resultRange = document.getElementById('result-range');
            const resultConfidence = document.getElementById('result-confidence');

            // 分類標籤切換邏輯
            categoryTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // 重置所有 Active 狀態
                    categoryTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    const selectedCategory = tab.dataset.category;
                    categoryInput.value = selectedCategory;

                    // 隱藏所有動態表單區塊
                    dynamicGroups.forEach(group => group.hidden = true);

                    // 根據選擇顯示對應表單區塊
                    if (['cpu', 'gpu', 'motherboard'].includes(selectedCategory)) {
                        document.getElementById('cpu-fields').hidden = false;
                    } else if (selectedCategory === 'ram') {
                        document.getElementById('ram-fields').hidden = false;
                    } else if (selectedCategory === 'mouse') {
                        document.getElementById('mouse-fields').hidden = false;
                    } else if (selectedCategory === 'keyboard') {
                        document.getElementById('keyboard-fields').hidden = false;
                    }
                });
            });

            // 估價公式計算邏輯
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const category = categoryInput.value;
                let estimatedPrice = 0;
                let originalPrice = 0;

                // 預設產品標準總保固期 (以月為單位)
                const STANDARD_WARRANTY_PC = 36; // 核心硬體如 CPU/GPU/MB 預設 3 年保
                const STANDARD_WARRANTY_PERIPHERAL = 24; // 周邊如滑鼠/鍵盤 預設 2 年保

                // -----------------------------------------------------
                // 1. CPU / GPU / 主機板 計算邏輯
                // 根據公式：P1 = P0 * e^(-0.02 * t)
                // -----------------------------------------------------
                if (['cpu', 'gpu', 'motherboard'].includes(category)) {
                    originalPrice = parseFloat(form.cpuOriginalPrice.value) || 0;
                    const warrantyRemaining = parseFloat(form.cpuWarrantyMonths.value) || 0;

                    // 推算已使用月數 t (總保固 - 剩餘保固)
                    let t = STANDARD_WARRANTY_PC - warrantyRemaining;
                    if (t < 0) t = 0; // 避免負值(延長保固等情況)

                    estimatedPrice = originalPrice * Math.exp(-0.02 * t);
                }
                
                // -----------------------------------------------------
                // 2. RAM 記憶體 計算邏輯 (終身保固居多，採自定義微幅折舊)
                // -----------------------------------------------------
                else if (category === 'ram') {
                    originalPrice = parseFloat(form.ramOriginalPrice.value) || 0;
                    const condition = form.ramSpecialCondition.value;
                    // 若有填寫特殊非功能性故障/損耗，扣減較多；否則一般視為 85 折左右
                    let penalty = condition.trim().length > 0 ? 0.70 : 0.85;
                    estimatedPrice = originalPrice * penalty;
                }
                
                // -----------------------------------------------------
                // 3. 滑鼠 / 鍵盤 計算邏輯 (漸近線邊際遞減公式 - 參數微調)
                // 公式：P1 = P_floor + (P_start - P_floor) * e^(-k * t)
                // -----------------------------------------------------
                else if (['mouse', 'keyboard'].includes(category)) {
                    let prefix = category === 'mouse' ? 'mouse' : 'keyboard';
                    originalPrice = parseFloat(form[`${prefix}OriginalPrice`].value) || 0;
                    const warrantyRemaining = parseFloat(form[`${prefix}WarrantyMonths`].value) || 0;
                    const usageCondition = form[`${prefix}UsageCondition`].value;
                    const appearanceCondition = form[`${prefix}AppearanceCondition`].value;

                    // 推算已使用月數 t
                    let t = STANDARD_WARRANTY_PERIPHERAL - warrantyRemaining;
                    if (t < 0) t = 0;

                    // 1. 定義底價係數 (Floor Ratio)
                    // 雙正常底線 = 0.40 (4成)
                    // 雙輕微底線 = 0.20 (2成)
                    let floorApp = appearanceCondition === 'good' ? 0.25 : (appearanceCondition === 'minor' ? 0.10 : 0);
                    let floorUsage = usageCondition === 'good' ? 0.15 : (usageCondition === 'minor' ? 0.10 : 0);
                    let floorRatio = floorApp + floorUsage;
                    let pFloor = originalPrice * floorRatio;

                    // 2. 定義起價係數 (Start Ratio，t=0拆封時的殘值係數)
                    // 雙正常總合 = 1.0 (原價起算)
                    // 雙輕微總合 = 0.58 
                    let startApp = appearanceCondition === 'good' ? 0.6 : (appearanceCondition === 'minor' ? 0.33 : 0.15);
                    let startUsage = usageCondition === 'good' ? 0.4 : (usageCondition === 'minor' ? 0.25 : 0.1);
                    let startRatio = startApp + startUsage;
                    let pStart = originalPrice * startRatio;

                    // 3. 邊際遞減運算
                    // 提高衰減常數 k，讓 24 個月時的折舊精準落在目標價位
                    const k = 0.042; 
                    estimatedPrice = pFloor + (pStart - pFloor) * Math.exp(-k * t);
                }

                // 確保價格不為負數
                estimatedPrice = Math.max(0, estimatedPrice);

                // -----------------------------------------------------
                // 渲染結果至畫面
                // -----------------------------------------------------
                resultEmpty.hidden = true;
                resultContent.hidden = false;

                const finalPrice = Math.round(estimatedPrice);
                
                // 產生上下 10% 的合理收購/販售價格區間
                const rangeMin = Math.round(finalPrice * 0.9);
                const rangeMax = Math.round(finalPrice * 1.1);

                const categoryNames = {
                    cpu: 'CPU',
                    gpu: '顯示卡',
                    motherboard: '主機板',
                    ram: '記憶體',
                    mouse: '滑鼠',
                    keyboard: '鍵盤'
                };

                // 加入一點載入感視覺效果
                resultContent.style.opacity = '0';
                setTimeout(() => {
                    resultCategory.textContent = categoryNames[category] || category.toUpperCase();
                    resultPrice.textContent = `NT$ ${finalPrice.toLocaleString()}`;
                    resultRange.textContent = `NT$ ${rangeMin.toLocaleString()} - NT$ ${rangeMax.toLocaleString()}`;
                    
                    // 決定模型信心度
                    if (originalPrice === 0) {
                        resultConfidence.textContent = '無法評估 (缺少原價)';
                        resultConfidence.style.color = '#ef4444';
                    } else {
                        resultConfidence.textContent = finalPrice > 0 ? '高 (85%) - 基於演算法與市價折舊' : '偏低 (硬體殘值過低)';
                        resultConfidence.style.color = finalPrice > 0 ? '#10b981' : '#f59e0b';
                    }
                    
                    resultContent.style.transition = 'opacity 0.4s ease';
                    resultContent.style.opacity = '1';
                }, 100);
            });
        });
    </script>
    <script src="./chat-widget.js"></script>
</body>
</html>
