<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入 | 一次估夠</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./site-theme.css">
    <style>
        /* --- 全站統一變數 (沿用你的新版型) --- */
        :root {
            --primary-color: #2563eb;     /* 皇家藍 */
            --primary-hover: #1d4ed8;     /* 深藍 */
            --secondary-color: #0284c7;   /* 湛藍 */
            --tertiary-color: #38bdf8;    /* 天藍 */
            
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --glow-color: rgba(37, 99, 235, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- 頂部 Header --- */
        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(to right, #1d4ed8, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }
        .logo:hover {
            transform: scale(1.03);
        }

        .search-wrapper {
            display: flex;
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .nav-search {
            width: 100%;
            padding: 10px 16px;
            border: 1.5px solid #3b82f6;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            color: var(--text-main);
        }

        .nav-search::placeholder { color: #64748b; }
        .nav-search:focus {
            background: #ffffff;
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .header-actions .auth-btn {
            background: linear-gradient(135deg, #1d4ed8, #0284c7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .header-actions .auth-btn:hover {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        #user-profile {
            display: none;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            position: relative;
        }
        #user-display-name { color: var(--text-main) !important; font-weight: 500;}
        .avatar { background: #e2e8f0; padding: 5px; border-radius: 50%; }
        
        /* --- 動態漸層主導覽列 --- */
        .main-nav {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a, #2563eb, #0284c7, #2563eb);
            background-size: 300% 300%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 12px 0;
            margin: 0;
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-nav a {
            color: rgba(255, 255, 255, 0.95);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            padding: 6px 0;
            transition: color 0.3s ease;
        }

        .main-nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0; 
            height: 4px;
            background: #ffffff;
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 4px;
        }
        
        .main-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        
        .main-nav a:hover::after,
        .main-nav a.active::after {
            width: 100%; 
        }

        .main-nav a.active {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
            font-weight: 700;
        }

        /* --- 登入表單專區佈局 --- */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 150px);
            padding: 3rem 20px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 2.8rem;
            border-radius: 16px;
            box-shadow: var(--shadow-lg); /* 沿用新版型的陰影 */
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeInUp 0.6s ease-out; /* 沿用新版型的進場動畫 */
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #0284c7, #2563eb, #38bdf8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .login-container:hover::before {
            opacity: 1;
        }

        .card-header-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2rem;
            display: block;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        
        .card-header-logo span {
            color: var(--primary-color);
            font-weight: normal;
            font-size: 1rem;
            margin-left: 5px;
        }

        /* 頁籤 */
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }
        .tab {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            font-size: 1rem;
        }
        .tab:hover { color: var(--text-main); }
        .tab.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        /* 表單與輸入框 */
        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-light);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-group input::placeholder { color: #94a3b8; }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* 新版型專屬按鈕特效 */
        .btn-submit {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(135deg, #1d4ed8, #0284c7);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-top: 10px;
        }
        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 20%; height: 200%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }
        .btn-submit:hover { 
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            transform: translateY(-2px);
        }
        .btn-submit:hover::after { left: 140%; }
        .btn-submit:active { 
            transform: translateY(1px); 
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .footer-links { margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-muted); }
        .footer-links a { color: var(--primary-color); text-decoration: none; margin: 0 5px; transition: color 0.3s; }
        .footer-links a:hover { color: var(--secondary-color); text-decoration: underline; }
        
        #register-form { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <a href="/" class="logo"> 一次估夠</a>
            
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="查詢硬體市價..." onkeydown="handleSearch(event)" aria-label="查詢硬體市價">
            </div>

            <div class="header-actions">
                <div id="auth-section">
                    <a href="/login" class="auth-btn">登入 / 註冊</a>
                </div>
                
                <div id="user-profile">
                    <div class="avatar">👤</div>
                    <span id="user-display-name">載入中...</span>
                    <div class="dropdown-menu" style="display:none; position:absolute; top:40px; right:0; background:#fff; border:1px solid #ddd; padding:10px; border-radius:8px; box-shadow:var(--shadow-md);">
                        <a href="/account.html" style="display:block; padding:5px 0; color:#333; text-decoration:none;">我的帳戶</a>
                        <a href="#" onclick="logout()" style="display:block; padding:5px 0; color:red; text-decoration:none;">登出</a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 取消首頁底線，將展開狀態移至最後的「會員中心」 -->
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/recommend.html">智慧推薦</a>
            <a href="/valuation.html">二手硬體估價</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/benchmark-instructions.html">跑分教學</a>
            <a href="/tools">零件查詢與瓦數計算工具</a>
            <!-- 這個項目保持預設展開，讓用戶知道身處會員頁面 -->
            <a href="/login" class="active">會員中心</a>
        </nav>
    </header>

    <!-- 登入與註冊主體 -->
    <div class="login-wrapper">
        <div class="login-container">
            <a href="/" class="card-header-logo">一次估夠 <span>| 會員中心</span></a>
            
            <!-- 頁籤切換 -->
            <div class="tabs">
                <div class="tab active" id="tab-login" onclick="switchTab('login')">會員登入</div>
                <div class="tab" id="tab-register" onclick="switchTab('register')">註冊帳號</div>
            </div>

            <!-- 登入表單 -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">電子郵件 / 帳號</label>
                    <input type="text" id="login-email" placeholder="請輸入您的帳號" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">密碼</label>
                    <input type="password" id="login-password" placeholder="請輸入密碼" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit">立即登入</button>
                <div class="footer-links">
                    <a href="#">忘記密碼？</a>
                </div>
            </form>

            <!-- 註冊表單 -->
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-name">全名</label>
                    <input type="text" id="reg-name" placeholder="例如：王小明" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">電子郵件</label>
                    <input type="email" id="reg-email" placeholder="您的@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="reg-password">密碼</label>
                    <input type="password" id="reg-password" placeholder="至少 8 位字元" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="reg-confirm">確認密碼</label>
                    <input type="password" id="reg-confirm" placeholder="再次輸入密碼" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-submit">建立帳號</button>
            </form>
        </div>
    </div>

    <script>
        // API 路徑設定
        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
        function getApiUrl(path) { return `${API_BASE}${path}`; }

        // 會員狀態檢查與右上角頭像邏輯 (沿用新版型)
        window.onload = function() {
            const loggedInUser = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (loggedInUser) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-display-name').innerText = userName ? userName : loggedInUser.split('@')[0];
            }
            
            document.getElementById('user-profile').addEventListener('click', function() {
                const menu = this.querySelector('.dropdown-menu');
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            });
        };

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            alert('已成功登出');
            window.location.reload();
        }

        // 搜尋列邏輯
        function handleSearch(event) {
            if (event.key === 'Enter') triggerSearch();
        }
        function triggerSearch() {
            const input = document.querySelector('.nav-search');
            if (input && input.value.trim()) {
                window.location.href = `/scrape?keyword=${encodeURIComponent(input.value.trim())}`;
            }
        }

        // 登入與註冊頁籤切換
        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');

            if (type === 'login') {
                loginForm.style.display = 'block'; regForm.style.display = 'none';
                loginTab.classList.add('active'); regTab.classList.remove('active');
            } else {
                loginForm.style.display = 'none'; regForm.style.display = 'block';
                loginTab.classList.remove('active'); regTab.classList.add('active');
            }
        }

        // 處理登入 API 請求
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(getApiUrl('/api/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                if (result.success) {
                    alert('✅ ' + result.message);
                    localStorage.setItem('userEmail', email); 
                    if (result.user && result.user.username) {
                        localStorage.setItem('userName', result.user.username);
                    }
                    window.location.href = '/'; 
                } else {
                    alert('❌ 登入失敗：' + result.message);
                }
            } catch (error) {
                console.error('登入請求錯誤：', error);
                alert('無法連接到服務器，請確保後端伺服器正在運行。');
            }
        }

        // 處理註冊 API 請求
        async function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm').value;

            if (password !== confirmPassword) {
                alert('❌ 密碼與確認密碼不一致');
                return;
            }

            try {
                const response = await fetch(getApiUrl('/api/register'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, confirmPassword })
                });

                const result = await response.json();
                
                if (result.success) {
                    alert('✅ ' + result.message);
                    setTimeout(() => switchTab('login'), 500);
                } else {
                    alert('❌ 註冊失敗：' + result.message);
                }
            } catch (error) {
                console.error('❌ 註冊請求出錯：', error);
                alert('無法連接到服務器，請確保後端伺服器正在運行。');
            }
        }
    </script>
    <script src="./chat-widget.js"></script>
</body>
</html>
