<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手商城 | 二手硬體交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* 商城專屬版面佈局 */
        .marketplace-layout {
            display: flex;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
            gap: 30px;
        }

        /* 側邊欄 (分類/篩選) */
        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            align-self: flex-start;
            position: sticky;
            top: 150px;
        }

        .filter-section {
            margin-bottom: 25px;
        }

        .filter-title {
            font-size: 1.1rem;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .category-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .category-list li {
            margin-bottom: 10px;
        }

        .category-list a {
            text-decoration: none;
            color: #555;
            transition: color 0.2s, padding-left 0.2s;
            display: block;
        }

        .category-list a:hover,
        .category-list a.active {
            color: var(--secondary-color);
            font-weight: bold;
            padding-left: 5px;
        }

        /* 價格區間篩選 */
        .price-filter input {
            width: 40%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }
        
        .price-filter button {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: var(--primary-color);
        }

        /* 主內容區 (商品列表) */
        .main-content {
            flex-grow: 1;
        }

        .page-title { 
            color: var(--primary-color); 
            margin-top: 0;
            margin-bottom: 1.5rem; 
            font-size: 1.8rem; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sort-select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* 商品卡片網格 */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 1px solid #f9f9f9;
        }

        .product-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.12); 
            border-color: #eee;
        }

        /* 標籤 */
        .condition-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(46, 204, 113, 0.1);
            color: #27ae60;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .product-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; line-height: 1.4; padding-right: 70px; }
        .product-category { font-size: 0.85rem; color: #95a5a6; margin-bottom: 12px; }
        .product-price { font-size: 1.4rem; color: var(--accent-color); font-weight: bold; margin-bottom: 10px; }
        .product-desc { font-size: 0.9rem; color: #666; margin-bottom: 20px; flex-grow: 1; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .card-actions {
            display: flex;
            gap: 10px;
        }

        .add-to-cart-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            flex-grow: 1;
            transition: background 0.3s;
        }
        .add-to-cart-btn:hover { background: #2980b9; }

        .view-btn {
            background: #f1f2f6;
            color: var(--primary-color);
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .view-btn:hover { background: #dfe4ea; }

        /* 手機版排版調整 */
        @media (max-width: 768px) {
            .marketplace-layout { flex-direction: column; }
            .sidebar { width: auto; position: static; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <a href="/" class="logo">轉轉轉二手平台</a>
            
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品或文章..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">🔍</button>
            </div>

            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">
                    🛒 <span id="cart-count" class="cart-count">0</span>
                </a>
                
                <div id="auth-section">
                    <a href="/login" class="auth-btn">登入 / 註冊</a>
                </div>
                
                <div id="user-profile">
                    <div class="avatar">👤</div>
                    <span id="user-display-name" style="color: white; font-size: 0.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="/products.html">我的商品</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/marketplace" class="active">🛒 商城</a>
            <a href="#">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/seller">賣家中心</a>
        </nav>
    </header>

    <div class="marketplace-layout">
        <!-- 左側邊欄 -->
        <aside class="sidebar">
            <div class="filter-section">
                <h3 class="filter-title">商品分類</h3>
                <ul class="category-list">
                    <li><a href="#" class="active" onclick="filterCategory('all', event)">全部商品</a></li>
                    <li><a href="#" onclick="filterCategory('cpu', event)">處理器 (CPU)</a></li>
                    <li><a href="#" onclick="filterCategory('gpu', event)">顯示卡 (GPU)</a></li>
                    <li><a href="#" onclick="filterCategory('mb', event)">主機板 (MB)</a></li>
                    <li><a href="#" onclick="filterCategory('ram', event)">記憶體 (RAM)</a></li>
                    <li><a href="#" onclick="filterCategory('ssd', event)">固態硬碟 (SSD)</a></li>
                    <li><a href="#" onclick="filterCategory('hdd', event)">傳統硬碟 (HDD)</a></li>
                </ul>
            </div>

            <div class="filter-section">
                <h3 class="filter-title">價格區間</h3>
                <div class="price-filter">
                    <input type="number" id="min-price" placeholder="最低"> - 
                    <input type="number" id="max-price" placeholder="最高">
                    <button class="btn-action" onclick="applyFilters()">篩選</button>
                </div>
            </div>
        </aside>

        <!-- 右側主要內容 -->
        <main class="main-content">
            <div class="page-title">
                <span id="current-category-title">全部商品</span>
                <select class="sort-select" id="sort-select" onchange="applyFilters()">
                    <option value="newest">最新上架</option>
                    <option value="price-asc">價格：由低到高</option>
                    <option value="price-desc">價格：由高到低</option>
                </select>
            </div>
            
            <div id="products-container" class="products-grid">
                <p style="text-align: center; width: 100%; grid-column: 1 / -1; color: #999; padding: 40px 0;">載入商品中...</p>
            </div>
        </main>
    </div>

    <script>
        let allProducts = []; // 儲存所有商品資料供前端篩選

        window.onload = async function() {
            const loggedInUser = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (loggedInUser) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-display-name').innerText = userName ? userName : loggedInUser.split('@')[0];
            }

            updateCartCount();
            await fetchProducts();
        };

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            alert('已成功登出！');
            window.location.reload();
        }
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            document.getElementById('cart-count').innerText = count;
        }

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                allProducts = await res.json();
                renderProducts(allProducts);
            } catch (err) {
                console.error('抓取商品失敗', err);
                document.getElementById('products-container').innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1/-1; color: red;">載入商品失敗，請稍後再試。</p>';
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('products-container');
            if (products.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px 20px; background: white; border-radius: 8px;">
                        <div style="font-size: 3rem; margin-bottom: 10px; color: #ccc;">🔍</div>
                        <p style="color: #777; font-size: 1.1rem;">找不到符合條件的商品</p>
                        <button class="btn-action" style="margin-top: 10px;" onclick="resetFilters()">清除篩選條件</button>
                    </div>`;
                return;
            }

            let html = '';
            products.forEach(p => {
                // 模擬商品狀況標籤
                const conditions = ['全新未拆', '9成新', '過保良品', '平台認證'];
                const randomCondition = conditions[Math.floor(Math.random() * conditions.length)];

                html += `
                    <div class="product-card">
                        <div class="condition-badge">${randomCondition}</div>
                        <div>
                            <div class="product-title">${p.title}</div>
                            <div class="product-category">${p.category}</div>
                            <div class="product-price">NT$ ${p.price.toLocaleString()}</div>
                            <div class="product-desc" title="${p.desc}">${p.desc}</div>
                            <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 15px;">賣家: ${p.seller.split('@')[0]}</div>
                        </div>
                        <div class="card-actions">
                            <button class="add-to-cart-btn" onclick='addToCart(${JSON.stringify(p)})'>加購物車</button>
                            <button class="view-btn" onclick="alert('商品詳情頁建置中')">詳情</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- 篩選與排序邏輯 ---
        let currentCategory = 'all';

        function filterCategory(category, event) {
            if(event) event.preventDefault();
            
            // 更新 UI 狀態
            document.querySelectorAll('.category-list a').forEach(el => el.classList.remove('active'));
            if(event) event.target.classList.add('active');
            
            const titles = {
                'all': '全部商品', 'cpu': '處理器 (CPU)', 'gpu': '顯示卡 (GPU)', 
                'mb': '主機板 (MB)', 'ram': '記憶體 (RAM)', 'ssd': '固態硬碟 (SSD)', 'hdd': '傳統硬碟 (HDD)'
            };
            document.getElementById('current-category-title').innerText = titles[category] || category;
            
            currentCategory = category;
            applyFilters();
        }

        function applyFilters() {
            let filtered = [...allProducts];

            // 1. 分類篩選
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }

            // 2. 價格篩選
            const minPrice = parseInt(document.getElementById('min-price').value) || 0;
            const maxPrice = parseInt(document.getElementById('max-price').value) || Infinity;
            filtered = filtered.filter(p => p.price >= minPrice && p.price <= maxPrice);

            // 3. 排序
            const sortBy = document.getElementById('sort-select').value;
            if (sortBy === 'price-asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortBy === 'price-desc') {
                filtered.sort((a, b) => b.price - a.price);
            } else {
                // 預設 newest (這裡假設 id 越大越新)
                filtered.sort((a, b) => b.id - a.id);
            }

            renderProducts(filtered);
        }

        function resetFilters() {
            document.getElementById('min-price').value = '';
            document.getElementById('max-price').value = '';
            document.getElementById('sort-select').value = 'newest';
            filterCategory('all'); // 會自動呼叫 applyFilters() 並更新 UI
        }

        // --- 購物車與搜尋 ---
        function addToCart(product) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existingItem = cart.find(item => item.id === product.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title,
                    price: parseFloat(product.price),
                    seller: product.seller,
                    quantity: 1
                });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert('已加入購物車！');
        }

        function triggerSearch() {
            const query = document.querySelector('.nav-search').value.trim().toLowerCase();
            if (!query) return;

            let filtered = allProducts.filter(p => 
                p.title.toLowerCase().includes(query) || 
                p.desc.toLowerCase().includes(query)
            );
            
            document.getElementById('current-category-title').innerText = `搜尋結果: "${query}"`;
            renderProducts(filtered);
        }
        
        function handleSearch(event) {
            if (event.key === 'Enter') triggerSearch();
        }
    </script>
</body>
</html>
