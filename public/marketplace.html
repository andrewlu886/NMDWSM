<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城 | 一次買夠二手交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .marketplace-layout { display: grid; grid-template-columns: 260px 1fr; max-width: 1200px; margin: 2rem auto; padding: 0 20px; gap: 24px; }
        .sidebar { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 3px 12px rgba(15,23,42,0.06); align-self: start; position: sticky; top: 130px; }
        .filter-title { margin: 0 0 12px; color: var(--primary-color); font-size: 1rem; }
        .filter-section { margin-bottom: 22px; }
        .category-list { list-style: none; padding: 0; margin: 0; }
        .category-list a { display: block; padding: 8px 0; color: #475467; text-decoration: none; }
        .category-list a.active, .category-list a:hover { color: var(--secondary-color); font-weight: 800; }
        .filter-input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 8px; }
        .page-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--primary-color); margin: 0 0 18px; }
        .sort-select { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: white; }
        .search-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 18px; }
        .search-tag { border: 1px solid #d7e3ef; background: #fff; color: #475467; border-radius: 999px; padding: 7px 12px; font-weight: 800; cursor: pointer; }
        .search-tag.active { background: var(--secondary-color); color: #fff; border-color: var(--secondary-color); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
        .product-card { background: white; border: 1px solid #edf0f4; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(15,23,42,0.06); display: flex; flex-direction: column; min-height: 100%; }
        .product-image { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #eef2f7; }
        .product-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .product-title { color: #1f2937; font-weight: 800; line-height: 1.35; min-height: 44px; }
        .product-price { color: var(--accent-color); font-size: 1.35rem; font-weight: 900; }
        .product-desc { color: #667085; font-size: 0.9rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .meta { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { background: #eef6ff; color: #2563eb; padding: 3px 7px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .card-actions button { border: 0; border-radius: 6px; padding: 9px; cursor: pointer; font-weight: 800; }
        .primary { background: var(--secondary-color); color: white; }
        .secondary { background: #f1f5f9; color: #1f2937; }
        .empty { grid-column: 1 / -1; background: white; padding: 44px; border-radius: 8px; text-align: center; color: #667085; }
        @media (max-width: 820px) { .marketplace-layout { grid-template-columns: 1fr; } .sidebar { position: static; } }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠二手交易平台</a>
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">搜尋</button>
            </div>
            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">購物車 <span id="cart-count" class="cart-count">0</span></a>
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile">
                    <div class="avatar">U</div>
                    <span id="user-display-name" style="color: white; font-size: 0.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="/products.html">我的商品</a>
                        <a href="/transactions">我的交易</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/marketplace" class="active">商城</a>
            <a href="/#recommend">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/seller">賣家中心</a>
        </nav>
    </header>

    <div class="marketplace-layout">
        <aside class="sidebar">
            <div class="filter-section">
                <h3 class="filter-title">商品分類</h3>
                <ul class="category-list">
                    <li><a href="#" class="active" onclick="filterCategory('all', event)">全部商品</a></li>
                    <li><a href="#" onclick="filterCategory('cpu', event)">處理器 CPU</a></li>
                    <li><a href="#" onclick="filterCategory('gpu', event)">顯示卡 GPU</a></li>
                    <li><a href="#" onclick="filterCategory('mb', event)">主機板 MB</a></li>
                    <li><a href="#" onclick="filterCategory('ram', event)">記憶體 RAM</a></li>
                    <li><a href="#" onclick="filterCategory('cooler', event)">散熱</a></li>
                    <li><a href="#" onclick="filterCategory('ssd', event)">固態硬碟 SSD</a></li>
                    <li><a href="#" onclick="filterCategory('hdd', event)">傳統硬碟 HDD</a></li>
                    <li><a href="#" onclick="filterCategory('case', event)">機殼 Case</a></li>
                    <li><a href="#" onclick="filterCategory('psu', event)">電源供應器 PSU</a></li>
                </ul>
            </div>
            <div class="filter-section">
                <h3 class="filter-title">價格區間</h3>
                <input class="filter-input" type="number" id="min-price" placeholder="最低價格">
                <input class="filter-input" type="number" id="max-price" placeholder="最高價格">
                <button class="btn-action" onclick="applyFilters()" style="width:100%;">套用篩選</button>
            </div>
            <div class="filter-section">
                <h3 class="filter-title">推薦用途</h3>
                <select class="filter-input" id="usage-filter" onchange="applyFilters()">
                    <option value="all">全部用途</option>
                    <option value="遊戲">遊戲</option>
                    <option value="文書">文書</option>
                    <option value="剪輯">剪輯</option>
                    <option value="收藏/備品">收藏/備品</option>
                </select>
            </div>
        </aside>

        <main>
            <div class="page-title">
                <span id="current-category-title">全部商品</span>
                <select class="sort-select" id="sort-select" onchange="applyFilters()">
                    <option value="newest">最新上架</option>
                    <option value="price-asc">價格低到高</option>
                    <option value="price-desc">價格高到低</option>
                    <option value="views">熱門瀏覽</option>
                </select>
            </div>
            <div class="search-tags" aria-label="搜尋篩選標籤">
                <button class="search-tag" type="button" data-field="category" data-value="gpu" onclick="toggleSearchTag(this)">顯示卡 GPU</button>
                <button class="search-tag" type="button" data-field="category" data-value="cpu" onclick="toggleSearchTag(this)">處理器 CPU</button>
                <button class="search-tag" type="button" data-field="category" data-value="cooler" onclick="toggleSearchTag(this)">散熱</button>
                <button class="search-tag" type="button" data-field="usageTag" data-value="遊戲" onclick="toggleSearchTag(this)">遊戲</button>
                <button class="search-tag" type="button" data-field="location" data-value="ASUS" onclick="toggleSearchTag(this)">ASUS</button>
                <button class="search-tag" type="button" data-field="location" data-value="GIGABYTE" onclick="toggleSearchTag(this)">GIGABYTE</button>
                <button class="search-tag" type="button" data-field="location" data-value="MSI" onclick="toggleSearchTag(this)">MSI</button>
            </div>
            <div id="products-container" class="products-grid">
                <div class="empty">載入商品中...</div>
            </div>
        </main>
    </div>

    <script>
        let allProducts = [];
        let currentCategory = 'all';
        let currentKeyword = '';
        const selectedTags = new Map();

        window.onload = async function() {
            const loggedInUser = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (loggedInUser) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-display-name').innerText = userName || loggedInUser.split('@')[0];
            }
            const q = new URLSearchParams(window.location.search).get('q');
            if (q) {
                currentKeyword = q.toLowerCase();
                document.querySelector('.nav-search').value = q;
            }
            await updateCartCount();
            await fetchProducts();
        };

        function placeholderImage() {
            return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 450%22%3E%3Crect width=%22600%22 height=%22450%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%22300%22 y=%22235%22 text-anchor=%22middle%22 fill=%22%23667285%22 font-size=%2230%22%3ENo Image%3C/text%3E%3C/svg%3E';
        }

        async function fetchProducts() {
            const res = await fetch('/api/products');
            allProducts = await res.json();
            applyFilters();
        }

        function renderProducts(products) {
            const container = document.getElementById('products-container');
            if (!products.length) {
                container.innerHTML = '<div class="empty">找不到符合條件的商品。</div>';
                return;
            }

            container.innerHTML = products.map(product => `
                <article class="product-card">
                    <img class="product-image" src="${product.image || placeholderImage()}" alt="${product.title}">
                    <div class="product-body">
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">NT$ ${Number(product.price).toLocaleString()}</div>
                        <div class="meta">
                            <span class="tag">${categoryLabel(product.category)}</span>
                            <span class="tag">${conditionLabel(product.condition)}</span>
                            <span class="tag">${product.location || '廠家名稱'}</span>
                            <span class="tag">${product.usageTag || '未分類'}</span>
                            <span class="tag">瀏覽 ${product.views || 0}</span>
                        </div>
                        <div class="product-desc">${product.desc || '賣家尚未填寫商品描述'}</div>
                        <div style="font-size:0.84rem;color:#98a2b3;">賣家：${product.seller || '使用者'}</div>
                        <div class="card-actions">
                            <button class="primary" onclick="addToCart(${product.id})">加入購物車</button>
                            <button class="secondary" onclick="window.location.href='/product?id=${product.id}'">詳情</button>
                            <button class="secondary" onclick="addFavorite(${product.id})">收藏</button>
                            <button class="primary" onclick="buyNow(${product.id})">我要購買</button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function filterCategory(category, event) {
            if (event) event.preventDefault();
            currentCategory = category;
            document.querySelectorAll('.category-list a').forEach(link => link.classList.remove('active'));
            if (event) event.target.classList.add('active');
            const titles = { all: '全部商品', cpu: '處理器 CPU', gpu: '顯示卡 GPU', mb: '主機板 MB', ram: '記憶體 RAM', cooler: '散熱', ssd: '固態硬碟 SSD', hdd: '傳統硬碟 HDD', case: '機殼 Case', psu: '電源供應器 PSU' };
            document.getElementById('current-category-title').innerText = titles[category] || category;
            applyFilters();
        }

        function toggleSearchTag(button) {
            const key = `${button.dataset.field}:${button.dataset.value}`;
            if (selectedTags.has(key)) {
                selectedTags.delete(key);
                button.classList.remove('active');
            } else {
                selectedTags.set(key, { field: button.dataset.field, value: button.dataset.value });
                button.classList.add('active');
            }
            applyFilters();
        }

        function matchesSelectedTags(product) {
            for (const tag of selectedTags.values()) {
                const productValue = tag.field === 'category'
                    ? normalizeCategory(product.category)
                    : String(product[tag.field] || '').toLowerCase();
                const tagValue = String(tag.value || '').toLowerCase();
                if (!productValue.includes(tagValue)) return false;
            }
            return true;
        }

        function normalizeCategory(category) {
            const value = String(category || '').toLowerCase();
            if (value.includes('cpu') || value.includes('處理器')) return 'cpu';
            if (value.includes('gpu') || value.includes('顯示卡')) return 'gpu';
            if (value.includes('mb') || value.includes('motherboard') || value.includes('主機板')) return 'mb';
            if (value.includes('ram') || value.includes('記憶體')) return 'ram';
            if (value.includes('cooler') || value.includes('散熱')) return 'cooler';
            if (value.includes('ssd') || value.includes('固態硬碟')) return 'ssd';
            if (value.includes('hdd') || value.includes('傳統硬碟')) return 'hdd';
            if (value.includes('case') || value.includes('機殼')) return 'case';
            if (value.includes('psu') || value.includes('電源')) return 'psu';
            return value;
        }

        function categoryLabel(category) {
            const labels = {
                cpu: '處理器 CPU',
                gpu: '顯示卡 GPU',
                mb: '主機板 MB',
                ram: '記憶體 RAM',
                cooler: '散熱',
                ssd: '固態硬碟 SSD',
                hdd: '傳統硬碟 HDD',
                case: '機殼 Case',
                psu: '電源供應器 PSU'
            };
            return labels[normalizeCategory(category)] || category || '未分類';
        }

        function conditionLabel(condition) {
            const labels = {
                new: '全新未拆',
                excellent: '近全新',
                good: '正常使用',
                used: '有使用痕跡'
            };
            return labels[condition] || condition || '二手';
        }

        function categorySearchText(category) {
            const normalized = normalizeCategory(category);
            const labels = {
                cpu: 'cpu 處理器 中央處理器 processor intel amd',
                gpu: 'gpu 顯示卡 graphics card nvidia geforce rtx amd radeon',
                mb: 'mb 主機板 motherboard',
                ram: 'ram 記憶體 memory ddr4 ddr5',
                cooler: '散熱 cooler 風扇 水冷 塔散',
                ssd: 'ssd 固態硬碟 nvme m2',
                hdd: 'hdd 傳統硬碟 hard disk',
                case: 'case 機殼 chassis atx matx itx',
                psu: 'psu 電源 電源供應器 power supply 金牌 銅牌'
            };
            return labels[normalized] || category || '';
        }

        function conditionSearchText(condition) {
            const labels = {
                new: 'new 全新 未拆 全新未拆',
                excellent: 'excellent 極新 近全新',
                good: 'good 正常使用 二手',
                used: 'used 二手 使用痕跡'
            };
            return labels[condition] || condition || '';
        }

        function productSearchText(product) {
            return [
                product.title,
                product.desc,
                product.category,
                categorySearchText(product.category),
                product.condition,
                conditionSearchText(product.condition),
                product.location,
                product.usageTag,
                product.seller,
                '標籤 已驗證零件 參考市價 上架中'
            ].filter(Boolean).join(' ').toLowerCase();
        }

        function applyFilters() {
            const minPrice = parseInt(document.getElementById('min-price').value, 10) || 0;
            const maxPrice = parseInt(document.getElementById('max-price').value, 10) || Infinity;
            const usage = document.getElementById('usage-filter').value;
            const sortBy = document.getElementById('sort-select').value;
            const keywords = currentKeyword.split(/\s+/).filter(Boolean);

            let filtered = allProducts.filter(product => {
                const matchesCategory = currentCategory === 'all' || normalizeCategory(product.category) === currentCategory;
                const matchesPrice = product.price >= minPrice && product.price <= maxPrice;
                const matchesUsage = usage === 'all' || product.usageTag === usage;
                const text = productSearchText(product);
                const matchesKeyword = !keywords.length || keywords.every(keyword => text.includes(keyword));
                return matchesCategory && matchesPrice && matchesUsage && matchesKeyword && matchesSelectedTags(product) && product.status === 'active';
            });

            if (sortBy === 'price-asc') filtered.sort((a, b) => a.price - b.price);
            if (sortBy === 'price-desc') filtered.sort((a, b) => b.price - a.price);
            if (sortBy === 'views') filtered.sort((a, b) => (b.views || 0) - (a.views || 0));
            if (sortBy === 'newest') filtered.sort((a, b) => b.id - a.id);

            renderProducts(filtered);
        }

        async function addToCart(productId) {
            const userEmail = localStorage.getItem('userEmail');
            if (!userEmail) return goLogin();
            const res = await fetch('/api/cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, productId })
            });
            const result = await res.json();
            alert(result.message || (result.success ? '已加入購物車' : '加入失敗'));
            await updateCartCount();
        }

        async function addFavorite(productId) {
            const userEmail = localStorage.getItem('userEmail');
            if (!userEmail) return goLogin();
            const res = await fetch('/api/favorites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, productId })
            });
            const result = await res.json();
            alert(result.message || '已加入收藏');
        }

        async function buyNow(productId) {
            const userEmail = localStorage.getItem('userEmail');
            if (!userEmail) return goLogin();
            window.location.href = `/checkout?productId=${productId}`;
        }

        function goLogin() {
            alert('請先登入後再操作');
            window.location.href = '/login';
        }

        async function updateCartCount() {
            const userEmail = localStorage.getItem('userEmail');
            const cartCountEl = document.getElementById('cart-count');
            if (!userEmail) {
                cartCountEl.innerText = 0;
                return;
            }
            const res = await fetch(`/api/cart?userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            const items = result.success ? result.data : [];
            cartCountEl.innerText = items.reduce((total, item) => total + (parseInt(item.quantity, 10) || 1), 0);
        }

        function triggerSearch() {
            currentKeyword = document.querySelector('.nav-search').value.trim().toLowerCase();
            applyFilters();
        }

        function handleSearch(event) { if (event.key === 'Enter') triggerSearch(); }
        function logout() { localStorage.removeItem('userEmail'); localStorage.removeItem('userName'); window.location.reload(); }
    </script>
</body>
</html>
