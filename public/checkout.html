<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結帳 | 一次買夠二手交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background: var(--nmd-bg); }
        .checkout-product { display:grid; grid-template-columns:110px 1fr auto; gap:16px; align-items:center; padding:18px; }
        .checkout-product img { width:110px; height:86px; border-radius:12px; object-fit:cover; background:#eef2f7; border:1px solid #edf1f5; }
        .checkout-note { min-height:120px; resize:vertical; }
        @media(max-width:720px){ .checkout-product{grid-template-columns:1fr;} .checkout-product img{width:100%;height:180px;} }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠二手交易平台</a>
            <div class="search-wrapper"><input type="text" class="nav-search" placeholder="搜尋商品..." onkeydown="handleSearch(event)"><button class="search-btn" onclick="triggerSearch()">搜尋</button></div>
            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">購物車<span id="cart-count" class="cart-count">0</span></a>
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile"><div class="avatar">U</div><span id="user-display-name" style="color:white;font-size:.95rem;">載入中...</span><div class="dropdown-menu"><a href="/account.html">我的帳戶</a><a href="/transactions">購買清單</a><a href="#" onclick="logout()">登出</a></div></div>
            </div>
        </div>
        <nav class="main-nav"><a href="/">首頁</a><a href="/marketplace">商城</a><a href="/#recommend">智慧推薦</a><a href="/forum">討論區</a><a href="/scrape">市價查詢</a><a href="/seller">賣家中心</a></nav>
    </header>

    <main class="nmd-page">
        <div class="nmd-hero"><div><h1>結帳確認</h1><p>確認商品與交易備註。本平台目前為展示用流程，不含真實金流與物流。</p></div></div>
        <div class="nmd-grid-2">
            <section class="nmd-card">
                <div class="nmd-card-pad" style="border-bottom:1px solid #edf1f5;"><h2>訂單商品</h2></div>
                <div id="product-area">載入商品中...</div>
                <div class="nmd-card-pad">
                    <label class="nmd-label" for="order-note">買家備註</label>
                    <textarea id="order-note" class="nmd-field checkout-note" placeholder="例如：希望週末面交，現場測試外觀、序號與配件。"></textarea>
                    <h3>交易方式</h3>
                    <div class="nmd-field">面交測試 / 私訊聯絡，平台僅展示交易流程。</div>
                </div>
            </section>
            <aside id="summary-area" class="nmd-card nmd-card-pad">載入摘要中...</aside>
        </div>
    </main>

    <script>
        let product = null;

        window.onload = async function() {
            const userEmail = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (!userEmail) { alert('請先登入後再結帳'); window.location.href = '/login'; return; }
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-profile').style.display = 'flex';
            document.getElementById('user-display-name').innerText = userName || userEmail.split('@')[0];
            await updateCartCount();
            await loadProduct();
        };

        async function loadProduct() {
            const id = new URLSearchParams(window.location.search).get('productId');
            if (!id) { document.getElementById('product-area').innerHTML = '<div class="nmd-empty">缺少商品 id。</div>'; return; }
            const res = await fetch(`/api/products/${id}`);
            if (!res.ok) { document.getElementById('product-area').innerHTML = '<div class="nmd-empty">找不到商品。</div>'; return; }
            product = await res.json();
            renderProduct();
        }

        function renderProduct() {
            document.getElementById('product-area').innerHTML = `
                <div class="checkout-product">
                    <img src="${escapeHtml(product.image || placeholderImage())}" alt="${escapeHtml(product.title)}">
                    <div><strong>${escapeHtml(product.title)}</strong><div class="nmd-muted">賣家：${escapeHtml(product.seller || '平台使用者')}</div><div class="nmd-muted">廠商 / 品牌：${escapeHtml(product.location || '未提供')}</div></div>
                    <strong class="nmd-price">NT$ ${Number(product.price || 0).toLocaleString()}</strong>
                </div>`;
            document.getElementById('summary-area').innerHTML = `
                <h2>付款摘要</h2>
                <div class="nmd-summary-line"><span>商品金額</span><strong>NT$ ${Number(product.price || 0).toLocaleString()}</strong></div>
                <div class="nmd-summary-line"><span>平台金流</span><strong>展示用</strong></div>
                <div class="nmd-summary-line"><span>物流</span><strong>面交 / 聯絡</strong></div>
                <div class="nmd-total-line"><span>總計</span><span class="nmd-price">NT$ ${Number(product.price || 0).toLocaleString()}</span></div>
                <button class="nmd-btn" style="width:100%;" onclick="createOrder()">送出訂單</button>
                <a class="nmd-btn secondary" style="width:100%;margin-top:10px;" href="/product?id=${product.id}">返回商品</a>`;
        }

        async function createOrder() {
            if (!product || product.status !== 'active') { alert('商品目前不可購買'); return; }
            const userEmail = localStorage.getItem('userEmail');
            const note = document.getElementById('order-note').value.trim() || '訂單確認頁建立';
            const res = await fetch('/api/transactions', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userEmail, productId: product.id, note }) });
            const result = await res.json();
            if (!result.success) { alert(result.message || '建立訂單失敗'); return; }
            window.location.href = '/transactions';
        }

        async function updateCartCount() {
            const userEmail = localStorage.getItem('userEmail');
            const res = await fetch(`/api/cart?userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            const items = result.success ? result.data : [];
            document.getElementById('cart-count').innerText = items.reduce((sum, item) => sum + (parseInt(item.quantity, 10) || 1), 0);
        }

        function placeholderImage(){ return 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 450%22%3E%3Crect width=%22600%22 height=%22450%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%22300%22 y=%22235%22 text-anchor=%22middle%22 fill=%22%23667285%22 font-size=%2230%22%3ENo Image%3C/text%3E%3C/svg%3E'; }
        function triggerSearch(){ const q=document.querySelector('.nav-search').value.trim(); if(q) window.location.href=`/marketplace?q=${encodeURIComponent(q)}`; }
        function handleSearch(event){ if(event.key==='Enter') triggerSearch(); }
        function escapeHtml(value){ return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function logout(){ localStorage.removeItem('userEmail'); localStorage.removeItem('userName'); window.location.href='/'; }
    </script>
</body>
</html>
