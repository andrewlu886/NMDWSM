<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賣家中心 | 一次買夠二手交易平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .container { max-width: 980px; margin: 2rem auto; padding: 0 20px; display: grid; grid-template-columns: 1.4fr 0.9fr; gap: 24px; }
        .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; box-shadow: 0 4px 14px rgba(15,23,42,0.06); }
        h2 { margin: 0 0 18px; color: var(--primary-color); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { margin-bottom: 14px; }
        .form-group.full { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 6px; color: #4b5563; font-weight: 700; font-size: 0.9rem; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        .check-row { display: flex; align-items: center; gap: 8px; color: #4b5563; }
        .check-row input { width: auto; }
        .btn { width: 100%; padding: 12px; border: 0; border-radius: 6px; color: white; background: var(--secondary-color); font-weight: 700; cursor: pointer; }
        .btn:hover { background: #2980b9; }
        .preview-image { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: #eef2f7; border: 1px solid #e5e7eb; }
        .preview-title { margin: 12px 0 6px; font-size: 1.2rem; font-weight: 800; color: #1f2937; }
        .preview-price { color: var(--accent-color); font-size: 1.4rem; font-weight: 800; }
        .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .tag { background: #eef6ff; color: #2563eb; padding: 4px 8px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; }
        .seller-subnav { grid-column: 1 / -1; display: flex; gap: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); }
        .seller-subnav a { text-decoration: none; color: #475467; font-weight: 800; padding: 9px 14px; border-radius: 6px; }
        .seller-subnav a.active, .seller-subnav a:hover { background: var(--secondary-color); color: #fff; }
        @media (max-width: 820px) { .container { grid-template-columns: 1fr; } .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div class="header-main">
            <a href="/" class="logo">一次買夠二手交易平台</a>
            <div class="search-wrapper">
                <input type="text" class="nav-search" placeholder="搜尋商品..." onkeydown="handleSearch(event)">
                <button class="search-btn" onclick="triggerSearch()">搜尋</button>
            </div>
            <div class="header-actions">
                <a href="/cart" class="cart-link" title="購物車">購物車 <span id="cart-count" class="cart-count">0</span></a>
                <div id="auth-section"><a href="/login" class="auth-btn">登入 / 註冊</a></div>
                <div id="user-profile">
                    <div class="avatar">U</div>
                    <span id="user-display-name" style="color: white; font-size: 0.95rem;">載入中...</span>
                    <div class="dropdown-menu">
                        <a href="/account.html">我的帳戶</a>
                        <a href="/products.html">我的商品</a>
                        <a href="/transactions">我的交易</a>
                        <a href="#" onclick="logout()">登出</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <a href="/">首頁</a>
            <a href="/marketplace">商城</a>
            <a href="/#recommend">智慧推薦</a>
            <a href="/forum">討論區</a>
            <a href="/scrape">市價查詢</a>
            <a href="/seller" class="active">賣家中心</a>
        </nav>
    </header>

    <main class="container">
        <div class="seller-subnav">
            <a href="/seller" class="active">新增商品</a>
            <a href="/products.html">我的商品</a>
            <a href="/transactions">我的交易</a>
        </div>
        <section class="panel">
            <h2 id="page-title">新增商品</h2>
            <form id="seller-form" onsubmit="submitProduct(event)">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="product-title">商品名稱</label>
                        <input type="text" id="product-title" placeholder="例如 RTX 3060 12G 顯示卡" required>
                    </div>
                    <div class="form-group">
                        <label for="product-category">分類</label>
                        <select id="product-category" required>
                            <option value="gpu">顯示卡 GPU</option>
                            <option value="cpu">處理器 CPU</option>
                            <option value="mb">主機板 MB</option>
                            <option value="ram">記憶體 RAM</option>
                            <option value="cooler">散熱</option>
                            <option value="ssd">固態硬碟 SSD</option>
                            <option value="hdd">傳統硬碟 HDD</option>
                            <option value="case">機殼 Case</option>
                            <option value="psu">電源供應器 PSU</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-price">價格 NTD</label>
                        <input type="number" id="product-price" min="1" placeholder="例如 4500" required>
                    </div>
                    <div class="form-group">
                        <label for="product-condition">商品狀況</label>
                        <select id="product-condition">
                            <option value="new">全新未拆</option>
                            <option value="excellent">近全新</option>
                            <option value="good" selected>正常使用</option>
                            <option value="used">有使用痕跡</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-location">廠家名稱</label>
                        <input type="text" id="product-location" placeholder="例如 ASUS / GIGABYTE / MSI">
                    </div>
                    <div class="form-group">
                        <label for="product-usage">推薦用途</label>
                        <select id="product-usage">
                            <option value="遊戲">遊戲</option>
                            <option value="文書">文書</option>
                            <option value="剪輯">剪輯</option>
                            <option value="收藏/備品">收藏/備品</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-quantity">數量</label>
                        <input type="number" id="product-quantity" min="1" value="1" placeholder="例如 1">
                    </div>
                    <div class="form-group full" id="product-benchmark-group">
                        <label for="product-benchmark-log">跑分軟體檢測</label>
                        <div style="display:flex; gap:8px; align-items:flex-start;">
                            <textarea id="product-benchmark-log" placeholder="請貼上 OCCT log 內容" rows="5" style="flex:1"></textarea>
                            <div style="display:flex; flex-direction:column; gap:8px;">
                                <button id="parse-benchmark-btn" type="button" class="btn" style="padding:8px 12px; height:40px;">解析 log</button>
                                <a href="/benchmark-instructions.html" target="_blank" style="display:inline-block; padding:8px 12px; background:#eef6ff; color:#2563eb; border-radius:6px; text-decoration:none; text-align:center;">跑分軟體使用方法</a>
                            </div>
                        </div>
                        <div id="benchmark-parse-result" style="margin-top:8px; color:#0f172a; font-weight:700;"></div>
                        <div style="margin-top:8px; display:flex; gap:8px;">
                            <div style="flex:1;">
                                <label style="display:block; color:#475467; font-weight:700; font-size:0.9rem;">Read</label>
                                <input id="product-benchmark-read" readonly style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid #d1d5db; background:#f8fafc;" />
                            </div>
                            <div style="flex:1;">
                                <label style="display:block; color:#475467; font-weight:700; font-size:0.9rem;">Write</label>
                                <input id="product-benchmark-write" readonly style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid #d1d5db; background:#f8fafc;" />
                            </div>
                            <div style="flex:1;">
                                <label style="display:block; color:#475467; font-weight:700; font-size:0.9rem;">Combined</label>
                                <input id="product-benchmark-combined" readonly style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid #d1d5db; background:#f8fafc;" />
                            </div>
                        </div>
                        <input type="hidden" id="product-benchmark-score" />
                    </div>
                    <div class="form-group full">
                        <label for="product-image">商品圖片網址</label>
                        <input type="url" id="product-image" placeholder="https://...jpg" oninput="updatePreview()">
                    </div>
                    <div class="form-group full">
                        <label for="product-desc">商品描述</label>
                        <textarea id="product-desc" placeholder="說明使用時間、保固、測試狀況、配件..." required></textarea>
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="btn">送出商品</button>
            </form>
        </section>

        <aside class="panel">
            <h2>商品預覽</h2>
            <img id="preview-image" class="preview-image" alt="商品預覽">
            <div class="preview-title" id="preview-title">商品名稱</div>
            <div class="preview-price" id="preview-price">NT$ 0</div>
            <p id="preview-desc" style="color:#667085; line-height:1.6;">商品描述會顯示在這裡。</p>
            <div class="meta">
                <span class="tag" id="preview-condition">正常使用</span>
                <span class="tag" id="preview-location">廠家名稱</span>
                <span class="tag" id="preview-usage">遊戲</span>
                <span class="tag" id="preview-benchmark">未提供分數</span>
                <span class="tag" id="preview-benchmark-read">R:-</span>
                <span class="tag" id="preview-benchmark-write">W:-</span>
                <span class="tag" id="preview-benchmark-combined">C:-</span>
                <span class="tag" id="preview-benchmark-raw">未提供 log</span>
                <span class="tag">已驗證零件</span>
            </div>
        </aside>
    </main>

    <script>
        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
        let editingProductId = null;

        function getApiUrl(path) { return `${API_BASE}${path}`; }

        window.onload = async function() {
            const loggedInUser = localStorage.getItem('userEmail');
            const userName = localStorage.getItem('userName');
            if (!loggedInUser) {
                alert('請先登入後再使用賣家中心');
                window.location.href = '/login';
                return;
            }

            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-profile').style.display = 'flex';
            document.getElementById('user-display-name').innerText = userName || loggedInUser.split('@')[0];
            updateCartCount();
            bindPreview();
            updateBenchmarkVisibility();

            const id = new URLSearchParams(window.location.search).get('id');
            if (id) await loadProduct(id);
            updatePreview();
        };

        function bindPreview() {
            ['product-title', 'product-price', 'product-desc', 'product-condition', 'product-location', 'product-usage'].forEach(id => {
                document.getElementById(id).addEventListener('input', updatePreview);
                document.getElementById(id).addEventListener('change', updatePreview);
            });
            document.getElementById('product-category').addEventListener('change', () => {
                updateBenchmarkVisibility();
            });
            const logEl = document.getElementById('product-benchmark-log');
            if (logEl) {
                document.getElementById('parse-benchmark-btn').addEventListener('click', () => {
                    updateParsedBenchmark();
                });
                logEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || e.shiftKey) === false) {
                        e.preventDefault();
                        updateParsedBenchmark();
                    }
                });
                logEl.addEventListener('input', () => {
                    // clear result when user edits
                    document.getElementById('benchmark-parse-result').innerText = '';
                });
            }
        }

        function updateBenchmarkVisibility() {
            const category = document.getElementById('product-category').value;
            const benchmarkGroup = document.getElementById('product-benchmark-group');
            if (!benchmarkGroup) return;
            benchmarkGroup.style.display = (category === 'gpu' || category === 'cpu') ? '' : 'none';
        }

        async function loadProduct(id) {
            editingProductId = id;
            document.getElementById('page-title').innerText = '編輯商品';
            document.getElementById('submit-btn').innerText = '儲存修改';
            const res = await fetch(getApiUrl(`/api/products/${id}`));
            if (!res.ok) {
                alert('找不到商品');
                window.location.href = '/products.html';
                return;
            }
            const product = await res.json();
            document.getElementById('product-title').value = product.title || '';
            document.getElementById('product-category').value = product.category || 'gpu';
            document.getElementById('product-price').value = product.price || '';
            document.getElementById('product-desc').value = product.desc || '';
            document.getElementById('product-image').value = product.image || '';
            document.getElementById('product-benchmark-log').value = product.benchmarkLog || '';
            document.getElementById('product-benchmark-score').value = product.benchmarkScore || '';
            document.getElementById('product-benchmark-read').value = product.benchmarkRead || '';
            document.getElementById('product-benchmark-write').value = product.benchmarkWrite || '';
            document.getElementById('product-benchmark-combined').value = product.benchmarkCombined || '';
            document.getElementById('product-condition').value = product.condition || 'good';
            document.getElementById('product-location').value = product.location || '';
            document.getElementById('product-usage').value = product.usageTag || '遊戲';
            document.getElementById('product-quantity').value = product.quantity || 1;
            updatePreview();
            updateParsedBenchmark();
        }

        function updateParsedBenchmark() {
            const log = document.getElementById('product-benchmark-log')?.value || '';
            const scores = parseBenchmarkScore(log) || { read: null, write: null, combined: null, best: null };
            const resultEl = document.getElementById('benchmark-parse-result');
            if (scores.read || scores.write || scores.combined) {
                resultEl.innerText = `Read : ${scores.read || '-'}\nWrite : ${scores.write || '-'}\nCombined : ${scores.combined || '-'} `;
            } else if (log.trim().length === 0) {
                resultEl.innerText = '';
            } else {
                resultEl.innerText = '未能解析分數，請確認已貼上完整 OCCT log。';
            }

            document.getElementById('product-benchmark-read').value = scores.read || '';
            document.getElementById('product-benchmark-write').value = scores.write || '';
            document.getElementById('product-benchmark-combined').value = scores.combined || '';
            document.getElementById('product-benchmark-score').value = scores.best || '';

            document.getElementById('preview-benchmark').innerText = scores.best ? `分數 ${scores.best}` : '未提供分數';
            document.getElementById('preview-benchmark-read').innerText = `R:${scores.read || '-'}`;
            document.getElementById('preview-benchmark-write').innerText = `W:${scores.write || '-'}`;
            document.getElementById('preview-benchmark-combined').innerText = `C:${scores.combined || '-'}`;
        }

        function updatePreview() {
            const image = document.getElementById('product-image').value.trim();
            document.getElementById('preview-image').src = image || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 450%22%3E%3Crect width=%22600%22 height=%22450%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%22300%22 y=%22235%22 text-anchor=%22middle%22 fill=%22%23667285%22 font-size=%2230%22%3EProduct Image%3C/text%3E%3C/svg%3E';
            document.getElementById('preview-title').innerText = document.getElementById('product-title').value || '商品名稱';
            document.getElementById('preview-price').innerText = `NT$ ${(parseInt(document.getElementById('product-price').value, 10) || 0).toLocaleString()}`;
            document.getElementById('preview-desc').innerText = document.getElementById('product-desc').value || '商品描述會顯示在這裡。';
            document.getElementById('preview-condition').innerText = document.getElementById('product-condition').selectedOptions[0].text;
            document.getElementById('preview-location').innerText = document.getElementById('product-location').value || '廠家名稱';
            document.getElementById('preview-usage').innerText = document.getElementById('product-usage').value;
            const bs = document.getElementById('product-benchmark-log')?.value || '';
            const parsed = parseBenchmarkScore(bs) || { read: null, write: null, combined: null, best: null };
            document.getElementById('preview-benchmark').innerText = parsed.best ? `分數 ${parsed.best}` : '未提供分數';
            document.getElementById('preview-benchmark-read').innerText = `R:${parsed.read || '-'}`;
            document.getElementById('preview-benchmark-write').innerText = `W:${parsed.write || '-'}`;
            document.getElementById('preview-benchmark-combined').innerText = `C:${parsed.combined || '-'}`;
            document.getElementById('product-benchmark-score').value = parsed.best || '';
            const rawPreview = bs ? (bs.length > 30 ? bs.slice(0, 30) + '...' : bs) : '未提供 log';
            document.getElementById('preview-benchmark-raw').innerText = rawPreview;
        }

        function parseBenchmarkScore(log) {
            if (!log || typeof log !== 'string') return { read: null, write: null, combined: null, best: null };

            function findLabel(labels) {
                for (const label of labels) {
                    const re = new RegExp(label + '\\s*[:\\-]?\\s*(\\d+(?:\\.\\d+)?)', 'i');
                    const m = log.match(re);
                    if (m && m[1]) return Number(m[1]);
                }
                return null;
            }

            let read = findLabel(['Read', 'Sequential Read', 'Seq Read']);
            let write = findLabel(['Write', 'Sequential Write', 'Seq Write']);
            let combined = findLabel(['Combined', 'Overall', 'Combined Score', 'Total Score']);

            if ((!read || !write || !combined)) {
                const nums = [...log.matchAll(/(\d+(?:\.\d+)?)/g)].map(m => Number(m[1]));
                if (!combined && nums.length) {
                    const sorted = nums.slice().sort((a,b)=>b-a);
                    if (sorted.length) combined = combined || sorted[0];
                }
                if (!read && nums.length) read = read || nums[0] || null;
                if (!write && nums.length>1) write = write || nums[1] || null;
            }

            const best = combined || read || write || null;
            return { read: read || null, write: write || null, combined: combined || null, best };
        }

        async function submitProduct(event) {
            event.preventDefault();
            const seller = localStorage.getItem('userEmail');
            const payload = {
                seller,
                title: document.getElementById('product-title').value.trim(),
                category: document.getElementById('product-category').value,
                price: document.getElementById('product-price').value.trim(),
                desc: document.getElementById('product-desc').value.trim(),
                image: document.getElementById('product-image').value.trim(),
                benchmarkLog: document.getElementById('product-benchmark-log').value.trim(),
                benchmarkScore: document.getElementById('product-benchmark-score').value ? parseFloat(document.getElementById('product-benchmark-score').value) : null,
                benchmarkRead: document.getElementById('product-benchmark-read').value ? parseFloat(document.getElementById('product-benchmark-read').value) : null,
                benchmarkWrite: document.getElementById('product-benchmark-write').value ? parseFloat(document.getElementById('product-benchmark-write').value) : null,
                benchmarkCombined: document.getElementById('product-benchmark-combined').value ? parseFloat(document.getElementById('product-benchmark-combined').value) : null,
                condition: document.getElementById('product-condition').value,
                location: document.getElementById('product-location').value.trim(),
                usageTag: document.getElementById('product-usage').value,
                status: 'active',
                quantity: parseInt(document.getElementById('product-quantity').value, 10) || 1,
                negotiable: false
            };

            const res = await fetch(getApiUrl(editingProductId ? `/api/products/${editingProductId}` : '/api/products'), {
                method: editingProductId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.success) {
                alert(editingProductId ? '商品已更新' : '商品已上架');
                window.location.href = '/products.html';
            } else {
                alert(result.message || '儲存失敗');
            }
        }

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            window.location.href = '/';
        }

        async function updateCartCount() {
            const userEmail = localStorage.getItem('userEmail');
            const cartCountEl = document.getElementById('cart-count');
            if (!cartCountEl || !userEmail) return;
            const res = await fetch(`/api/cart?userEmail=${encodeURIComponent(userEmail)}`);
            const result = await res.json();
            const items = result.success ? result.data : [];
            cartCountEl.innerText = items.reduce((total, item) => total + (parseInt(item.quantity, 10) || 1), 0);
        }

        function triggerSearch() {
            const input = document.querySelector('.nav-search');
            if (input.value.trim()) window.location.href = `/marketplace?q=${encodeURIComponent(input.value.trim())}`;
        }

        function handleSearch(event) {
            if (event.key === 'Enter') triggerSearch();
        }
    </script>
</body>
</html>
