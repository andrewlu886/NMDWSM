<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>討論區 | 二手硬體交易平台</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 導覽列 (與首頁共用) */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo { font-size: 1.5rem; font-weight: bold; text-decoration: none; color: white;}
        nav { display: flex; align-items: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: 500; }
        
        /* 搜尋框樣式 */
        .nav-search {
            padding: 6px 15px;
            border: none;
            border-radius: 20px;
            margin: 0 15px;
            outline: none;
            font-size: 0.9rem;
            width: 200px;
            transition: box-shadow 0.3s;
        }
        .nav-search:focus {
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* 討論區主體 */
        .container { max-width: 900px; margin: 2rem auto; padding: 0 20px; }
        .forum-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #ddd;
            padding-bottom: 1rem;
        }
        .btn-post {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-post:hover { background-color: #2980b9; }

        /* 文章列表 */
        .post-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .post-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .post-title { font-size: 1.25rem; font-weight: bold; color: var(--primary-color); margin-top: 0; margin-bottom: 10px; cursor: pointer; }
        .post-meta { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 15px; display: flex; gap: 15px; }
        .post-content { line-height: 1.6; color: #555; }

        /* 發文彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content { background: white; width: 500px; padding: 2.5rem; border-radius: 12px; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #999; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 120px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">轉轉轉二手交易平台</a>
        <nav>
            <a href="index.html">首頁</a>
            <a href="#">智慧推薦</a>
            <a href="forum.html" style="color: var(--secondary-color);">討論區</a>
            <input type="text" class="nav-search" placeholder="搜尋商品或文章..." onkeydown="handleSearch(event)">
            <a href="login.html" id="auth-link">會員登入</a>
        </nav>
    </header>

    <div class="container">
        <div class="forum-header">
            <h2>社群討論區</h2>
            <button class="btn-post" onclick="openPostModal()">+ 發表文章</button>
        </div>

        <div id="posts-container">
            <p style="text-align: center; color: #999;">載入中...</p>
        </div>
    </div>

    <div class="modal-overlay" id="postModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePostModal()">&times;</span>
            <h3 style="margin-top:0; color: var(--primary-color);">新增討論文章</h3>
            <div class="form-group">
                <label>文章標題</label>
                <input type="text" id="post-title" placeholder="請輸入簡明扼要的標題">
            </div>
            <div class="form-group">
                <label>文章內容</label>
                <textarea id="post-content" placeholder="請詳細描述你想討論的內容..."></textarea>
            </div>
            <button class="btn-post" style="width: 100%;" onclick="submitPost()">發布</button>
        </div>
    </div>

    <script>
        // 格式化時間
        function formatDate(isoString) {
            const date = new Date(isoString);
            return `${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getDate().toString().padStart(2,'0')} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
        }

        // 載入文章列表
        async function loadPosts() {
            try {
                const response = await fetch('/api/posts');
                const posts = await response.json();
                const container = document.getElementById('posts-container');
                
                // 如果目前沒有任何文章，顯示提示訊息
                if (posts.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #999;">目前還沒有文章，來當第一個發文的人吧！</p>';
                    return;
                }

                container.innerHTML = posts.map(post => `
                    <div class="post-card">
                        <h3 class="post-title">${post.title}</h3>
                        <div class="post-meta">
                            <span>👤 ${post.author}</span>
                            <span>🕒 ${formatDate(post.date)}</span>
                        </div>
                        <div class="post-content">${post.content}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('載入文章失敗:', error);
                document.getElementById('posts-container').innerHTML = '<p style="text-align: center; color: red;">無法載入文章，請稍後再試。</p>';
            }
        }

        // 彈窗控制
        function openPostModal() { document.getElementById('postModal').style.display = 'flex'; }
        function closePostModal() { 
            document.getElementById('postModal').style.display = 'none'; 
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
        }

        // 提交文章
        async function submitPost() {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();

            if (!title || !content) {
                return alert('標題與內容不能為空！');
            }

            try {
                const response = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        author: "測試用戶" // 實務上這裡會從登入的 Session/Token 抓取
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('發文成功！');
                    closePostModal();
                    loadPosts(); // 重新載入文章列表
                } else {
                    alert('發文失敗：' + result.message);
                }
            } catch (error) {
                console.error('發文錯誤:', error);
                alert('發文發生錯誤，請檢查網路連線。');
            }
        }

        // --- 搜尋功能 ---
        // 攔截輸入框的 Enter 按鍵事件
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = event.target.value.trim();
                if (query) {
                    alert('執行搜尋：' + query + '\n(此處可串接後端 API 或進行頁面跳轉)');
                }
            }
        }

        // 點擊彈窗外部關閉
        window.onclick = function(event) {
            const modal = document.getElementById('postModal');
            if (event.target == modal) closePostModal();
        }

        // 初始化載入
        loadPosts();
    </script>
</body>
</html>
